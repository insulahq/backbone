name: ansible-lint

on:
  push:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-lint.yml"
      - ".pre-commit-config.yaml"
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-lint.yml"
      - ".pre-commit-config.yaml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible and tools
        run: pip install "ansible-core>=2.17" "ansible-lint>=24.0" yamllint

      - name: Install required collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run yamllint
        run: yamllint -c ansible/.yamllint ansible/
        continue-on-error: true

      - name: Run ansible syntax check
        run: |
          ansible-playbook --syntax-check ansible/site.yml
          for f in ansible/deploy-*.yml; do
            ansible-playbook --syntax-check "$f"
          done

      - name: Run ansible-lint
        run: ansible-lint -c ansible/.ansible-lint ansible/

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
