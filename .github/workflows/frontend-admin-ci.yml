name: frontend-admin-ci

on:
  push:
    paths:
      - "frontend/admin-panel/**"
  pull_request:
    paths:
      - "frontend/admin-panel/**"

jobs:
  ci:
    runs-on: ubuntu-latest
    # Placeholder — expand when admin panel is implemented (Phase 1 Week 5+)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/admin-panel/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/admin-panel

      - name: Lint
        run: npm run lint
        working-directory: frontend/admin-panel

      - name: Type check
        run: npm run typecheck
        working-directory: frontend/admin-panel

      - name: Build
        run: npm run build
        working-directory: frontend/admin-panel
