name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if backend is implemented
        id: check
        run: |
          if [ -f backend/package.json ]; then
            echo "implemented=true" >> "$GITHUB_OUTPUT"
          else
            echo "implemented=false" >> "$GITHUB_OUTPUT"
            echo "backend/package.json not found — skipping CI (Phase 1 Week 3+ placeholder)"
          fi

      - name: Set up Node.js
        if: steps.check.outputs.implemented == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.implemented == 'true'
        run: npm ci
        working-directory: backend

      - name: Lint
        if: steps.check.outputs.implemented == 'true'
        run: npm run lint
        working-directory: backend

      - name: Type check
        if: steps.check.outputs.implemented == 'true'
        run: npm run typecheck
        working-directory: backend

      - name: Test
        if: steps.check.outputs.implemented == 'true'
        run: npm test
        working-directory: backend
