---
apiVersion: v1
kind: ConfigMap
metadata:
  name: management-api-config
  namespace: platform
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PDNS_API_URL: "http://ns1.phoenix-host.net:8081"
  JWT_SECRET: "change-me-in-production"
  ADMIN_USERNAME: "admin"

---
apiVersion: v1
kind: Secret
metadata:
  name: management-api-secrets
  namespace: platform
type: Opaque
stringData:
  DB_HOST: "mariadb"
  DB_PORT: "3306"
  DB_NAME: "platform"
  DB_USER: "platform"
  DB_PASSWORD: "change-me-in-production"
  PDNS_API_KEY: "change-me-in-production"
  ADMIN_PASSWORD: "change-me-in-production"

---
apiVersion: v1
kind: Service
metadata:
  name: management-api
  namespace: platform
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: management-api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-api
  namespace: platform
  labels:
    app: management-api
    version: "0.1.0"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: management-api
  template:
    metadata:
      labels:
        app: management-api
    spec:
      # Pull from local k3s container registry first (populated by Ansible)
      imagePullPolicy: IfNotPresent
      
      initContainers:
        # Run database migrations before starting the API
        - name: db-migrate
          image: management-api:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              node_modules/.bin/knex --knexfile src/db/knexfile.ts migrate:latest
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: management-api-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: management-api-secrets
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: management-api-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: management-api-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: management-api-secrets
                  key: DB_PASSWORD

      containers:
        - name: management-api
          image: management-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          
          env:
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: management-api-config
                  key: LOG_LEVEL
            - name: PDNS_API_URL
              valueFrom:
                configMapKeyRef:
                  name: management-api-config
                  key: PDNS_API_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: management-api-secrets
                  key: DB_PASSWORD  # Use a real secret from all.yml
            - name: ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: management-api-config
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: management-api-secrets
                  key: ADMIN_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: management-api-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: management-api-secrets
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: management-api-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: management-api-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: management-api-secrets
                  key: DB_PASSWORD
            - name: PDNS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: management-api-secrets
                  key: PDNS_API_KEY

          livenessProbe:
            httpGet:
              path: /api/v1/admin/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/v1/admin/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            runAsNonRoot: false
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
