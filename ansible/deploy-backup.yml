---
# Deploy Restic backup to SFTP backup server on all servers
# Usage: ansible-playbook -i inventory/hosts.yml deploy-backup.yml
#
# BEFORE RUNNING:
#   1. Set restic_password in ansible/group_vars/all.yml
#   2. Run with --tags generate_keys first to get SSH public keys
#   3. Add the displayed public keys to backup server via provider panel:
#      <PROVIDER_PANEL_URL> → Storage Box → SSH keys
#   4. Run without tags to complete deployment

- import_playbook: _ssh-keys.yml

- name: Deploy backup configuration
  hosts: backup_targets
  tags: [backup]
  roles:
    - backup
