---
# Hosting Platform — Deploy PostgreSQL HA (repmgr primary/standby)
# Deploys PostgreSQL 18 with repmgr on both nodes.
# The primary node is set by postgresql_primary_node in defaults.
#
# IMPORTANT: Primary must deploy first. This playbook uses two plays
# to guarantee correct ordering regardless of inventory order.
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml deploy-postgresql.yml

- name: Deploy PostgreSQL primary node first
  hosts: dns_servers
  serial: 1
  tags: [postgresql]
  roles:
    - role: postgresql_repmgr
      when: inventory_hostname == postgresql_primary_node

- name: Deploy PostgreSQL standby node
  hosts: dns_servers
  serial: 1
  tags: [postgresql]
  roles:
    - role: postgresql_repmgr
      when: inventory_hostname != postgresql_primary_node
