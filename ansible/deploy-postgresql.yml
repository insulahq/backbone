---
# Phoenix Host — Deploy PostgreSQL HA (repmgr primary/standby)
# Deploys PostgreSQL 18 with repmgr on both nodes.
# The primary node is set by postgresql_primary_node in defaults.
# Both NetBird and PowerDNS use this shared HA cluster.
#
# IMPORTANT: Deploy primary first, then standby.
# The playbook handles ordering via serial: 1.
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml deploy-postgresql.yml
#   ansible-playbook -i inventory/hosts.yml deploy-postgresql.yml --limit ns2

- name: Deploy PostgreSQL primary/standby with repmgr
  hosts: dns_servers
  serial: 1
  roles:
    - postgresql_repmgr
