---
# Targeted playbook — provision and deploy the Management API on admin.phoenix-host.net
#
# First-time setup (new server, not yet in NetBird):
#   ansible-playbook -i inventory/hosts.yml management_api.yml
#
# After enrollment, fill in admin1_netbird_ip in group_vars/all.yml, then
# re-run site.yml against ns1 to update its nftables to allow admin1:
#   ansible-playbook -i inventory/hosts.yml site.yml --limit ns1 --tags nftables
#
# Redeploy app only (after code changes):
#   ansible-playbook -i inventory/hosts.yml management_api.yml --tags app

- name: Common hardening on management API server
  hosts: management_api
  become: true
  roles:
    - common

- name: Enroll admin1 in NetBird
  hosts: management_api
  become: true
  roles:
    - netbird_peer

- name: Deploy Management API
  hosts: management_api
  become: true
  tags: app
  roles:
    - management_api
