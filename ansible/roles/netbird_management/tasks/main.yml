---
# NetBird self-hosted management server — runs on ns1 (Falkenstein)
# Architecture: netbirdio/netbird-server (combined management+signal+relay+STUN)
#               + netbirdio/dashboard + Traefik (TLS via Let's Encrypt)
# Docs: https://docs.netbird.io/selfhosted/selfhosted-quickstart

# ---------------------------------------------------------------------------
# Docker — already installed by powerdns_master role on ns1.
# Ensure Docker daemon is configured with external DNS.
# ---------------------------------------------------------------------------

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Add Docker apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian
      bookworm stable
    filename: docker
    state: present
    update_cache: true

- name: Install Docker CE and Docker Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Start and enable Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Configure Docker daemon DNS and log rotation
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "dns": ["1.1.1.1", "8.8.8.8"],
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "userland-proxy": false
      }
    owner: root
    group: root
    mode: '0644'
  notify: Restart Docker

# ---------------------------------------------------------------------------
# NetBird stack directory
# ---------------------------------------------------------------------------

- name: Create NetBird management directory
  ansible.builtin.file:
    path: /opt/netbird
    state: directory
    owner: root
    group: root
    mode: '0750'

# ---------------------------------------------------------------------------
# Configuration files
# ---------------------------------------------------------------------------

- name: Deploy NetBird server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /opt/netbird/config.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Restart NetBird management

- name: Deploy dashboard environment file
  ansible.builtin.template:
    src: dashboard.env.j2
    dest: /opt/netbird/dashboard.env
    owner: root
    group: root
    mode: '0640'
  notify: Restart NetBird management

- name: Deploy Docker Compose stack
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/netbird/docker-compose.yml
    owner: root
    group: root
    mode: '0644'
  notify: Restart NetBird management

# ---------------------------------------------------------------------------
# Start the stack
# ---------------------------------------------------------------------------

- name: Pull and start NetBird management stack
  community.docker.docker_compose_v2:
    project_src: /opt/netbird
    state: present
    pull: always

- name: Wait for NetBird to be healthy (port 443)
  ansible.builtin.wait_for:
    port: 443
    host: "127.0.0.1"
    timeout: 120
    delay: 10
