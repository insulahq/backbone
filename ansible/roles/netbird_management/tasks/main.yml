---
# NetBird self-hosted management server — runs on ns1 (Falkenstein)
# Provides: WireGuard mesh VPN for zero-trust admin access to all cluster nodes
# Co-hosted with PowerDNS master (ns1) per architecture decision ADR-013
#
# Firewall ports (80, 443, 3478, 51820) are handled by the common/nftables role.

# ---------------------------------------------------------------------------
# Docker — install from Docker's official apt repo (docker.io removed in Debian 13)
# ---------------------------------------------------------------------------

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Add Docker apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian
      bookworm stable
    filename: docker
    state: present
    update_cache: true

- name: Install Docker CE and Docker Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Start and enable Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

# ---------------------------------------------------------------------------
# NetBird management stack directory layout
# ---------------------------------------------------------------------------

- name: Create NetBird management directory
  ansible.builtin.file:
    path: /opt/netbird
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Create NetBird data directory
  ansible.builtin.file:
    path: /opt/netbird/data
    state: directory
    owner: root
    group: root
    mode: '0750'

# ---------------------------------------------------------------------------
# Configuration files (templates)
# ---------------------------------------------------------------------------

- name: Deploy NetBird Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/netbird/docker-compose.yml
    owner: root
    group: root
    mode: '0640'
  notify: Restart NetBird management

- name: Deploy Caddy reverse proxy configuration
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/netbird/Caddyfile
    owner: root
    group: root
    mode: '0640'
  notify: Restart NetBird management

- name: Deploy coturn STUN/TURN configuration
  ansible.builtin.template:
    src: coturn.conf.j2
    dest: /opt/netbird/coturn.conf
    owner: root
    group: root
    mode: '0640'
  notify: Restart NetBird management

- name: Deploy NetBird management config
  ansible.builtin.template:
    src: management.json.j2
    dest: /opt/netbird/data/management.json
    owner: root
    group: root
    mode: '0640'
  notify: Restart NetBird management

# ---------------------------------------------------------------------------
# Start the stack
# ---------------------------------------------------------------------------

- name: Pull and start NetBird management stack
  community.docker.docker_compose_v2:
    project_src: /opt/netbird
    state: present
    pull: always

- name: Wait for NetBird management to be healthy
  ansible.builtin.wait_for:
    port: 443
    host: "127.0.0.1"
    timeout: 60
    delay: 5
