---
# NetBird Management Role — Main Tasks
# Deploys combined netbird-server (management + signal + relay + STUN)
# New architecture from NetBird 0.66+: single container with config.yaml

- name: Create NetBird installation directory
  file:
    path: "{{ netbird_install_dir }}"
    state: directory
    mode: '0755'

- name: Ensure secrets directory exists on controller
  file:
    path: "{{ playbook_dir }}/.generated_secrets"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  run_once: true

- name: Generate relay auth secret (once per play)
  set_fact:
    netbird_relay_auth_secret: "{{ lookup('password', playbook_dir + '/.generated_secrets/netbird_relay_auth_secret length=64 chars=hexdigits') }}"
  when: netbird_relay_auth_secret is not defined
  no_log: true

- name: Generate datastore encryption key (once per play)
  # NetBird expects a base64-encoded 32-byte key (44 chars).
  # The lookup('password') generates alphanumeric which base64-decodes to fewer bytes.
  # Use a pre-generated key file or override via group_vars.
  set_fact:
    netbird_datastore_encryption_key: "{{ lookup('file', playbook_dir + '/.generated_secrets/netbird_datastore_encryption_key', errors='ignore') | default('', true) }}"
  when: netbird_datastore_encryption_key is not defined or netbird_datastore_encryption_key | length == 0
  no_log: true

- name: Auto-generate datastore encryption key if missing
  when: netbird_datastore_encryption_key | default('') | length == 0
  block:
    - name: Generate 32-byte base64 encryption key
      command: openssl rand -base64 32
      delegate_to: localhost
      become: false
      register: _nb_enc_key
      changed_when: false

    - name: Persist encryption key
      copy:
        content: "{{ _nb_enc_key.stdout | trim }}"
        dest: "{{ playbook_dir }}/.generated_secrets/netbird_datastore_encryption_key"
        mode: '0600'
      delegate_to: localhost
      become: false
      no_log: true

    - name: Set encryption key fact
      set_fact:
        netbird_datastore_encryption_key: "{{ _nb_enc_key.stdout | trim }}"
      no_log: true

- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ netbird_install_dir }}/docker-compose.yml"
    mode: '0644'
  notify: restart netbird

- name: Deploy config.yaml (combined server configuration)
  template:
    src: config.yaml.j2
    dest: "{{ netbird_install_dir }}/config.yaml"
    mode: '0600'
  notify: restart netbird

- name: Deploy dashboard.env
  template:
    src: dashboard.env.j2
    dest: "{{ netbird_install_dir }}/dashboard.env"
    mode: '0600'
  notify: restart netbird

- name: Start NetBird stack
  community.docker.docker_compose_v2:
    project_src: "{{ netbird_install_dir }}"
    pull: missing
    state: present

# Sync idp.db (Dex SQLite credential store) from NS1 → NS2 on every deploy.
# idp.db holds admin user bcrypt password hashes for dashboard login. It lives in
# the Docker volume (NOT in PostgreSQL), so it is NOT replicated automatically.
# Without this sync, NS2 has an empty Dex DB and dashboard login fails when NS1
# is down. We copy NS1's file every time so NS2 always has the latest credentials.
# Sync idp.db (Dex SQLite credential store) from NS1 → NS2.
# ignore_errors on the block because on first deploy, idp.db may not exist yet
# (created only after the setup wizard is completed manually).
- name: Sync idp.db from NS1 to NS2
  when: inventory_hostname == 'ns2'
  ignore_errors: true
  block:
    - name: Extract idp.db from NS1 netbird container to NS1 host
      delegate_to: ns1
      shell: docker cp netbird-server:/var/lib/netbird/idp.db /tmp/idp-netbird.db
      changed_when: false

    - name: Fetch idp.db from NS1 to Ansible controller
      delegate_to: ns1
      fetch:
        src: /tmp/idp-netbird.db
        dest: /tmp/idp-netbird-ns1.db
        flat: yes

    - name: Copy idp.db from controller to NS2 host
      copy:
        src: /tmp/idp-netbird-ns1.db
        dest: /tmp/idp-netbird.db
        mode: '0600'

    - name: Inject idp.db into NS2 netbird container
      shell: docker cp /tmp/idp-netbird.db netbird-server:/var/lib/netbird/idp.db
      notify: restart netbird

- name: Wait for NetBird API to be ready
  uri:
    url: "https://{{ netbird_dashboard_domain }}/api/instance"
    status_code: 200
    validate_certs: "{{ netbird_validate_certs | default(false) }}"
  retries: 30
  delay: 3
  register: result
  until: result.status == 200

# Auto-detect valid TLS certs — if Let's Encrypt issued a cert, enable validation
# for all subsequent API calls in this run. Avoids forgetting to flip the variable.
- name: Check if NetBird TLS certificate is valid (auto-detect)
  uri:
    url: "https://{{ netbird_dashboard_domain }}/api/instance"
    status_code: 200
    validate_certs: true
  register: netbird_cert_check
  ignore_errors: true
  run_once: true

- name: Auto-enable certificate validation (valid cert detected)
  set_fact:
    netbird_validate_certs: true
  when: netbird_cert_check is success
  run_once: true

- name: Configure internal peer DNS domain (requires netbird_admin_pat)
  when:
    - netbird_admin_pat is defined
    - netbird_admin_pat != 'REPLACE_WITH_YOUR_PAT'
    - not (result.json.setup_required | default(false))
  block:
    - name: Fetch NetBird account ID
      uri:
        url: "https://{{ netbird_dashboard_domain }}/api/accounts"
        method: GET
        headers:
          Authorization: "Token {{ netbird_admin_pat }}"
        status_code: 200
      register: nb_accounts

    - name: Set peer DNS domain to {{ netbird_peer_dns_domain }}
      uri:
        url: "https://{{ netbird_dashboard_domain }}/api/accounts/{{ nb_accounts.json[0].id }}"
        method: PUT
        headers:
          Authorization: "Token {{ netbird_admin_pat }}"
          Content-Type: "application/json"
        body_format: json
        body:
          settings: "{{ nb_accounts.json[0].settings | combine({'dns_domain': netbird_peer_dns_domain}) }}"
        status_code: 200
      register: nb_account_update
      no_log: true

    - name: Confirm DNS domain configured
      debug:
        msg: "NetBird peer DNS domain set to: {{ nb_account_update.json.settings.dns_domain }}"

# --- External OIDC provider (Zitadel) via NetBird identity-providers API ---
# Adds Zitadel as an external IdP alongside local auth. Requires both:
#   - zitadel_service_pat (to create the OIDC app in Zitadel)
#   - netbird_admin_pat (to add the IdP in NetBird)
# The embedded local auth remains as fallback. Login page shows a
# "Platform OIDC" button (configurable via netbird_oidc_provider_name).

- name: Load persisted NetBird OIDC client_id if available
  set_fact:
    netbird_oidc_client_id: "{{ lookup('file', playbook_dir + '/.generated_secrets/netbird_oidc_client_id', errors='ignore') | default('', true) }}"
  when: netbird_oidc_client_id is not defined or netbird_oidc_client_id | length == 0
  tags: [netbird, netbird_management]

- name: Load persisted NetBird OIDC client_secret if available
  set_fact:
    netbird_oidc_client_secret: "{{ lookup('file', playbook_dir + '/.generated_secrets/netbird_oidc_client_secret', errors='ignore') | default('', true) }}"
  when: netbird_oidc_client_secret is not defined or netbird_oidc_client_secret | length == 0
  no_log: true
  tags: [netbird, netbird_management]

- name: Search for Hosting Platform project in Zitadel (for NetBird)
  uri:
    url: "https://{{ zitadel_domain }}/management/v1/projects/_search"
    method: POST
    headers:
      Authorization: "Bearer {{ zitadel_service_pat }}"
      Content-Type: application/json
    body_format: json
    body:
      queries:
        - nameQuery:
            name: "Hosting Platform"
            method: TEXT_QUERY_METHOD_EQUALS
    status_code: 200
    validate_certs: "{{ netbird_validate_certs | default(false) }}"
  register: nb_oidc_project_search
  run_once: true
  when:
    - zitadel_service_pat | default('') | length > 0
    - netbird_admin_pat is defined
    - netbird_admin_pat != 'REPLACE_WITH_YOUR_PAT'
    - netbird_oidc_client_id | default('') | length == 0
    - not (result.json.setup_required | default(false))
  tags: [netbird, netbird_management]

- name: Create Hosting Platform project if not exists (for NetBird)
  uri:
    url: "https://{{ zitadel_domain }}/management/v1/projects"
    method: POST
    headers:
      Authorization: "Bearer {{ zitadel_service_pat }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "Hosting Platform"
    status_code: [200]
    validate_certs: "{{ netbird_validate_certs | default(false) }}"
  register: nb_oidc_project_created
  run_once: true
  when:
    - zitadel_service_pat | default('') | length > 0
    - netbird_admin_pat is defined
    - netbird_oidc_client_id | default('') | length == 0
    - nb_oidc_project_search.json.result | default([]) | length == 0
  tags: [netbird, netbird_management]

- name: Set Zitadel project ID for NetBird
  set_fact:
    nb_oidc_zitadel_project_id: >-
      {{ (nb_oidc_project_search.json.result[0].id)
         if (nb_oidc_project_search.json.result | default([]) | length > 0)
         else (nb_oidc_project_created.json.id | default('')) }}
  run_once: true
  when:
    - zitadel_service_pat | default('') | length > 0
    - netbird_admin_pat is defined
    - netbird_oidc_client_id | default('') | length == 0
  tags: [netbird, netbird_management]

- name: Create NetBird OIDC application in Zitadel
  uri:
    url: "https://{{ zitadel_domain }}/management/v1/projects/{{ nb_oidc_zitadel_project_id }}/apps/oidc"
    method: POST
    headers:
      Authorization: "Bearer {{ zitadel_service_pat }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "NetBird"
      redirectUris:
        - "https://{{ netbird_dashboard_domain }}/oauth2/callback"
      postLogoutRedirectUris:
        - "https://{{ netbird_dashboard_domain }}"
      responseTypes:
        - "OIDC_RESPONSE_TYPE_CODE"
      grantTypes:
        - "OIDC_GRANT_TYPE_AUTHORIZATION_CODE"
      appType: "OIDC_APP_TYPE_WEB"
      authMethodType: "OIDC_AUTH_METHOD_TYPE_BASIC"
    status_code: [200]
    validate_certs: "{{ netbird_validate_certs | default(false) }}"
  register: nb_oidc_app
  run_once: true
  when:
    - zitadel_service_pat | default('') | length > 0
    - netbird_admin_pat is defined
    - netbird_oidc_client_id | default('') | length == 0
    - nb_oidc_zitadel_project_id | default('') | length > 0
  tags: [netbird, netbird_management]

- name: Persist NetBird OIDC client_id
  copy:
    content: "{{ nb_oidc_app.json.clientId }}"
    dest: "{{ playbook_dir }}/.generated_secrets/netbird_oidc_client_id"
    mode: '0600'
  delegate_to: localhost
  become: false
  run_once: true
  when: nb_oidc_app is changed
  tags: [netbird, netbird_management]

- name: Persist NetBird OIDC client_secret
  copy:
    content: "{{ nb_oidc_app.json.clientSecret }}"
    dest: "{{ playbook_dir }}/.generated_secrets/netbird_oidc_client_secret"
    mode: '0600'
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  when: nb_oidc_app is changed
  tags: [netbird, netbird_management]

- name: Set NetBird OIDC client credentials from Zitadel API response
  set_fact:
    netbird_oidc_client_id: "{{ nb_oidc_app.json.clientId }}"
    netbird_oidc_client_secret: "{{ nb_oidc_app.json.clientSecret }}"
  run_once: true
  no_log: true
  when: nb_oidc_app is changed
  tags: [netbird, netbird_management]

# Now add Zitadel as an external IdP in NetBird via the identity-providers API

- name: List existing identity providers in NetBird
  uri:
    url: "https://{{ netbird_dashboard_domain }}/api/identity-providers"
    method: GET
    headers:
      Authorization: "Token {{ netbird_admin_pat }}"
    status_code: 200
    validate_certs: "{{ netbird_validate_certs | default(false) }}"
  register: nb_idp_list
  run_once: true
  when:
    - netbird_oidc_client_id | default('') | length > 0
    - netbird_admin_pat is defined
    - netbird_admin_pat != 'REPLACE_WITH_YOUR_PAT'
    - not (result.json.setup_required | default(false))
  tags: [netbird, netbird_management]

- name: Check if Zitadel IdP already exists in NetBird
  set_fact:
    nb_zitadel_idp_exists: "{{ nb_idp_list.json | default([]) | selectattr('issuer', 'equalto', netbird_oidc_issuer_url) | list | length > 0 }}"
  run_once: true
  when: nb_idp_list is not skipped
  tags: [netbird, netbird_management]

- name: Add Zitadel as external identity provider in NetBird
  uri:
    url: "https://{{ netbird_dashboard_domain }}/api/identity-providers"
    method: POST
    headers:
      Authorization: "Token {{ netbird_admin_pat }}"
      Content-Type: application/json
    body_format: json
    body:
      type: "zitadel"
      name: "{{ netbird_oidc_provider_name }}"
      issuer: "{{ netbird_oidc_issuer_url }}"
      client_id: "{{ netbird_oidc_client_id }}"
      client_secret: "{{ netbird_oidc_client_secret }}"
    status_code: [200, 201]
    validate_certs: "{{ netbird_validate_certs | default(false) }}"
  run_once: true
  when:
    - netbird_oidc_client_id | default('') | length > 0
    - nb_idp_list is not skipped
    - not (nb_zitadel_idp_exists | default(false) | bool)
  tags: [netbird, netbird_management]

# --- DNS record creation (via PowerDNS API) ---

- name: Build LUA health-check DNS records for NetBird domain
  set_fact:
    _netbird_lua_records: >-
      {{ [{'content': 'A "ifportup(' + (dns_health_check_port | default(443) | string) + ', {' +
          (groups['dns_servers'] | map('extract', hostvars, 'ansible_host') | map('regex_replace', '(.*)', "'" + '\\1' + "'") | join(', ')) +
          "}, {selector='all'})\"", 'disabled': false}] +
         ([] if (groups['dns_servers'] | map('extract', hostvars, 'public_ipv6') | select('defined') | list | length == 0) else
          [{'content': 'AAAA "ifportup(' + (dns_health_check_port | default(443) | string) + ', {' +
            (groups['dns_servers'] | map('extract', hostvars, 'public_ipv6') | select('defined') | map('regex_replace', '(.*)', "'" + '\\1' + "'") | join(', ')) +
            "}, {selector='all'})\"", 'disabled': false}])
      }}
  run_once: true
  when:
    - powerdns_api_key is defined
    - dns_health_check_enabled | default(false) | bool
  tags: [netbird, netbird_management, dns]

- name: Create DNS records for NetBird domain (health-checked LUA)
  when:
    - powerdns_api_key is defined
    - dns_health_check_enabled | default(false) | bool
  run_once: true
  uri:
    url: "http://{{ powerdns_bind_interface | default('127.0.0.1') }}:{{ powerdns_nginx_api_port | default('8081') }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      rrsets:
        - name: "{{ netbird_dashboard_domain }}."
          type: A
          changetype: DELETE
        - name: "{{ netbird_dashboard_domain }}."
          type: AAAA
          changetype: DELETE
        - name: "{{ netbird_dashboard_domain }}."
          type: LUA
          ttl: "{{ dns_health_check_ttl | default(30) }}"
          changetype: REPLACE
          records: "{{ _netbird_lua_records }}"
    status_code: [200, 204]
  ignore_errors: true
  tags: [netbird, netbird_management, dns]

- name: Create DNS A records for NetBird domain (static round-robin)
  when:
    - powerdns_api_key is defined
    - not (dns_health_check_enabled | default(false) | bool)
  run_once: true
  uri:
    url: "http://{{ powerdns_bind_interface | default('127.0.0.1') }}:{{ powerdns_nginx_api_port | default('8081') }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      rrsets:
        - name: "{{ netbird_dashboard_domain }}."
          type: A
          ttl: 300
          changetype: REPLACE
          records: >-
            {{
              groups['dns_servers']
              | map('extract', hostvars, 'ansible_host')
              | map('community.general.dict_kv', 'content')
              | map('combine', {'disabled': false})
              | list
            }}
    status_code: [200, 204]
  ignore_errors: true
  tags: [netbird, netbird_management, dns]

- name: Create DNS AAAA records for NetBird domain (static round-robin)
  when:
    - powerdns_api_key is defined
    - not (dns_health_check_enabled | default(false) | bool)
    - groups['dns_servers'] | map('extract', hostvars, 'public_ipv6') | select('defined') | list | length > 0
  run_once: true
  uri:
    url: "http://{{ powerdns_bind_interface | default('127.0.0.1') }}:{{ powerdns_nginx_api_port | default('8081') }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      rrsets:
        - name: "{{ netbird_dashboard_domain }}."
          type: AAAA
          ttl: 300
          changetype: REPLACE
          records: >-
            {{
              groups['dns_servers']
              | map('extract', hostvars, 'public_ipv6')
              | select('defined')
              | map('community.general.dict_kv', 'content')
              | map('combine', {'disabled': false})
              | list
            }}
    status_code: [200, 204]
  ignore_errors: true
  tags: [netbird, netbird_management, dns]

- name: Increment SOA serial after NetBird DNS record changes
  when: powerdns_api_key is defined
  run_once: true
  community.docker.docker_container_exec:
    container: powerdns-auth
    command: pdnsutil increase-serial {{ platform_domain }}
  changed_when: true
  ignore_errors: true
  tags: [netbird, netbird_management, dns]

# --- Status display ---

- name: Display NetBird deployment status
  debug:
    msg:
      - "NetBird deployed on {{ inventory_hostname }}"
      - "Dashboard: https://{{ netbird_dashboard_domain }}"
      - "Setup required: {{ (result.json.setup_required | default(false)) }}"
      - "{{ 'External OIDC: enabled (' + netbird_oidc_provider_name + ' via Zitadel)' if netbird_oidc_client_id else 'External OIDC: disabled — set zitadel_service_pat + netbird_admin_pat to enable' }}"
