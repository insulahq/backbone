---
# NetBird Management Role -- Default Variables
# Deploys NetBird Management + Signal + Relay on both ns1 and ns2.
# Uses PostgreSQL HA backend (deployed by postgresql_repmgr role).
# Zitadel OIDC as the sole authentication provider (no embedded IdP).

# NetBird versions -- combined server architecture (0.66+)
# Pin to specific versions to prevent breakage on deploy
netbird_server_version: "0.66.4"
netbird_dashboard_version: "v2.34.2"

# Deployment directory
netbird_install_dir: /opt/netbird

# Docker network settings for the internal netbird network
netbird_docker_subnet: "172.30.0.0/24"
netbird_docker_gateway: "172.30.0.1"

# NetBird combined server ports
netbird_stun_port: 3478

# NetBird Dashboard (Web UI)
netbird_dashboard_domain: "vpn.{{ platform_domain }}"

# Internal peer DNS domain
# Peers are reachable as <hostname>.netbird (e.g., ns1.netbird, ns2.netbird)
netbird_peer_dns_domain: "netbird"

# Traefik reverse proxy (for HTTPS endpoints)
netbird_traefik_enabled: true
netbird_traefik_email: "admin@{{ platform_domain }}"
netbird_traefik_acme_challenge: dns-01
netbird_traefik_dns_provider: pdns

# TLS certificate validation for API health checks
# Set to true after initial bootstrap when Let's Encrypt certs are provisioned
netbird_validate_certs: false

# OIDC via Zitadel (primary authentication provider)
# Credentials are auto-created via Zitadel Management API using zitadel_service_pat.
# zitadel_service_pat must be defined — deployment will fail without it.
netbird_oidc_client_id: ""
netbird_oidc_client_secret: ""
netbird_oidc_issuer_url: "https://{{ zitadel_domain | default('auth.' + platform_domain) }}"
