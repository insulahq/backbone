---
# ntfy Role — Default Variables
# Self-hosted push notification server (https://ntfy.sh).
# Uses the PostgreSQL HA backend (deployed by postgresql_repmgr role) via
# pgproxy, and sits behind Traefik for TLS termination.
#
# HA MODEL (read this before changing anything):
#   ntfy has NO clustering — its subscriber registry is per-process and
#   in-memory; the database is a message cache for since=/poll= reads, not a
#   delivery bus. Two ntfy instances sharing one database do NOT fan out to
#   each other's subscribers.
#
#   Therefore ntfy is FENCED to the PG primary (like netbird-server, gotcha
#   149): deployed on both nodes, running on exactly one. A live ntfy on the
#   standby would accept subscriptions and answer 200 OK while delivering
#   nothing — a silent, indefinite failure. With the container stopped the
#   standby's Traefik has no ntfy router, so a stale client fails fast,
#   redials, and re-resolves the 30s-TTL record onto the primary.
#
#   The fence lives in pg-role-watchdog.sh.j2 (enforce_ntfy_fence).

# Version — pin to a tested release (gotcha 47).
# v2.27.0 is the release that dropped the "experimental" label from
# PostgreSQL support ("has been running ntfy.sh for a while now"), which is
# what makes the HA model above possible — never pin below it.
ntfy_version: "v2.27.0"
ntfy_image: "binwiederhier/ntfy:{{ ntfy_version }}"

# Installation directory (under /opt — covered by the backup role's sweep)
ntfy_install_dir: /opt/ntfy

# Public domain (behind Traefik)
ntfy_domain: "ntfy.{{ platform_domain }}"

# Internal listen port (inside the container). No host port is published:
# host-side scripts publish through Gatus, which reaches ntfy over HTTPS.
ntfy_port: 80

# --- Database (existing PostgreSQL HA cluster, via pgproxy) ---------------
# Setting database-url moves the message cache, auth/ACL and web-push
# subscriptions into PostgreSQL, replacing the SQLite cache-file/auth-file/
# web-push-file trio (which must then NOT be set). Schema migrations are
# automatic and need no extensions or superuser — unlike Zitadel, so ntfy
# also restores cleanly from pg_dumpall (gotcha 155).
ntfy_db_name: ntfy
ntfy_db_user: ntfy
# postgresql_ntfy_password: generated by this role into .generated_secrets/

# pgx pool size. Kept small deliberately: max_connections has been exhausted
# in production before, and only one fenced instance ever holds a pool.
ntfy_db_pool_max_conns: 5

# --- Retention ------------------------------------------------------------
# How long messages stay in the cache (and are replayed via since=).
ntfy_cache_duration: "12h"

# --- Attachments (DISABLED by design) -------------------------------------
# ntfy stores attachments on the local filesystem or S3 — NOT in the
# database. Under this platform's failover model a node-local attachment dir
# is not replicated, so attachments uploaded to the old primary would 404
# after a promotion. Leave disabled unless an S3 target is configured.
ntfy_attachments_enabled: false

# --- Access control -------------------------------------------------------
# database-url implicitly enables auth. Default to a closed server: nothing
# is readable or publishable without credentials.
ntfy_auth_default_access: "deny-all"
ntfy_enable_signup: false
ntfy_enable_login: true

# auth-default-access locks the API but NOT the web app shell: by default ntfy
# serves its SPA (and /config.js) to anonymous visitors, who can then type a
# topic and "subscribe" in the UI. The server answers 403 and nothing is ever
# delivered, but the panel looks open and invites the attempt. require-login
# makes the app demand a login before it renders anything, matching deny-all's
# intent on the control plane.
ntfy_require_login: true

# Root of the web app. Set to "disable" to remove the browser UI entirely and
# serve the API only — the strictest option, but then nobody (including you)
# can read notifications in a browser; use the mobile/desktop app or CLI.
# /v1/health stays reachable either way, so Gatus keeps working.
ntfy_web_root: "/"

# Admin user. Password is generated into .generated_secrets/ntfy_admin_password
# and hashed with `ntfy user hash` into a provisioned auth-users entry.
ntfy_admin_user: admin

# Publish token used by Gatus (and any host-side script) to post alerts.
# Declarative auth-tokens require the form tk_<29 chars> (32 total).
# Generated into .generated_secrets/ntfy_publish_token.
ntfy_publish_user: "{{ ntfy_admin_user }}"

# Topic the platform's own alerts are published to. Randomised suffix is not
# a secret substitute — the server is deny-all — but keeps topics tidy.
ntfy_alert_topic: "platform-alerts"

# --- Subscriber (read-only) credentials -----------------------------------
# A separate identity for consumers — the Windows Scheduled Task
# (scripts/ntfy-notify-install.ps1), the phone app, a CLI subscriber.
# Deliberately NOT the publish token: a workstation should be able to READ
# alerts, never to forge them. Read-only on the alert topic, nothing else.
ntfy_subscriber_enabled: true
ntfy_subscriber_user: subscriber

# Extra declarative users, ACL entries and tokens, appended verbatim to the
# generated config. Provisioned entries removed from here are DELETED from
# the database on restart — this file is the source of truth.
#   ntfy_extra_users:  ["phone:$2a$10$...:user"]
#   ntfy_extra_access: ["phone:platform-alerts:read-only"]
#   ntfy_extra_tokens: ["phone:tk_...:label"]
ntfy_extra_users: []
ntfy_extra_access: []
ntfy_extra_tokens: []

# --- Web Push (browser notifications) — opt-in ----------------------------
# Requires a VAPID keypair, generated on first deploy via `ntfy webpush keys`
# and persisted to .generated_secrets/. Subscriptions live in PostgreSQL.
# Web Push only works against this same server.
ntfy_web_push_enabled: false
ntfy_web_push_email: "admin@{{ platform_domain }}"

# --- iOS push — opt-in ----------------------------------------------------
# iOS instant delivery needs APNs, which cannot be self-hosted without an
# Apple developer account and a custom app build. Setting an upstream makes
# ntfy forward a poll request containing only the MESSAGE ID upstream (the
# body stays on this server) so the stock iOS app can wake up.
# This is an EXTERNAL dependency in the delivery path — off by default.
ntfy_upstream_base_url: ""
ntfy_upstream_access_token: ""

# --- Ops ------------------------------------------------------------------
ntfy_log_level: "info"
ntfy_create_dns_records: true

# Resource limits, consistent with the other small services
ntfy_memory_limit: "256m"
ntfy_cpu_limit: "0.5"
