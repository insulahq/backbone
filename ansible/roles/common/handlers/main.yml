---
- name: Restart sshd
  ansible.builtin.systemd:
    name: ssh       # Debian uses 'ssh', not 'sshd'
    state: restarted

- name: Reload nftables
  ansible.builtin.systemd:
    name: nftables
    state: reloaded

# fail2ban not available on Debian 13 — brute-force protection via nftables rate limiting
