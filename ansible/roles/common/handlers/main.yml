---
# Common role handlers

- name: restart fail2ban
  systemd:
    name: fail2ban
    state: restarted

# Reload = `nft -f /etc/nftables.conf`, which replaces only `inet filter`:
# Docker's, fail2ban's and NetBird's tables are untouched, so no Docker
# restart (that restarted every container, PG primary included; gotcha 167).
# Never `restarted`: the unit's ExecStop is `nft flush ruleset`.
- name: reload nftables
  systemd:
    name: nftables
    state: reloaded

- name: restart sshd
  systemd:
    name: ssh
    state: restarted

- name: restart docker
  systemd:
    name: docker
    state: restarted

- name: reload systemd
  systemd:
    daemon_reload: true

- name: restart journald
  systemd:
    name: systemd-journald
    state: restarted
