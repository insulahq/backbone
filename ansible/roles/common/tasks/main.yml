---
# Common role -- OS hardening, simple nftables, Docker CE, fail2ban
# CRITICAL: Simple firewall rules only -- NO advanced pre/post-routing (gotcha 7)

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  tags: [common, packages]

- name: Install base packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - vim
      - htop
      - net-tools
      - dnsutils
      - fail2ban
      - nftables
      - python3
      - python3-pip
      - python3-docker  # Required by community.docker.docker_network module (gotcha 87)
    state: present
  tags: [common, packages]

- name: Set timezone to UTC
  timezone:
    name: "{{ timezone }}"
  tags: [common]

- name: Configure fail2ban
  copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 5
      # Debian 13 (trixie) uses systemd journal by default — /var/log/auth.log
      # does not exist unless rsyslog is installed (gotcha 83).
      backend = systemd

      [sshd]
      enabled = true
      port = {{ ssh_port }}
      journalmatch = _SYSTEMD_UNIT=ssh.service + _COMM=sshd
    mode: '0644'
  notify: restart fail2ban
  tags: [common, security, fail2ban]

- name: Start and enable fail2ban
  systemd:
    name: fail2ban
    state: started
    enabled: yes
  tags: [common, security, fail2ban]

- name: Deploy simple nftables configuration (NO advanced pre/post-routing)
  template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: '0644'
  notify: reload nftables
  tags: [common, security, firewall]

- name: Enable nftables service
  systemd:
    name: nftables
    state: started
    enabled: yes
  tags: [common, security, firewall]

# Docker CE installation — official apt repository
# Uses DEB822 .sources format per Docker's official Debian 13 install guide.
# https://docs.docker.com/engine/install/debian/
- name: Create directory for Docker GPG key
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags: [common, docker]

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  tags: [common, docker]

- name: Remove legacy Docker repo file (migrated to DEB822 .sources format)
  file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  tags: [common, docker]

- name: Add Docker repository (DEB822 format)
  copy:
    dest: /etc/apt/sources.list.d/docker.sources
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Signed-By: /etc/apt/keyrings/docker.asc
    mode: '0644'
  register: _docker_repo
  tags: [common, docker]

- name: Install Docker CE
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: "{{ _docker_repo is changed }}"
  tags: [common, docker]

- name: Deploy Docker daemon.json (default log limits for all containers)
  template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: restart docker
  tags: [common, docker]

- name: Start and enable Docker
  systemd:
    name: docker
    state: started
    enabled: yes
  tags: [common, docker]

# Shared alert helper — sourced by all maintenance scripts
- name: Deploy shared alert helper library
  template:
    src: platform-alert.sh.j2
    dest: /usr/local/lib/platform-alert.sh
    mode: '0644'
  tags: [common, maintenance]

# Docker cleanup — weekly prune of unused images, containers, networks, build cache
- name: Deploy Docker cleanup script
  template:
    src: docker-cleanup.sh.j2
    dest: /usr/local/bin/docker-cleanup.sh
    mode: '0755'
  when: docker_cleanup_enabled
  tags: [common, docker, maintenance]

- name: Deploy Docker cleanup systemd service
  template:
    src: docker-cleanup.service.j2
    dest: /etc/systemd/system/docker-cleanup.service
    mode: '0644'
  when: docker_cleanup_enabled
  notify: reload systemd
  tags: [common, docker, maintenance]

- name: Deploy Docker cleanup systemd timer
  template:
    src: docker-cleanup.timer.j2
    dest: /etc/systemd/system/docker-cleanup.timer
    mode: '0644'
  when: docker_cleanup_enabled
  notify: reload systemd
  tags: [common, docker, maintenance]

- name: Enable and start Docker cleanup timer
  systemd:
    name: docker-cleanup.timer
    enabled: yes
    state: started
    daemon_reload: yes
  when: docker_cleanup_enabled
  tags: [common, docker, maintenance]

- name: Add root to docker group (for convenience)
  user:
    name: root
    groups: docker
    append: yes
  tags: [common, docker]

- name: Verify Docker installation
  command: docker --version
  register: docker_version_output
  changed_when: false
  tags: [common, docker]

- name: Display Docker version
  debug:
    msg: "Docker installed: {{ docker_version_output.stdout }}"
  tags: [common, docker]

# systemd journal size limits
- name: Create journald.conf.d directory
  file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: '0755'
  tags: [common, maintenance]

- name: Deploy journal size limits
  template:
    src: journald-size-limit.conf.j2
    dest: /etc/systemd/journald.conf.d/size-limit.conf
    mode: '0644'
  notify: restart journald
  tags: [common, maintenance]

# Disk monitoring — hourly check with webhook alerts
- name: Deploy disk monitoring script
  template:
    src: disk-monitor.sh.j2
    dest: /usr/local/bin/disk-monitor.sh
    mode: '0755'
  when: disk_monitor_enabled
  tags: [common, maintenance]

- name: Deploy disk monitor systemd service
  template:
    src: disk-monitor.service.j2
    dest: /etc/systemd/system/disk-monitor.service
    mode: '0644'
  when: disk_monitor_enabled
  notify: reload systemd
  tags: [common, maintenance]

- name: Deploy disk monitor systemd timer
  template:
    src: disk-monitor.timer.j2
    dest: /etc/systemd/system/disk-monitor.timer
    mode: '0644'
  when: disk_monitor_enabled
  notify: reload systemd
  tags: [common, maintenance]

- name: Enable and start disk monitor timer
  systemd:
    name: disk-monitor.timer
    enabled: yes
    state: started
    daemon_reload: yes
  when: disk_monitor_enabled
  tags: [common, maintenance]

# Per-server SSH key -- deploy the generated public key so subsequent Ansible runs
# use the per-server key instead of the bootstrapping SSH key.
# The keypair is generated locally by the pre-play in _ssh-keys.yml.
# IMPORTANT: exclusive=false -- do NOT remove existing keys from authorized_keys.
# The bootstrapping SSH key and Hetzner-provisioned keys must remain as recovery fallbacks.
- name: Ensure .ssh directory exists for root
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: '0700'
  tags: [common, security, ssh]

- name: Deploy per-server SSH public key to authorized_keys
  ansible.posix.authorized_key:
    user: root
    key: "{{ lookup('file', playbook_dir + '/.generated_secrets/ssh/' + inventory_hostname + '.pub') }}"
    state: present
    exclusive: false
    comment: "ansible@{{ inventory_hostname }}"
  tags: [common, security, ssh]

# SSH hardening
- name: Harden SSH configuration
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: 'sshd -t -f %s'
  loop:
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin without-password' }
    - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
    - { regexp: '^#?AuthenticationMethods', line: 'AuthenticationMethods publickey' }
  notify: restart sshd
  tags: [common, security, ssh]
