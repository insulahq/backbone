---
# Common role -- OS hardening, simple nftables, Docker CE, fail2ban
# CRITICAL: Simple firewall rules only -- NO advanced pre/post-routing (gotcha 7)

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install base packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - vim
      - htop
      - net-tools
      - dnsutils
      - fail2ban
      - nftables
      - python3
      - python3-pip
    state: present

- name: Set timezone to UTC
  timezone:
    name: "{{ timezone }}"

- name: Configure fail2ban
  copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 5

      [sshd]
      enabled = true
      port = {{ ssh_port }}
      logpath = /var/log/auth.log
    mode: '0644'
  notify: restart fail2ban

- name: Start and enable fail2ban
  systemd:
    name: fail2ban
    state: started
    enabled: yes

- name: Deploy simple nftables configuration (NO advanced pre/post-routing)
  template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: '0644'
  notify: reload nftables

- name: Enable nftables service
  systemd:
    name: nftables
    state: started
    enabled: yes

# Docker CE installation (official repo)
- name: Create directory for Docker GPG key
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Determine Docker repo codename (fall back to bookworm if trixie unavailable)
  set_fact:
    docker_repo_codename: "{{ 'bookworm' if ansible_distribution_release == 'trixie' else ansible_distribution_release }}"

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ docker_repo_codename }} stable"
    state: present
    filename: docker

- name: Install Docker CE
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Start and enable Docker
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Add root to docker group (for convenience)
  user:
    name: root
    groups: docker
    append: yes

- name: Verify Docker installation
  command: docker --version
  register: docker_version_output
  changed_when: false

- name: Display Docker version
  debug:
    msg: "Docker installed: {{ docker_version_output.stdout }}"

# SSH hardening
- name: Harden SSH configuration
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: 'sshd -t -f %s'
  loop:
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin without-password' }
    - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
    - { regexp: '^#?AuthenticationMethods', line: 'AuthenticationMethods publickey' }
  notify: restart sshd
