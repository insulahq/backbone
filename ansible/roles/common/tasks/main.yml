---
# Common hardening tasks applied to all servers (ns1, ns2, and future nodes)
# Tested on: Debian 13 (trixie) — nftables replaces ufw on this release

- name: Update apt cache and upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - gnupg
      - ca-certificates
      - nftables            # apt-transport-https built into apt since Debian 10
      - unattended-upgrades
      - logrotate
      - htop
      # jq not yet in Debian 13 (trixie) — install manually from binary if needed
    state: present

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}.{{ platform_domain }}"

- name: Ensure /etc/hosts has FQDN entry
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^127\\.0\\.1\\.1"
    line: "127.0.1.1 {{ inventory_hostname }}.{{ platform_domain }} {{ inventory_hostname }}"

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Configure unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: '0644'

# --- SSH hardening ---

- name: Disable root password login (keep key auth)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin prohibit-password"
  notify: Restart sshd

- name: Disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: Restart sshd

- name: Set SSH MaxAuthTries
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?MaxAuthTries"
    line: "MaxAuthTries 3"
  notify: Restart sshd

- name: Add admin SSH keys to root authorized_keys
  ansible.posix.authorized_key:
    user: root
    key: "{{ item }}"
    state: present
  loop: "{{ admin_ssh_keys }}"

# --- kernel parameters ---

- name: Enable route_localnet for DNAT-to-loopback on dns_master (pdns-admin via NetBird)
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.route_localnet
    value: '1'
    state: present
    sysctl_set: true
    reload: true
  when: inventory_hostname in groups['dns_master']

# --- nftables firewall ---

- name: Deploy nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0640'
  notify: Reload nftables

- name: Start and enable nftables
  ansible.builtin.systemd:
    name: nftables
    state: started
    enabled: true

# Note: fail2ban is not available in Debian 13 (trixie) repos.
# SSH brute-force protection is handled directly in the nftables ruleset
# via connection-rate limiting (see templates/nftables.conf.j2).
