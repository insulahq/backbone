---
# Common hardening tasks applied to all servers (ns1, ns2, and future nodes)

- name: Update apt cache and upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - gnupg2
      - ca-certificates
      - apt-transport-https
      - ufw
      - fail2ban
      - unattended-upgrades
      - logrotate
      - htop
      - jq
    state: present

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}.{{ platform_domain }}"

- name: Ensure /etc/hosts has FQDN entry
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^127\\.0\\.1\\.1"
    line: "127.0.1.1 {{ inventory_hostname }}.{{ platform_domain }} {{ inventory_hostname }}"

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Configure unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: '0644'

# --- SSH hardening ---

- name: Disable root password login (keep key auth)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin prohibit-password"
  notify: Restart sshd

- name: Disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: Restart sshd

- name: Set SSH MaxAuthTries
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?MaxAuthTries"
    line: "MaxAuthTries 3"
  notify: Restart sshd

- name: Add admin SSH keys to root authorized_keys
  ansible.posix.authorized_key:
    user: root
    key: "{{ item }}"
    state: present
  loop: "{{ admin_ssh_keys }}"

# --- UFW firewall ---

- name: Set UFW default policy — deny all incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: Set UFW default policy — allow all outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp

- name: Allow DNS (UDP)
  community.general.ufw:
    rule: allow
    port: "53"
    proto: udp

- name: Allow DNS (TCP — zone transfers)
  community.general.ufw:
    rule: allow
    port: "53"
    proto: tcp

- name: Allow WireGuard/NetBird (UDP 51820)
  community.general.ufw:
    rule: allow
    port: "51820"
    proto: udp

- name: Enable UFW
  community.general.ufw:
    state: enabled

# --- fail2ban ---

- name: Deploy fail2ban jail config
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime  = 3600
      findtime = 600
      maxretry = 5
      backend  = systemd

      [sshd]
      enabled  = true
      port     = {{ ssh_port }}
      logpath  = %(sshd_log)s
    mode: '0644'
  notify: Restart fail2ban

- name: Start and enable fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
