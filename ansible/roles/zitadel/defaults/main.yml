---
# Zitadel IAM Role — Default Variables
# Deploys Zitadel as central identity provider on both ns1 and ns2.
# Uses PostgreSQL HA backend (deployed by postgresql_repmgr role).
# Sits behind Traefik for TLS termination.

# Version — pin to a tested stable release (gotcha 47)
# CRITICAL: Zitadel migrations are one-way — there is no downgrade path.
# Before any version change: pg_dump the zitadel DB (rollback = restore the
# dump + the old image). Deploy with deploy-zitadel.yml or site.yml, never
# rolling-update.yml (it reuses the existing compose file, so it cannot
# change the version, and it would recreate both nodes one after another).
# The role stops the peer's old-version instance before starting the new one
# (see "Version-change quiesce" in tasks/main.yml).
# v4.19.5: Login V1 security fixes (GHSA-45f2-5q3r-xgg6 critical account
# takeover, fixed 4.16.2; GHSA-4hgj-wm6c-q7p2, fixed only in 4.19.1+). Skip
# 4.18.0 (setup broke on upgrade, #12780, fixed 4.19.0). Setup steps 77-79
# run on first start; pool/Database defaults are unchanged, so the 12/4 pool
# below still holds. Never pin below 4.17.0: older start-from-init re-ran
# CREATE USER ... PASSWORD on every start, and PG logged the failing
# statement with the DB password in plaintext (gotcha 162).
zitadel_version: "v4.19.5"
zitadel_image: "ghcr.io/zitadel/zitadel:{{ zitadel_version }}"

# Allow a version change started from a PG standby to stop the peer's
# old-version instance even though that peer is the one serving clients
# (see "Version-change quiesce" in tasks/main.yml). Off: the play fails and
# asks for the primary to be upgraded first.
zitadel_force_quiesce: false

# Installation directory
zitadel_install_dir: /opt/zitadel

# Public domain and port (as seen by browsers/clients)
zitadel_domain: "account.{{ platform_domain }}"
zitadel_external_port: 443
zitadel_external_secure: true

# Internal port (inside the container, behind Traefik)
zitadel_port: 8080

# Database (uses existing PostgreSQL HA cluster via Docker network)
zitadel_db_name: zitadel
zitadel_db_user: zitadel
# zitadel_db_password: auto-generated and persisted in .generated_secrets/
# zitadel_masterkey: auto-generated and persisted (32 chars)
# CRITICAL: masterkey CANNOT be changed after initialization (gotcha)

# First instance configuration (only used on initial setup)
zitadel_org_name: "Hosting Platform"
zitadel_admin_username: "admin"
zitadel_admin_first_name: "Admin"
zitadel_admin_last_name: "Hosting Platform"
zitadel_admin_email: "admin@{{ platform_domain }}"
# zitadel_admin_password: auto-generated and persisted

# Logging
zitadel_log_level: "info"

# PostgreSQL connection pool
# Reduced 25/10 → 12/4 (2026-07-21): two instances at 25 each consumed 51 of
# PG's 100 connection slots and starved PowerDNS during the v4.16 rollout.
# This IAM serves platform-internal logins only — 12 per instance is ample.
zitadel_db_max_open_conns: 12
zitadel_db_max_idle_conns: 4
zitadel_db_max_conn_lifetime: "1h"
zitadel_db_max_conn_idle_time: "5m"

# DNS record management (auto-create A/AAAA records via PowerDNS API)
zitadel_create_dns_records: true

# Health check URL for DNS failover (used by ifurlup() in LUA records)
zitadel_health_check_url: "https://{{ zitadel_domain }}/debug/ready"
