---
# Keep the PostgreSQL role's password equal to the secrets file, so rotating
# it is: put a new value in .generated_secrets/zitadel_db_password, then run
# deploy-zitadel.yml. Zitadel >= 4.17 never touches an existing role's
# password (gotcha 162), so without this a changed file would only break
# Zitadel's next DB login.
#
# Runs inside the local postgresql container and connects the way Zitadel
# does — local node, then the peer, read-write only — so from either node it
# lands on the primary (a standby cannot change a role). A fresh cluster has
# no role yet: Zitadel's init creates it from the config, so nothing to do.
# In sync = a login with the file's password succeeds; only "password
# authentication failed" counts as drift, any other error fails the task.
#
# The secrets travel as exec environment (not argv, so not in `ps`) and psql
# reads the new one with \getenv. The ALTER session turns statement logging
# off and psql's output is discarded, so even a failing ALTER cannot put the
# password in the PG log or in Ansible's output.
- name: Sync the Zitadel DB role password with the secrets file
  community.docker.docker_container_exec:
    container: postgresql
    command: bash -s
    env:
      PGCONN: >-
        host=postgresql,{{ hostvars[groups['dns_servers'] | difference([inventory_hostname]) | first]['wireguard_ip'] }}
        port=5432 dbname=postgres target_session_attrs=read-write connect_timeout=5
      ROLE: "{{ zitadel_db_user | string }}"
      ADMIN_PASSWORD: "{{ postgresql_superuser_password | string }}"
      ROLE_PASSWORD: "{{ zitadel_db_password | string }}"
    stdin: |
      set -euo pipefail
      admin() { PGPASSWORD="$ADMIN_PASSWORD" psql "$PGCONN user=postgres" -X -v ON_ERROR_STOP=1 -qtA "$@"; }

      exists=$(admin -v role="$ROLE" <<< "SELECT 1 FROM pg_roles WHERE rolname = :'role'")
      if [ -z "$exists" ]; then echo absent; exit 0; fi

      if err=$(PGPASSWORD="$ROLE_PASSWORD" psql "$PGCONN user=$ROLE" -X -qtAc 'SELECT 1' 2>&1 >/dev/null); then
        echo in-sync; exit 0
      fi
      case "$err" in
        *"password authentication failed"*) ;;
        *) printf '%s\n' "$err" >&2; exit 1 ;;
      esac

      if ! admin -v role="$ROLE" >/dev/null 2>&1 <<'SQL'
      SET log_statement = 'none';
      SET log_min_error_statement = 'panic';
      SET log_min_duration_statement = -1;
      SET password_encryption = 'scram-sha-256';
      \getenv pw ROLE_PASSWORD
      ALTER ROLE :"role" PASSWORD :'pw';
      SQL
      then
        echo "ALTER ROLE failed; the PG log on the primary has the error (statement suppressed)" >&2
        exit 1
      fi
      echo changed
  register: _zitadel_db_pw_sync
  changed_when: (_zitadel_db_pw_sync.stdout | default('') | trim) == 'changed'
  failed_when: false
  no_log: true
  tags: [zitadel]

# The task above is no_log (its env carries both passwords), which would also
# hide why it failed. Its stderr carries psql/connection errors only.
- name: Fail if the Zitadel DB role password could not be synced
  fail:
    msg: "Zitadel DB role password sync failed (rc {{ _zitadel_db_pw_sync.rc | default('?') }}): {{ _zitadel_db_pw_sync.stderr | default('no output') }}"
  when: (_zitadel_db_pw_sync.rc | default(1)) != 0
  tags: [zitadel]
