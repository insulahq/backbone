---
# Zitadel IAM Role — Main Tasks
# Deploys Zitadel as central identity provider.
# Uses existing PostgreSQL HA cluster and Traefik reverse proxy.
# Deployed with serial: 1 so the first node runs migrations before the second starts.

- name: Create Zitadel installation directory
  file:
    path: "{{ zitadel_install_dir }}"
    state: directory
    mode: '0755'
  tags: [zitadel]

# --- Secret loading (strict, fail-fast) ---
#
# These secrets are NEVER regenerated by the role — silent regeneration after an
# accidental delete would cause ns2 to auth against ns1's DB with a new password
# (drill finding 2026-04-23). The files must exist before deploy; setup.sh
# generates them on initial cluster setup, and RECOVERY.md documents manual
# recovery from a surviving node.

- name: Stat Zitadel secret files on controller
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/.generated_secrets/{{ item }}"
  loop:
    - zitadel_db_password
    - zitadel_masterkey
  register: _zitadel_secret_stats
  tags: [zitadel]

- name: Fail if any critical Zitadel secret is missing (never auto-regenerate)
  ansible.builtin.fail:
    msg: >-
      {{ item.item }} is missing at {{ playbook_dir }}/.generated_secrets/.
      Do NOT let Ansible silently regenerate it — the value must match what
      Zitadel wrote to the PG database on initial setup. Run `ansible/setup.sh`
      on a fresh cluster, OR recover from a surviving node per
      docs/RECOVERY.md Scenario 3 "Known pitfalls".
  when: not item.stat.exists
  loop: "{{ _zitadel_secret_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [zitadel]

# The file is authoritative — no `when` guard allowing extra-var override.
# An extra-var value would silently drift from what the DB is encrypted with.
- name: Load Zitadel DB password from secrets (file is authoritative)
  set_fact:
    zitadel_db_password: "{{ lookup('file', playbook_dir + '/.generated_secrets/zitadel_db_password') | trim }}"
  no_log: true
  tags: [zitadel]

# CRITICAL: masterkey must be exactly 32 characters and CANNOT be changed after init
- name: Load Zitadel masterkey from secrets (file is authoritative)
  set_fact:
    zitadel_masterkey: "{{ lookup('file', playbook_dir + '/.generated_secrets/zitadel_masterkey') | trim }}"
  no_log: true
  tags: [zitadel]

# Admin password: the FILE is authoritative once written. Previously the role
# loaded via lookup('password'), appended "!1Ax" in-memory, and then overwrote
# the file with the appended value — on subsequent runs this double-appended
# and grew the file by 4 chars each deploy. New pattern:
#   - first deploy: stat → missing → create file with `<random>!1Ax` → load
#   - subsequent:   stat → exists  → load as-is (no mutation)
# Note: on an EXISTING cluster, the DB admin password was set on first-ever
# Zitadel init; the file value only matches if it hasn't drifted. If it has,
# admin access must be reset via Zitadel CLI/API (out of scope here).
- name: Stat Zitadel admin password file on controller
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/.generated_secrets/zitadel_admin_password"
  register: _zitadel_admin_pw_stat
  delegate_to: localhost
  become: false
  run_once: true
  tags: [zitadel]

- name: Generate Zitadel admin password on first deploy (not on re-deploy)
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.copy:
    content: "{{ lookup('password', '/dev/null length=20 chars=ascii_letters,digits') }}!1Ax"
    dest: "{{ playbook_dir }}/.generated_secrets/zitadel_admin_password"
    mode: '0600'
  when: not _zitadel_admin_pw_stat.stat.exists
  no_log: true
  tags: [zitadel]

- name: Load Zitadel admin password from secrets
  set_fact:
    zitadel_admin_password: "{{ lookup('file', playbook_dir + '/.generated_secrets/zitadel_admin_password') | trim }}"
  when: zitadel_admin_password is not defined or zitadel_admin_password | length == 0
  no_log: true
  tags: [zitadel]

# --- Deploy configuration files ---

- name: Deploy Zitadel runtime config
  template:
    src: config.yaml.j2
    dest: "{{ zitadel_install_dir }}/config.yaml"
    owner: root
    group: '1000'  # Zitadel container UID=1000 (verified via /proc/<pid>/status)
    mode: '0640'  # root:1000 0640 — container reads via group; host non-root cannot
  notify: restart zitadel
  tags: [zitadel]

- name: Deploy Zitadel first-instance steps config
  template:
    src: steps.yaml.j2
    dest: "{{ zitadel_install_dir }}/steps.yaml"
    owner: root
    group: '1000'  # Zitadel container UID=1000
    mode: '0640'  # root:1000 0640 — contains admin password
  tags: [zitadel]

- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ zitadel_install_dir }}/docker-compose.yml"
    mode: '0640'  # contains ZITADEL_MASTERKEY env — only docker CLI (root) reads
  notify: restart zitadel
  tags: [zitadel]

# --- Start Zitadel ---
# start-from-init is idempotent: runs migrations if needed, creates instance if needed, then starts.
# serial: 1 in the playbook ensures the first node completes migrations before the second starts.

# --- Version-change quiesce ---
# Both nodes run Zitadel against the same PostgreSQL primary, and the
# playbooks upgrade one node at a time (site.yml: the whole of phase 2 sits
# between the two). Setup steps can rewrite eventstore internals that an
# older binary still running on the peer would misread — e.g. 4.17's step 77
# replaces eventstore.commands_to_events and changes what
# projections.current_states.filter_offset means, so an old instance can
# advance a projection cursor past events it never applied. Upstream's
# rollout is "run setup, then restart"; there is no supported mixed-version
# window and no downgrade path (gotcha 159).
# So before starting the target version here, stop Zitadel on every OTHER
# node still running a different image — but only from the PG primary, the
# node that serves clients. From a standby that would stop the serving
# instance (a lone --limit run, a node rebuild with a newer pin, a stale
# dns_failover_primary after a failover), so the play fails instead and asks
# for the primary to be upgraded first (override: zitadel_force_quiesce).
# Peers already on the target image are left alone and unreachable peers are
# skipped. The stopped standby is started again by its own run of this role
# (compose up starts stopped containers) — invisible to clients under
# active-passive DNS. Caveat: pg-role-watchdog's restart cascade runs
# `docker restart zitadel` on a PG role change, which would start a quiesced
# old instance, so don't upgrade Zitadel while the cluster is unstable.
- name: Pull the target Zitadel image before touching any peer
  # A failed pull must abort while both nodes are still serving, not after
  # the peer has been stopped (compose's own pull comes after the quiesce).
  community.docker.docker_image:
    name: "{{ zitadel_image }}"
    source: pull
  tags: [zitadel]

- name: Read the local PostgreSQL role
  command: docker exec postgresql psql -U postgres -tAc "SELECT pg_is_in_recovery()"
  register: _zitadel_local_pg_role
  changed_when: false
  failed_when: false
  tags: [zitadel]

- name: Identify the peer node
  set_fact:
    # Two-node platform (same peer derivation as the watchdog's PEER_NAME).
    _zitadel_peer: "{{ groups['dns_servers'] | difference([inventory_hostname]) | first }}"
  tags: [zitadel]

# A delegated task's connection `vars:` are templated in the DELEGATE's
# variable context, where neither a loop `item` nor a fact set on this host
# exists ("'item' is undefined"). Publish the key path into the peer's
# hostvars, as the openziti role does; set_fact opens no connection.
- name: Publish the peer's SSH key path into its hostvars
  set_fact:
    _zitadel_peer_key: "{{ playbook_dir }}/.generated_secrets/ssh/{{ _zitadel_peer }}"
  delegate_to: "{{ _zitadel_peer }}"
  delegate_facts: true
  tags: [zitadel]

- name: Read the Zitadel image running on the peer node
  command: docker inspect zitadel --format '{{ '{{' }}.Config.Image{{ '}}' }}'
  delegate_to: "{{ _zitadel_peer }}"
  vars:
    ansible_ssh_private_key_file: "{{ _zitadel_peer_key }}"
  register: _zitadel_peer_image
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  tags: [zitadel]

- name: Decide whether the peer still runs a different Zitadel image
  set_fact:
    # An unreachable peer carries no rc; a peer without a zitadel container
    # returns rc 1. Only a reachable peer with a running-or-stopped zitadel on
    # another image counts.
    _zitadel_stale_peers: >-
      {{ [_zitadel_peer]
         if (_zitadel_peer_image.rc | default(1)) == 0
            and (_zitadel_peer_image.stdout | default('') | trim) != zitadel_image
         else [] }}
  tags: [zitadel]

- name: Refuse to quiesce the serving instance from a standby
  fail:
    msg: >-
      {{ _zitadel_stale_peers | join(', ') }} still run(s) a different Zitadel
      image than {{ zitadel_image }}, and {{ inventory_hostname }} is not the
      PG primary. Starting the new version here would stop the instance that
      serves clients. Upgrade the PG primary first
      (deploy-zitadel.yml -e dns_failover_primary=<primary>), or pass
      -e zitadel_force_quiesce=true to accept the outage.
  when:
    - _zitadel_stale_peers | length > 0
    - (_zitadel_local_pg_role.stdout | default('') | trim) != 'f'
    - not (zitadel_force_quiesce | bool)
  tags: [zitadel]

- name: Stop Zitadel on the peer while it runs a different version
  command: docker stop --timeout 30 zitadel
  delegate_to: "{{ _zitadel_peer }}"
  vars:
    ansible_ssh_private_key_file: "{{ _zitadel_peer_key }}"
  when: _zitadel_stale_peers | length > 0
  tags: [zitadel]

- name: Start Zitadel stack
  community.docker.docker_compose_v2:
    project_src: "{{ zitadel_install_dir }}"
    pull: missing
    state: present
  tags: [zitadel]

- name: Wait for Zitadel to be ready
  uri:
    # Use the server's public IP with Host header to bypass DNS dependency —
    # the zitadel_domain DNS record is created AFTER this check.
    url: "https://{{ ansible_host }}/debug/ready"
    headers:
      Host: "{{ zitadel_domain }}"
    status_code: 200
    validate_certs: false
  retries: 40
  delay: 5
  register: zitadel_ready
  until: zitadel_ready.status == 200
  tags: [zitadel]

# --- DNS record creation (optional, via PowerDNS API) ---
# When dns_health_check_enabled is true, creates LUA records with ifportup()
# that automatically exclude dead servers from DNS responses.
# When false, creates static A/AAAA records (active-passive, primary IP only).

- name: Compute DNS failover address order
  set_fact:
    _dns_primary: "{{ dns_failover_primary | default('ns1') }}"
    _dns_secondary: "{{ groups['dns_servers'] | difference([dns_failover_primary | default('ns1')]) | first }}"
  run_once: true
  when:
    - zitadel_create_dns_records | default(true)
    - dns_health_check_enabled | default(false) | bool
  tags: [zitadel, dns]

- name: Build LUA health-check DNS records for Zitadel
  set_fact:
    _zitadel_lua_records: >-
      {{ [{'content': 'A "ifportup(443,
      { {\'' + hostvars[_dns_primary]['ansible_host'] + '\'}, {\'' + hostvars[_dns_secondary]['ansible_host'] + '\'} })"', 'disabled': false}] +
         ([] if (groups['dns_servers'] | map('extract', hostvars, 'public_ipv6') | select('defined') | list | length == 0) else
          [{'content': 'AAAA "ifportup(443,
      { {\'' + hostvars[_dns_primary]['public_ipv6'] + '\'}, {\'' + hostvars[_dns_secondary]['public_ipv6'] + '\'} })"', 'disabled': false}])
      }}
  run_once: true
  when:
    - zitadel_create_dns_records | default(true)
    - dns_health_check_enabled | default(false) | bool
  tags: [zitadel, dns]

- name: Create DNS records for Zitadel domain (health-checked LUA)
  when:
    - zitadel_create_dns_records | default(true)
    - powerdns_api_key is defined
    - dns_health_check_enabled | default(false) | bool
  run_once: true
  uri:
    url: "http://{{ powerdns_bind_interface | default('127.0.0.1') }}:{{ powerdns_nginx_api_port | default('8081') }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      rrsets:
        - name: "{{ zitadel_domain }}."
          type: A
          changetype: DELETE
        - name: "{{ zitadel_domain }}."
          type: AAAA
          changetype: DELETE
        - name: "{{ zitadel_domain }}."
          type: LUA
          ttl: "{{ dns_health_check_ttl | default(30) }}"
          changetype: REPLACE
          records: "{{ _zitadel_lua_records }}"
    status_code: [200, 204]
  ignore_errors: true
  tags: [zitadel, dns]

- name: Create DNS A record for Zitadel domain (active-passive — primary only)
  when:
    - zitadel_create_dns_records | default(true)
    - powerdns_api_key is defined
    - not (dns_health_check_enabled | default(false) | bool)
  run_once: true
  uri:
    url: "http://{{ powerdns_bind_interface | default('127.0.0.1') }}:{{ powerdns_nginx_api_port | default('8081') }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      rrsets:
        - name: "{{ zitadel_domain }}."
          type: LUA
          changetype: DELETE
        - name: "{{ zitadel_domain }}."
          type: A
          ttl: 30
          changetype: REPLACE
          records:
            - content: "{{ hostvars[dns_failover_primary | default('ns1')]['ansible_host'] }}"
              disabled: false
    status_code: [200, 204]
  ignore_errors: true
  tags: [zitadel, dns]

- name: Create DNS AAAA record for Zitadel domain (active-passive — primary only)
  when:
    - zitadel_create_dns_records | default(true)
    - powerdns_api_key is defined
    - not (dns_health_check_enabled | default(false) | bool)
    - hostvars[dns_failover_primary | default('ns1')]['public_ipv6'] is defined
  run_once: true
  uri:
    url: "http://{{ powerdns_bind_interface | default('127.0.0.1') }}:{{ powerdns_nginx_api_port | default('8081') }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      rrsets:
        - name: "{{ zitadel_domain }}."
          type: AAAA
          ttl: 30
          changetype: REPLACE
          records:
            - content: "{{ hostvars[dns_failover_primary | default('ns1')]['public_ipv6'] }}"
              disabled: false
    status_code: [200, 204]
  ignore_errors: true
  tags: [zitadel, dns]

- name: Increment SOA serial after DNS record changes
  when:
    - zitadel_create_dns_records | default(true)
    - powerdns_api_key is defined
  run_once: true
  community.docker.docker_container_exec:
    container: powerdns-auth
    command: pdnsutil increase-serial {{ platform_domain }}
  changed_when: true
  ignore_errors: true
  tags: [zitadel, dns]

# --- Status display ---

- name: Display Zitadel deployment status
  debug:
    msg:
      - "Zitadel {{ zitadel_version }} deployed on {{ inventory_hostname }}"
      - "Console: https://{{ zitadel_domain }}/ui/console"
      - "Login:   https://{{ zitadel_domain }}/ui/login"
      - "OIDC:    https://{{ zitadel_domain }}/.well-known/openid-configuration"
      - ""
      - "Initial admin: {{ zitadel_admin_username }} (password change required on first login)"
      - "Admin email: {{ zitadel_admin_email }}"
      - "Organization: {{ zitadel_org_name }}"
      - ""
      - "IMPORTANT: Admin password is in ansible/.generated_secrets/zitadel_admin_password"
      - "IMPORTANT: Masterkey is in ansible/.generated_secrets/zitadel_masterkey (CANNOT be changed)"
  tags: [zitadel]
