---
# Portainer Role — Main Tasks
# Deploys Portainer CE for Docker management.
# Bound to NetBird IP only — not publicly accessible.

- name: Create Portainer installation directory
  file:
    path: "{{ portainer_install_dir }}"
    state: directory
    mode: '0755'
  tags: [portainer]

- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ portainer_install_dir }}/docker-compose.yml"
    mode: '0644'
  notify: restart portainer
  tags: [portainer]

- name: Start Portainer stack
  community.docker.docker_compose_v2:
    project_src: "{{ portainer_install_dir }}"
    pull: missing
    state: present
  tags: [portainer]

- name: Display Portainer deployment status
  debug:
    msg:
      - "Portainer {{ portainer_version }} deployed on {{ inventory_hostname }}"
      - "Dashboard: https://{{ portainer_bind_interface }}:{{ portainer_https_port }}"
      - ""
      - "Access via NetBird mesh only (not publicly accessible)."
      - "On first visit, create an admin user in the Portainer UI."
  tags: [portainer]
