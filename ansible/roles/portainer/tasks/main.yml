---
# Portainer Role — Main Tasks
# Deploys Portainer CE + Agent for Docker management.
# Bound to 0.0.0.0 but blocked on public interfaces via nftables FORWARD chain.
# Accessible via WireGuard (wg0) and NetBird (wt0) only.

- name: Create Portainer installation directory
  file:
    path: "{{ portainer_install_dir }}"
    state: directory
    mode: '0755'
  tags: [portainer]

# --- Deploy and start ---

- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ portainer_install_dir }}/docker-compose.yml"
    mode: '0644'
  notify: restart portainer
  tags: [portainer]

- name: Start Portainer stack
  community.docker.docker_compose_v2:
    project_src: "{{ portainer_install_dir }}"
    pull: missing
    state: present
  tags: [portainer]

# --- Automated admin user creation (eliminates 5-minute manual window — gotcha 113) ---

- name: Ensure secrets directory exists on controller
  file:
    path: "{{ playbook_dir }}/.generated_secrets"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  run_once: true
  tags: [portainer]

- name: Generate Portainer admin password if not set
  set_fact:
    portainer_admin_password: "{{ lookup('password', playbook_dir + '/.generated_secrets/portainer_admin_password length=24 chars=ascii_letters,digits') }}"
  when: portainer_admin_password is not defined or portainer_admin_password | length == 0
  no_log: true
  tags: [portainer]

- name: Wait for Portainer API to be ready
  uri:
    url: "http://127.0.0.1:{{ portainer_port }}/api/system/status"
    method: GET
    status_code: 200
  retries: 20
  delay: 3
  register: portainer_status
  until: portainer_status.status == 200
  tags: [portainer]

- name: Check if Portainer admin user already exists
  uri:
    url: "http://127.0.0.1:{{ portainer_port }}/api/users/admin/check"
    method: GET
    status_code: [200, 204, 404]
  register: portainer_admin_check
  tags: [portainer]

# Portainer 2.39+ requires a setup token for admin initialization
# (X-Setup-Token header) — printed in the container logs at startup and
# regenerated on every container start, so always read the LATEST
# occurrence (surfaced by the 2026-07-22 ns2 node-replacement drill; the
# old tokenless init worked when ns1 was first initialized on an earlier
# Portainer and the change only bites on fresh installs).
- name: Read Portainer setup token from container logs (2.39+)
  shell: |
    docker logs portainer 2>&1 | sed 's/\x1b\[[0-9;]*m//g' \
      | grep -oE 'setup_token=[^[:space:]]+' | tail -1 | cut -d= -f2-
  register: _portainer_setup_token
  changed_when: false
  no_log: true
  when: portainer_admin_check.status == 404
  tags: [portainer]

- name: Create initial Portainer admin user via API
  uri:
    url: "http://127.0.0.1:{{ portainer_port }}/api/users/admin/init"
    method: POST
    headers:
      X-Setup-Token: "{{ _portainer_setup_token.stdout | default('') | trim }}"
    body_format: json
    body:
      Username: "{{ portainer_admin_username }}"
      Password: "{{ portainer_admin_password }}"
    status_code: [200, 409]
  when: portainer_admin_check.status == 404
  no_log: true
  tags: [portainer]

- name: Display Portainer deployment status
  debug:
    msg:
      - "Portainer CE {{ portainer_version }} deployed on {{ inventory_hostname }}"
      - "Dashboard: http://<wireguard-or-netbird-ip>:{{ portainer_port }}"
      - "Accessible via WireGuard and NetBird only (public access blocked by nftables)."
      - "Admin user: {{ portainer_admin_username }}"
      - "Admin password: stored in ansible/.generated_secrets/portainer_admin_password"
  tags: [portainer]
