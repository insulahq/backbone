---
# Portainer Role — Default Variables
# Deploys Portainer CE for Docker management on each server.
# Each node runs its own instance managing local Docker via socket mount.
# Accessible via WireGuard (wg0) and NetBird (wt0) only — not publicly exposed.

# Version — pin to a tested stable release (gotcha 47)
portainer_version: "2.39.0"
portainer_image: "portainer/portainer-ce:{{ portainer_version }}"

# Installation directory
portainer_install_dir: /opt/portainer

# Port — blocked on public interfaces by nftables (gotcha 114)
portainer_port: 9000
