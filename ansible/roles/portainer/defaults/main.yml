---
# Portainer Role — Default Variables
# Deploys Portainer CE for Docker management on each server.
# Bound to NetBird IP only — NOT publicly accessible.
# Access via https://<netbird-ip>:9443 from within the VPN mesh.

# Version — pin to a tested stable release (gotcha 47)
portainer_version: "2.24.1"
portainer_image: "portainer/portainer-ce:{{ portainer_version }}"

# Installation directory
portainer_install_dir: /opt/portainer

# Bind interface — NetBird WireGuard IP only (not public)
portainer_bind_interface: "{{ netbird_ip | default('127.0.0.1') }}"

# Portainer HTTPS port (self-signed TLS, encrypted by WireGuard in transit)
portainer_https_port: 9443
