---
# Deploy management API to k3s cluster on admin1
# This is a Phase 1 PoC deployment

- name: Create k3s manifests directory
  ansible.builtin.file:
    path: /opt/k8s-manifests
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Sync backend source to server
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../backend/"
    dest: /opt/management-api/src/
    delete: true
    rsync_opts:
      - "--exclude=node_modules/"
      - "--exclude=dist/"
      - "--exclude=.env"
      - "--exclude=coverage/"

- name: Create management API namespace and secrets manifest
  ansible.builtin.template:
    src: k8s-secrets.yml.j2
    dest: /opt/k8s-manifests/01-namespace-and-secrets.yaml
    owner: root
    group: root
    mode: '0640'

- name: Create MariaDB StatefulSet manifest
  ansible.builtin.copy:
    src: mariadb-statefulset.yaml
    dest: /opt/k8s-manifests/02-mariadb-statefulset.yaml
    owner: root
    group: root
    mode: '0640'

- name: Create management API Deployment manifest
  ansible.builtin.template:
    src: management-api-deployment.yml.j2
    dest: /opt/k8s-manifests/03-management-api-deployment.yaml
    owner: root
    group: root
    mode: '0640'

- name: Build management-api Docker image
  community.docker.docker_image:
    name: management-api
    tag: latest
    source: build
    build:
      path: /opt/management-api/src
      pull: false
    force_source: false

- name: Export management-api image as tar for k3s
  ansible.builtin.shell: |
    docker save management-api:latest | gzip > /tmp/management-api-latest.tar.gz

- name: Import image into k3s containerd
  ansible.builtin.shell: |
    cat /tmp/management-api-latest.tar.gz | gunzip | \
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml /usr/local/bin/kubectl run --image-command \
    -it --rm --image=localhost/busybox ctr-image -- \
    /bin/sh -c "cat > /tmp/img.tar && ctr -n k8s.io images import /tmp/img.tar"
  ignore_errors: true

# Simpler approach: use containerd directly
- name: Import management-api image into k3s containerd
  ansible.builtin.shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
    /usr/local/bin/kubectl load image --image management-api:latest || true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Apply k8s manifests to platform namespace
  ansible.builtin.shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
    /usr/local/bin/kubectl apply -f /opt/k8s-manifests/
  register: kubectl_apply_result
  changed_when: "'created' in kubectl_apply_result.stdout or 'configured' in kubectl_apply_result.stdout"

- name: Wait for MariaDB StatefulSet to be ready
  ansible.builtin.shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
    /usr/local/bin/kubectl -n platform rollout status statefulset/mariadb --timeout=300s
  register: mariadb_rollout
  until: mariadb_rollout.rc == 0
  retries: 10
  delay: 10

- name: Wait for management-api Deployment to be ready
  ansible.builtin.shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
    /usr/local/bin/kubectl -n platform rollout status deployment/management-api --timeout=300s
  register: api_rollout
  until: api_rollout.rc == 0
  retries: 10
  delay: 10

- name: Get management-api service endpoint
  ansible.builtin.shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
    /usr/local/bin/kubectl -n platform get service management-api -o jsonpath='{.spec.clusterIP}:{.spec.ports[0].port}'
  register: api_endpoint

- name: Test management-api health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/v1/admin/status"
    method: GET
    status_code: 200
    validate_certs: no
  retries: 10
  delay: 5
  register: api_health_check
  until: api_health_check.status == 200

- name: Print API endpoint information
  ansible.builtin.debug:
    msg: |
      Management API deployed to k3s successfully!
      Service endpoint: {{ api_endpoint.stdout }}
      Health check: {{ api_health_check.status }}
