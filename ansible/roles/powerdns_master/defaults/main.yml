---
# PowerDNS Master Role — Default Variables
# Deploys PowerDNS Primary with PostgreSQL backend on ns1

# PowerDNS versions
powerdns_version: "4.9"
powerdns_image: "powerdns/pdns-auth-49:latest"
powerdns_admin_version: "0.4.1"
powerdns_admin_image: "powerdnsadmin/pda-legacy:v0.4.1"

# PostgreSQL
postgres_version: "16"
postgres_image: "postgres:16-alpine"

# Nginx proxy
nginx_image: "nginx:alpine"

# Installation directory
powerdns_install_dir: /opt/powerdns

# PowerDNS configuration
powerdns_primary: yes
powerdns_secondary: no
powerdns_api_enabled: yes
powerdns_webserver_enabled: yes
powerdns_webserver_port: 8081
powerdns_dns_port: 53

# DNSSEC
powerdns_dnssec_enabled: yes

# Zone replication (AXFR/NOTIFY) — NetBird mesh only
# SECURITY: Use NetBird IPs (not public IPs) for encrypted zone replication
# Fallback to public IPs for initial deployment, will be updated after NetBird deployment
powerdns_allow_axfr_ips:
  - "{{ hostvars['ns2']['netbird_ip'] | default(hostvars['ns2']['ansible_host']) }}"
powerdns_also_notify:
  - "{{ hostvars['ns2']['netbird_ip'] | default(hostvars['ns2']['ansible_host']) }}"

# PostgreSQL configuration
powerdns_db_name: powerdns
powerdns_db_user: pdns
# powerdns_db_password: <set in vault or group_vars>

# PowerDNS-Admin configuration
powerdns_admin_enabled: yes
powerdns_admin_port: 9191
powerdns_admin_secret_key: ""  # Generated if not set
powerdns_admin_sqla_db_name: pdnsadmin
powerdns_admin_sqla_db_user: pdnsadmin
# powerdns_admin_sqla_db_password: <set in vault or group_vars>

# Nginx proxy configuration (exposes API + Admin UI on NetBird interface)
powerdns_nginx_api_port: 8081      # PowerDNS API
powerdns_nginx_admin_port: 8080    # PowerDNS-Admin UI
powerdns_bind_interface: "{{ netbird_ip | default('127.0.0.1') }}"  # Bind to NetBird IP

# API security
# powerdns_api_key: <set in vault or group_vars>

# Logging
powerdns_log_level: "4"  # 0=nothing, 9=very verbose
