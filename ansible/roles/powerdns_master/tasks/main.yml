---
# PowerDNS authoritative primary — runs on ns1 (Falkenstein)
# Provides: primary DNS for all customer zones, REST API for Management API, AXFR to ns2
#
# Runs as a Docker Compose stack:
#   - powerdns/pdns-auth-49  — PowerDNS authoritative server
#   - postgres:16             — PostgreSQL backend (sidecar, data on named volume)
#
# Firewall: port 53 (UDP+TCP) already opened by common/nftables role.
# API port 8081 is bound to 127.0.0.1 only — not exposed publicly.

# ---------------------------------------------------------------------------
# Docker — install from Docker's official apt repo
# ---------------------------------------------------------------------------

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Add Docker apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian
      bookworm stable
    filename: docker
    state: present
    update_cache: true

- name: Install Docker CE and Docker Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Start and enable Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Configure Docker daemon DNS and log rotation
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "dns": ["1.1.1.1", "8.8.8.8"],
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "userland-proxy": false
      }
    owner: root
    group: root
    mode: '0644'
  notify: Restart Docker

# ---------------------------------------------------------------------------
# Directory layout
# ---------------------------------------------------------------------------

- name: Create PowerDNS stack directory
  ansible.builtin.file:
    path: /opt/powerdns
    state: directory
    owner: root
    group: root
    mode: '0750'

# ---------------------------------------------------------------------------
# Configuration files
# ---------------------------------------------------------------------------

- name: Deploy PowerDNS primary configuration
  ansible.builtin.template:
    src: pdns.conf.j2
    dest: /opt/powerdns/pdns.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart PowerDNS

- name: Deploy Docker Compose stack
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/powerdns/docker-compose.yml
    owner: root
    group: root
    mode: '0640'
  notify: Restart PowerDNS

# ---------------------------------------------------------------------------
# Start the stack
# ---------------------------------------------------------------------------

- name: Pull and start PowerDNS stack
  community.docker.docker_compose_v2:
    project_src: /opt/powerdns
    state: present
    pull: always

# ---------------------------------------------------------------------------
# Schema initialisation — idempotent: only runs if the domains table is absent
# ---------------------------------------------------------------------------

- name: Wait for PostgreSQL to be ready (pre-schema)
  ansible.builtin.command:
    cmd: >
      docker compose exec -T postgres
      pg_isready -U {{ pdns_db_user }} -d {{ pdns_db_name }}
  args:
    chdir: /opt/powerdns
  register: powerdns_master_pg_ready
  retries: 12
  delay: 5
  until: powerdns_master_pg_ready.rc == 0
  changed_when: false

- name: Check if powerdns_admin database exists
  ansible.builtin.command:
    cmd: >
      docker compose exec -T postgres
      psql -U {{ pdns_db_user }} -d postgres -tAc
      "SELECT 1 FROM pg_database WHERE datname='{{ pdns_db_name }}_admin'"
  args:
    chdir: /opt/powerdns
  register: powerdns_master_admindb_check
  changed_when: false

- name: Create powerdns_admin database for PDns-Admin web UI
  ansible.builtin.command:
    cmd: >
      docker compose exec -T postgres
      psql -U {{ pdns_db_user }} -d postgres -c
      "CREATE DATABASE {{ pdns_db_name }}_admin OWNER {{ pdns_db_user }}"
  args:
    chdir: /opt/powerdns
  when: powerdns_master_admindb_check.stdout | trim != '1'
  changed_when: true

- name: Check if PowerDNS schema already exists
  ansible.builtin.command:
    cmd: >
      docker compose exec -T postgres
      psql -U {{ pdns_db_user }} -d {{ pdns_db_name }}
      -tAc "SELECT to_regclass('public.domains')"
  args:
    chdir: /opt/powerdns
  register: powerdns_master_schema_check
  changed_when: false

- name: Load PowerDNS PostgreSQL schema
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      docker run --rm --entrypoint=sh --network powerdns_default \
        {{ pdns_image }} \
        -c "cat /usr/local/share/doc/pdns/schema.pgsql.sql" | \
        docker compose exec -T postgres \
        psql -U {{ pdns_db_user }} -d {{ pdns_db_name }}
    executable: /bin/bash
  args:
    chdir: /opt/powerdns
  when: powerdns_master_schema_check.stdout | trim == ''
  changed_when: true
  notify: Restart PowerDNS

- name: Wait for PowerDNS to be listening on port 53
  ansible.builtin.wait_for:
    port: 53
    host: "127.0.0.1"
    timeout: 60
    delay: 5

- name: Wait for PowerDNS API to be ready
  ansible.builtin.wait_for:
    port: "{{ pdns_api_port }}"
    host: "127.0.0.1"
    timeout: 30
    delay: 2

- name: Wait for PowerDNS-Admin web UI to be ready
  ansible.builtin.wait_for:
    port: "{{ pdns_admin_port }}"
    host: "127.0.0.1"
    timeout: 120
    delay: 5
