---
# PowerDNS Master Role -- Main Tasks
# Deploys PowerDNS Primary on ns1 with PostgreSQL backend
# Uses Docker internal network + nginx proxy for security
# See docs/DISPERSED_DNS_ARCHITECTURE.md for architecture details

- name: Check if NetBird IP is available
  set_fact:
    has_netbird_ip: "{{ netbird_ip is defined and netbird_ip | length > 0 }}"
    powerdns_bind_interface_actual: "{{ netbird_ip | default('127.0.0.1') }}"

- name: Display binding interface
  debug:
    msg: "PowerDNS will bind to: {{ powerdns_bind_interface_actual }} ({{ 'NetBird mesh' if has_netbird_ip else 'localhost - will reconfigure after NetBird deployment' }})"

- name: Create PowerDNS installation directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ powerdns_install_dir }}"
    - "{{ powerdns_install_dir }}/backups"

- name: Ensure secrets directory exists on controller
  file:
    path: "{{ playbook_dir }}/.generated_secrets"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  run_once: true

- name: Generate PowerDNS API key if not set
  set_fact:
    powerdns_api_key: "{{ lookup('password', playbook_dir + '/.generated_secrets/powerdns_api_key length=64 chars=ascii_letters,digits') }}"
  when: powerdns_api_key is not defined or powerdns_api_key | length == 0
  no_log: true

- name: Generate PostgreSQL password if not set
  set_fact:
    powerdns_db_password: "{{ lookup('password', playbook_dir + '/.generated_secrets/powerdns_db_password length=32 chars=ascii_letters,digits') }}"
  when: powerdns_db_password is not defined or powerdns_db_password | length == 0
  no_log: true

- name: Generate PowerDNS-Admin database password if not set
  set_fact:
    powerdns_admin_sqla_db_password: "{{ lookup('password', playbook_dir + '/.generated_secrets/powerdns_admin_sqla_db_password length=32 chars=ascii_letters,digits') }}"
  when: powerdns_admin_sqla_db_password is not defined or powerdns_admin_sqla_db_password | length == 0
  no_log: true

- name: Generate PowerDNS-Admin secret key if not set
  set_fact:
    powerdns_admin_secret_key: "{{ lookup('password', playbook_dir + '/.generated_secrets/powerdns_admin_secret_key length=64 chars=ascii_letters,digits') }}"
  when: powerdns_admin_secret_key is not defined or powerdns_admin_secret_key | length == 0
  no_log: true

- name: Deploy PostgreSQL schema initialization script
  template:
    src: init-schema.sql.j2
    dest: "{{ powerdns_install_dir }}/init-schema.sql"
    mode: '0644'

- name: Deploy PowerDNS configuration
  template:
    src: pdns.conf.j2
    dest: "{{ powerdns_install_dir }}/pdns.conf"
    mode: '0600'
  notify: restart powerdns

- name: Deploy nginx proxy configuration
  template:
    src: nginx.conf.j2
    dest: "{{ powerdns_install_dir }}/nginx.conf"
    mode: '0644'
  notify: restart powerdns

- name: Deploy docker-compose.yml for PowerDNS
  template:
    src: docker-compose.yml.j2
    dest: "{{ powerdns_install_dir }}/docker-compose.yml"
    mode: '0644'
  notify: restart powerdns

- name: Start PowerDNS services
  community.docker.docker_compose_v2:
    project_src: "{{ powerdns_install_dir }}"
    state: present
  register: powerdns_compose_result

- name: Wait for PostgreSQL to be ready
  uri:
    url: "http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_api_port }}/api/v1/servers/localhost"
    method: GET
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
    status_code: 200
  retries: 30
  delay: 2
  register: result
  until: result.status == 200

- name: Create platform zone (phoenix-host.net)
  uri:
    url: "http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_api_port }}/api/v1/servers/localhost/zones"
    method: POST
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "{{ platform_domain }}."
      kind: "Master"
      nameservers:
        - "ns1.{{ platform_domain }}."
        - "ns2.{{ platform_domain }}."
      soa_edit_api: "INCEPTION-INCREMENT"
    status_code: [201, 409]  # 409 = already exists
  register: zone_create_result
  ignore_errors: yes

- name: Increment SOA serial after zone creation (gotcha 33)
  command: >
    docker exec powerdns-auth pdnsutil increase-serial {{ platform_domain }}
  when: zone_create_result.status == 201
  changed_when: true

- name: Notify secondary of zone update
  command: >
    docker exec powerdns-auth pdns_control notify {{ platform_domain }}
  when: zone_create_result.status == 201
  changed_when: true

- name: Display PowerDNS deployment status
  debug:
    msg:
      - "PowerDNS Primary deployed on {{ inventory_hostname }}"
      - "DNS Server: {{ ansible_default_ipv4.address }}:53 (public)"
      - "PowerDNS API: http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_api_port }} (NetBird only)"
      - "PowerDNS-Admin UI: http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_admin_port }} (NetBird only)"
      - "Platform zone created: {{ platform_domain }}"
      - ""
      - "Access PowerDNS-Admin:"
      - "  1. Connect to NetBird mesh"
      - "  2. Open http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_admin_port }}"
      - "  3. First login will create admin account"

- name: Display security notice
  debug:
    msg:
      - "SECURITY: PowerDNS API and Admin UI are only accessible via NetBird mesh"
      - "Public access: DNS queries only (port 53)"
      - "Internal access: API (port 8081) + Admin UI (port 8080) via {{ powerdns_bind_interface }}"
