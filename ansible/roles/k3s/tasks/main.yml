---
# Provision k3s cluster on admin1.phoenix-host.net
# Single-node control plane for Phase 1
# Runs management API + MariaDB as proof-of-concept

- name: Ensure k3s installation directory exists
  ansible.builtin.file:
    path: /opt/k3s
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: '0755'
    force: false

- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install k3s
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION={{ k3s_version }} \
      INSTALL_K3S_EXEC="--disable=traefik --disable=servicelb --kubelet-arg=kube-reserved=cpu=200m,memory=256Mi" \
      sh -
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: not k3s_binary.stat.exists
  register: k3s_install_result

- name: Enable k3s service
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for k3s API to be ready
  ansible.builtin.wait_for:
    port: 6443
    delay: 5
    timeout: 120

- name: Create kubeconfig directory for ansible user
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Copy kubeconfig to standard location
  ansible.builtin.copy:
    remote_src: true
    src: /etc/rancher/k3s/k3s.yaml
    dest: /root/.kube/config
    owner: root
    group: root
    mode: '0600'
  notify: Fix k3s kubeconfig ownership

- name: Install kubectl locally for verification
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ k3s_version }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: '0755'
    force: false

- name: Verify k3s cluster is healthy
  ansible.builtin.shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml /usr/local/bin/kubectl get nodes
  register: k3s_nodes_check
  until: "'Ready' in k3s_nodes_check.stdout"
  retries: 10
  delay: 5

- name: Create platform namespace
  ansible.builtin.shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml /usr/local/bin/kubectl create namespace platform --dry-run=client -o yaml | \
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml /usr/local/bin/kubectl apply -f -

- name: Create ingress namespace
  ansible.builtin.shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml /usr/local/bin/kubectl create namespace ingress-nginx --dry-run=client -o yaml | \
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml /usr/local/bin/kubectl apply -f -

- name: Copy kubeconfig to local control node via fetch
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /tmp/k3s-kubeconfig.yaml
    flat: true
  when: inventory_hostname == 'admin1'
