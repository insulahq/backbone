---
# k3s Role — Main Tasks
# Deploys k3s Kubernetes on admin1 and platform servers

- name: Check if this is a server or agent node
  set_fact:
    k3s_role: "{{ 'server' if k3s_server_enabled else 'agent' }}"

- name: Display k3s deployment mode
  debug:
    msg: "Deploying k3s {{ k3s_role }} on {{ inventory_hostname }}"

- name: Install required packages
  apt:
    name:
      - curl
      - jq
      - apt-transport-https
      - ca-certificates
    state: present
    update_cache: yes

- name: Set kernel parameters required by k3s (protect-kernel-defaults)
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/99-k3s.conf
  loop:
    - { name: "vm.overcommit_memory", value: "1" }
    - { name: "kernel.panic", value: "10" }
    - { name: "kernel.panic_on_oops", value: "1" }
  when: k3s_protect_kernel_defaults

- name: Create k3s configuration directory
  file:
    path: "{{ k3s_server_config_dir }}"
    state: directory
    mode: '0755'

- name: Generate k3s token if not set (for multi-node clusters)
  set_fact:
    k3s_token: "{{ lookup('password', '/dev/null length=64 chars=ascii_letters,digits') }}"
  when: 
    - k3s_token is not defined or k3s_token | length == 0
    - k3s_server_enabled
  no_log: true
  run_once: true

- name: Save k3s token to file
  copy:
    content: "{{ k3s_token }}"
    dest: "{{ k3s_server_config_dir }}/.token"
    mode: '0600'
  when: 
    - k3s_token is defined
    - k3s_server_enabled
  no_log: true

- name: Deploy k3s configuration file
  template:
    src: k3s-config.yaml.j2
    dest: "{{ k3s_server_config_dir }}/config.yaml"
    mode: '0644'

- name: Check if k3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Get installed k3s version
  command: /usr/local/bin/k3s --version
  register: k3s_installed_version
  changed_when: false
  failed_when: false
  when: k3s_binary.stat.exists

- name: Download and install k3s
  shell: |
    export INSTALL_K3S_CHANNEL="{{ k3s_channel }}"
    export INSTALL_K3S_EXEC="{{ 'server' if k3s_server_enabled else 'agent' }}"
    export K3S_CONFIG_FILE="{{ k3s_server_config_dir }}/config.yaml"
    {% if k3s_version | length > 0 %}
    export INSTALL_K3S_VERSION="{{ k3s_version }}"
    {% endif %}
    curl -sfL {{ k3s_install_script_url }} | sh -
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_binary.stat.exists or (k3s_version | length > 0 and k3s_version not in k3s_installed_version.stdout)

- name: Ensure k3s service is enabled and started
  systemd:
    name: "k3s{% if not k3s_server_enabled %}-agent{% endif %}"
    enabled: yes
    state: started
    daemon_reload: yes

- name: Wait for k3s to be ready (server mode)
  command: /usr/local/bin/k3s kubectl get nodes
  register: k3s_nodes
  retries: 30
  delay: 5
  until: k3s_nodes.rc == 0
  changed_when: false
  when: k3s_server_enabled

- name: Get k3s node status
  command: /usr/local/bin/k3s kubectl get nodes -o json
  register: k3s_node_status
  changed_when: false
  when: k3s_server_enabled

- name: Create kubectl alias for convenience
  copy:
    content: |
      # kubectl alias
      alias k='kubectl'
      alias kubectl='k3s kubectl'
      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    dest: /etc/profile.d/k3s.sh
    mode: '0644'
  when: k3s_server_enabled

- name: Create kubeconfig for remote access (server mode)
  when: k3s_server_enabled
  block:
    - name: Read k3s kubeconfig
      slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig_content

    - name: Decode kubeconfig
      set_fact:
        k3s_kubeconfig: "{{ k3s_kubeconfig_content.content | b64decode }}"

    - name: Save kubeconfig for remote access
      copy:
        content: "{{ k3s_kubeconfig | regex_replace('127.0.0.1', ansible_default_ipv4.address) }}"
        dest: "{{ k3s_server_config_dir }}/k3s-remote.yaml"
        mode: '0600'

- name: Display k3s deployment status
  debug:
    msg: "k3s {{ k3s_role }} deployed on {{ inventory_hostname }} ({{ k3s_version }})"

- name: Display server mode instructions
  debug:
    msg:
      - "Kubeconfig local: export KUBECONFIG=/etc/rancher/k3s/k3s.yaml"
      - "Kubeconfig remote: {{ k3s_server_config_dir }}/k3s-remote.yaml"
      - "Quick commands: kubectl get nodes, kubectl get pods -A"
  when: k3s_server_enabled

- name: Display disabled components
  debug:
    msg: "Disabled: {{ k3s_disable_components | join(', ') }} - Will deploy platform alternatives"

- name: Display security features
  debug:
    msg: "Security: Secrets encryption={{ k3s_secrets_encryption }}, Kernel protection={{ k3s_protect_kernel_defaults }}"
