---
# Traefik Standalone Role — Main Tasks
# Deploys a shared Traefik reverse proxy.
# Creates the traefik_public Docker network that other stacks attach to.

- name: Load PowerDNS API key from generated secrets (for ACME DNS-01)
  set_fact:
    powerdns_api_key: "{{ lookup('file', playbook_dir + '/.generated_secrets/powerdns_api_key', errors='ignore') | default('') }}"
  when: powerdns_api_key is not defined or powerdns_api_key == ''
  no_log: true
  tags: [traefik]

- name: Assert PowerDNS API key is set (ACME would silently fail without it)
  assert:
    that:
      - powerdns_api_key is defined
      - powerdns_api_key | length > 0
    fail_msg: >-
      powerdns_api_key is empty — Traefik would deploy but every DNS-01 ACME
      challenge would fail. Run the PowerDNS role first (it generates the key),
      or set powerdns_api_key explicitly.
  tags: [traefik]

- name: Create Traefik installation directory
  file:
    path: "{{ traefik_install_dir }}"
    state: directory
    mode: '0755'
  tags: [traefik]

- name: Create acme.json for Let's Encrypt certificates
  file:
    path: "{{ traefik_install_dir }}/acme.json"
    state: touch
    mode: '0600'
    modification_time: preserve
    access_time: preserve
  tags: [traefik]

- name: Create shared traefik_public Docker network (dual-stack)
  community.docker.docker_network:
    name: "{{ traefik_public_network }}"
    driver: bridge
    enable_ipv6: "{{ traefik_public_ipv6_enabled | default(true) }}"
    ipam_config:
      - subnet: "{{ traefik_public_subnet }}"
        gateway: "{{ traefik_public_gateway }}"
      - subnet: "{{ traefik_public_subnet_v6 }}"
    state: present
  tags: [traefik]

- name: Ensure powerdns_internal Docker network exists (also created by PowerDNS role)
  community.docker.docker_network:
    name: powerdns_internal
    driver: bridge
    state: present
  tags: [traefik]

- name: Deploy wildcard TLS dynamic config
  template:
    src: dynamic.yml.j2
    dest: "{{ traefik_install_dir }}/dynamic.yml"
    mode: '0644'
  when: traefik_wildcard_cert | default(true)
  notify: restart traefik
  tags: [traefik]

# The propagation check queries every authoritative nameserver and cannot pass
# while one does not answer. That happens only while the platform is first
# built (site.yml starts the primary's Traefik before the secondary's PowerDNS
# exists), and then no nameserver can hold a stale "does not exist" for the
# challenge name either. So the check is on when all answer and off otherwise;
# test-suite fails on a Traefik left with it off (gotcha 165).
- name: Check that every platform nameserver answers (ACME propagation check)
  command: >-
    dig +short +norec +time=3 +tries=2 SOA {{ platform_domain }}
    @{{ hostvars[item]['ansible_host'] }}
  loop: "{{ groups['dns_servers'] }}"
  register: _traefik_ns_probe
  changed_when: false
  failed_when: false
  check_mode: false  # read-only; --check must see the real answer
  tags: [traefik]

- name: Decide whether ACME waits for every nameserver
  set_fact:
    _traefik_acme_propagation_check: >-
      {{ (_traefik_ns_probe.results | selectattr('rc', 'equalto', 0) | map(attribute='stdout')
          | select('match', '[^ ]+ [^ ]+ [0-9]+ ') | list | length) == (groups['dns_servers'] | length) }}
  tags: [traefik]

- name: Warn that the ACME propagation check is off
  debug:
    msg: >-
      WARNING: not every nameserver answers for {{ platform_domain }}, so the ACME
      propagation check is OFF on {{ inventory_hostname }}. Re-run deploy-traefik.yml
      once they all do; test-suite fails until then.
  when: not _traefik_acme_propagation_check | bool
  tags: [traefik]

- name: Deploy Traefik docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ traefik_install_dir }}/docker-compose.yml"
    mode: '0640'  # contains PDNS_API_KEY env var
  notify: restart traefik
  tags: [traefik]

- name: Start Traefik stack
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_install_dir }}"
    pull: missing
    state: present
  tags: [traefik]

- name: Wait for Traefik to be ready (port 443 listening)
  wait_for:
    port: 443
    host: "{{ ansible_default_ipv4.address | default('127.0.0.1') }}"
    timeout: 30
    delay: 3
  tags: [traefik]

- name: Display Traefik deployment status
  debug:
    msg:
      - "Traefik {{ traefik_version }} deployed on {{ inventory_hostname }}"
      - "Shared network: {{ traefik_public_network }} ({{ traefik_public_subnet }})"
      - "Traefik fixed IP: {{ traefik_container_ip }} (set as trustedHTTPProxy in downstream apps)"
      - "PDNS API URL: {{ traefik_pdns_api_url }}"
  tags: [traefik]
