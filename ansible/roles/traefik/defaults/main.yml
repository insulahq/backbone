---
# Traefik Standalone Role — Default Variables
# Deploys a shared Traefik reverse proxy with a public Docker network
# that other stacks (NetBird, PowerDNS-Admin, etc.) can attach to for TLS termination.

# Version
traefik_version: "v3.6"

# Installation directory
traefik_install_dir: /opt/traefik

# The shared Docker network name (external stacks declare it as `external: true`)
traefik_public_network: traefik_public
traefik_public_subnet: "172.31.0.0/24"
traefik_public_gateway: "172.31.0.1"
traefik_container_ip: "172.31.0.254"  # Fixed IP — used as trustedHTTPProxy in downstream apps

# ACME / Let's Encrypt
traefik_acme_email: "admin@{{ platform_domain }}"
traefik_acme_challenge: dns-01
traefik_acme_dns_provider: pdns

# PowerDNS API URL for DNS-01 challenge.
# DNS-01 requires writing TXT records, which only the PRIMARY PowerDNS (ns1) supports.
# ns2's secondary PowerDNS is read-only (AXFR), so ns2 must also use ns1's API.
# On ns1: uses local nginx proxy (NetBird IP). On ns2: reaches ns1 via NetBird mesh.
# Note: ns2 cert renewal depends on ns1 being reachable. Certs are valid 90 days,
# so ns1 would need to be down for >60 days before ns2 certs expire.
traefik_pdns_api_url: "http://{{ hostvars['ns1']['netbird_ip'] | default('127.0.0.1') }}:8081"

# Logging
traefik_log_level: INFO
