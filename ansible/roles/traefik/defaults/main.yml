---
# Traefik Standalone Role — Default Variables
# Deploys a shared Traefik reverse proxy with a public Docker network
# that other stacks (NetBird, PowerDNS-Admin, etc.) can attach to for TLS termination.

# Version
traefik_version: "v3.6"

# Installation directory
traefik_install_dir: /opt/traefik

# The shared Docker network name (external stacks declare it as `external: true`)
traefik_public_network: traefik_public
traefik_public_subnet: "172.31.0.0/24"
traefik_public_gateway: "172.31.0.1"
traefik_container_ip: "172.31.0.254"  # Fixed IPv4 — used as trustedHTTPProxy in downstream apps

# IPv6 dual-stack for traefik_public network
traefik_public_ipv6_enabled: true
traefik_public_subnet_v6: "fd00:traefik::0/112"
traefik_container_ipv6: "fd00:traefik::fe"  # Fixed IPv6 — trustedHTTPProxy alongside IPv4

# ACME / Let's Encrypt
traefik_acme_email: "admin@{{ platform_domain }}"
traefik_acme_challenge: dns-01
traefik_acme_dns_provider: pdns

# Wildcard certificate for *.{{ platform_domain }}
# Covers all subdomains automatically — no per-service ACME challenge needed.
# Requires DNS-01 (already configured above). Individual services no longer
# need certresolver labels; they inherit the wildcard via the default TLS store.
traefik_wildcard_cert: true

# PowerDNS API URL for DNS-01 challenge.
# Both nodes run PowerDNS with shared PostgreSQL HA backend (Native mode),
# so each node uses its OWN local PowerDNS API for ACME challenges.
# No single point of failure: if one node is down, the other renews certs independently.
traefik_pdns_api_url: "http://{{ netbird_ip | default('127.0.0.1', true) }}:8081"

# Logging
traefik_log_level: INFO
