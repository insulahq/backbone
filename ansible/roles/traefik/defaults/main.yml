---
# Traefik Standalone Role — Default Variables
# Deploys a shared Traefik reverse proxy with a public Docker network
# that other stacks (NetBird, PowerDNS-Admin, etc.) can attach to for TLS termination.

# Version — pinned to an exact patch release. A floating minor tag only
# moves on rolling-update.yml (pull: always) — role deploys use
# pull: missing — so it was neither "auto-patched" nor predictable: a
# rolling update could pull a patch published hours earlier.
# v3.7 behavior changes: Host(`*`) catch-all, StripPrefix 400s, BasicAuth
# empty-user unmount — none of these features are used here (TCP passthrough
# uses HostSNI, which is unaffected). 3.7.13 stopped forwarding
# `Upgrade: h2c`; NetBird is unaffected because its service sets scheme=h2c
# explicitly. 3.7.15 carries the 3.7.9-3.7.14 security fixes.
traefik_version: "v3.7.15"

# Installation directory
traefik_install_dir: /opt/traefik

# The shared Docker network name (external stacks declare it as `external: true`)
traefik_public_network: traefik_public
traefik_public_subnet: "172.31.0.0/24"
traefik_public_gateway: "172.31.0.1"
traefik_container_ip: "172.31.0.254"  # Fixed IPv4 — used as trustedHTTPProxy in downstream apps

# IPv6 dual-stack for traefik_public network
traefik_public_ipv6_enabled: true
traefik_public_subnet_v6: "fd00:dead:beef:1::/112"
traefik_container_ipv6: "fd00:dead:beef:1::fe"  # Fixed IPv6 — trustedHTTPProxy alongside IPv4

# ACME / Let's Encrypt
traefik_acme_email: "admin@{{ platform_domain }}"
traefik_acme_challenge: dns-01
traefik_acme_dns_provider: pdns

# Wildcard certificate for *.{{ platform_domain }}
# Covers all subdomains automatically — no per-service ACME challenge needed.
# Requires DNS-01 (already configured above). Individual services no longer
# need certresolver labels; they inherit the wildcard via the default TLS store.
traefik_wildcard_cert: true

# PowerDNS API URL for DNS-01 challenge.
# Always point at the LOCAL powerdns-nginx over the shared powerdns_internal
# Docker bridge. The local PowerDNS serves read-write zone data regardless of
# PG role because pgproxy routes all writes to the current primary (gotcha 95
# covered the old cross-node fallback; that dependency made Traefik's ACME
# silently break after a full ns1 outage — cert renewals fell off a cliff
# because the URL was baked in at deploy time).
#
# Traefik container joins powerdns_internal (see docker-compose.yml.j2).
traefik_pdns_api_url: "http://powerdns-nginx:8081"

# DNS-01 challenges (gotcha 165). Both nodes' PowerDNS read one database, but
# an API write clears only the cache of the node it went to, so the other node
# keeps serving what it cached before the write: "does not exist" for up to
# negquery-cache-ttl + cache-ttl (60 + 20 s; measured 70-85 s), or the record
# without the second challenge value (wildcard and apex share one TXT name;
# ~20 s). Any lookup of the name can plant that, Traefik's own SOA lookup to
# find the zone included, and Let's Encrypt's resolvers keep what they saw for
# the record TTL, failing the other challenge. So the first propagation check
# waits until nothing cached before the writes can be served (must exceed
# those PowerDNS TTLs, roles/powerdns/templates/pdns.conf.j2), then checks
# every authoritative nameserver for the value. Seconds.
traefik_acme_delay_before_checks: 90
# Whole wait per challenge, delay included; lego retries the check every 2 s.
traefik_acme_propagation_timeout: 300

# Rate limiting middleware (applied to public service routers)
traefik_ratelimit_average: 100        # Requests per second average
traefik_ratelimit_burst: 200          # Maximum burst size

# Logging
traefik_log_level: INFO
