---
# Molecule test configuration for backup role
# Tests Restic installation and systemd timer setup (no backup server connection)
# Runs: molecule test -s default (from roles/backup/)
# Requires: pip install molecule molecule-plugins[docker]

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/../../requirements.yml

driver:
  name: docker

platforms:
  - name: test-backup
    image: debian:trixie
    pre_build_image: true
    privileged: true
    command: /sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  inventory:
    host_vars:
      test-backup:
        backup_sftp_user: "testuser"
        backup_sftp_host: "localhost"
        backup_sftp_path: "/backups"
        restic_password: "test_password_for_molecule"
        restic_ssh_key_src: "/dev/null"

verifier:
  name: ansible
