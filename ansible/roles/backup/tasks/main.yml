---
# Backup Role — Main Tasks
# Deploys Restic backup to Hetzner Storagebox

- name: Skip backup deployment (backup_enabled is false)
  debug:
    msg: "Backup deployment skipped — set backup_enabled: true in group_vars/all.yml when Storagebox credentials are available."
  when: not (backup_enabled | bool)
  tags: [backup]

- name: End play for this host if backups disabled
  meta: end_host
  when: not (backup_enabled | bool)
  tags: [backup]

- name: Install required packages
  apt:
    name:
      - curl
      - jq
      - bzip2
    state: present
    update_cache: yes
  tags: [backup]

- name: Check if Restic is already installed
  stat:
    path: "{{ restic_install_dir }}/restic"
  register: restic_binary

- name: Get installed Restic version
  command: "{{ restic_install_dir }}/restic version"
  register: restic_installed_version
  changed_when: false
  failed_when: false
  when: restic_binary.stat.exists

- name: Download and install Restic
  when: not restic_binary.stat.exists or restic_version not in restic_installed_version.stdout
  block:
    - name: Download Restic binary
      get_url:
        url: "https://github.com/restic/restic/releases/download/v{{ restic_version }}/restic_{{ restic_version }}_linux_{{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}.bz2"
        dest: "/tmp/restic_{{ restic_version }}.bz2"
        mode: '0644'
      register: restic_download

    - name: Extract Restic binary
      command: "bunzip2 -f /tmp/restic_{{ restic_version }}.bz2"
      when: restic_download.changed

    - name: Install Restic binary
      copy:
        src: "/tmp/restic_{{ restic_version }}"
        dest: "{{ restic_install_dir }}/restic"
        mode: '0755'
        remote_src: yes
      when: restic_download.changed

    - name: Clean up downloaded files
      file:
        path: "/tmp/restic_{{ restic_version }}"
        state: absent

- name: Create Restic directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - "{{ restic_config_dir }}"
    - "{{ restic_cache_dir }}"
    - /var/log/restic

- name: Ensure secrets directory exists on controller
  file:
    path: "{{ playbook_dir }}/.generated_secrets"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  run_once: true

- name: Generate Restic password if not set
  set_fact:
    restic_password: "{{ lookup('password', playbook_dir + '/.generated_secrets/restic_password length=64 chars=ascii_letters,digits') }}"
  when: restic_password is not defined or restic_password | length == 0
  no_log: true

- name: Create Restic password file
  copy:
    content: "{{ restic_password }}"
    dest: "{{ restic_config_dir }}/password"
    mode: '0600'
  no_log: true

- name: Ensure .ssh directory exists
  file:
    path: /root/.ssh
    state: directory
    mode: '0700'

- name: Deploy Storagebox SSH private key from control machine
  copy:
    src: "{{ restic_ssh_key_src }}"
    dest: "{{ restic_ssh_key_path }}"
    mode: '0600'
  no_log: true

- name: Create SSH config for Storagebox
  copy:
    content: |
      Host {{ backup_storagebox_host }}
        IdentityFile {{ restic_ssh_key_path }}
        StrictHostKeyChecking yes
        UserKnownHostsFile /root/.ssh/known_hosts
    dest: /root/.ssh/config
    mode: '0600'

- name: Scan and trust Storagebox host keys (restic-specific known_hosts)
  # Restic bypasses system SSH config (due to NetBird ProxyCommand interception).
  # Seed a dedicated known_hosts file in restic config dir used by the backup script.
  shell: |
    ssh-keyscan -H {{ backup_storagebox_host }} 2>/dev/null | grep -v "^#" > {{ restic_config_dir }}/known_hosts.tmp
    mv {{ restic_config_dir }}/known_hosts.tmp {{ restic_config_dir }}/known_hosts
    chmod 600 {{ restic_config_dir }}/known_hosts
  changed_when: true

- name: Test Storagebox SFTP connection
  # Hetzner Storagebox only supports SFTP, not shell commands.
  # Use -F /dev/null to bypass NetBird SSH config interception (gotcha 9).
  # Use the restic-specific known_hosts file seeded by the keyscan task above.
  shell: "echo quit | sftp -F /dev/null -oConnectTimeout=10 -oStrictHostKeyChecking=yes -oUserKnownHostsFile={{ restic_config_dir }}/known_hosts -i {{ restic_ssh_key_path }} {{ backup_storagebox_user }}@{{ backup_storagebox_host }}"
  register: sftp_test
  changed_when: false
  failed_when: sftp_test.rc != 0
  retries: 3
  delay: 5

- name: Create PostgreSQL dump directory
  file:
    path: "{{ restic_pgdump_dir }}"
    state: directory
    mode: '0700'
  when: restic_pgdump_enabled
  tags: [backup]

- name: Deploy backup script
  template:
    src: restic-backup.sh.j2
    dest: "{{ restic_config_dir }}/backup.sh"
    mode: '0700'

- name: Deploy systemd service
  template:
    src: restic-backup.service.j2
    dest: /etc/systemd/system/restic-backup.service
    mode: '0644'
  notify: reload systemd

- name: Deploy systemd timer
  template:
    src: restic-backup.timer.j2
    dest: /etc/systemd/system/restic-backup.timer
    mode: '0644'
  notify: reload systemd

- name: Deploy logrotate configuration for Restic logs
  copy:
    dest: /etc/logrotate.d/restic-backup
    content: |
      /var/log/restic/*.log {
          weekly
          rotate 8
          compress
          delaycompress
          missingok
          notifempty
          create 0640 root root
      }
    mode: '0644'
  tags: [backup]

- name: Enable and start backup timer
  systemd:
    name: restic-backup.timer
    enabled: yes
    state: started
    daemon_reload: yes
  tags: [backup]

- name: Create backup paths list for display
  set_fact:
    backup_paths_display: "{{ restic_backup_paths | join(', ') if restic_backup_paths | length > 0 else 'None configured' }}"

- name: Display backup configuration
  debug:
    msg:
      - "Restic backup configured for {{ inventory_hostname }}"
      - "Repository: {{ restic_repository }}"
      - "Schedule: {{ restic_backup_schedule }} at {{ restic_backup_time }}"
      - "Retention: {{ restic_keep_daily }} daily, {{ restic_keep_weekly }} weekly, {{ restic_keep_monthly }} monthly"
      - "Backup paths: {{ backup_paths_display }}"
      - ""
      - "Manual backup: systemctl start restic-backup.service"
      - "Check status: systemctl status restic-backup.timer"
      - "View logs: journalctl -u restic-backup.service"
      - ""
      - "Useful Restic commands:"
      - "  List snapshots: restic -r {{ restic_repository }} snapshots"
      - "  Check repository: restic -r {{ restic_repository }} check"
      - "  Restore: restic -r {{ restic_repository }} restore latest --target /tmp/restore"
