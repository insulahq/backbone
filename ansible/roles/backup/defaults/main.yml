---
# Backup Role — Default Variables
# Deploys Restic backup to SFTP or S3-compatible storage

# Set to false to skip backup deployment (e.g., no backup server credentials yet)
backup_enabled: true

# Restic configuration
restic_version: "0.16.4"
restic_install_dir: /usr/local/bin
restic_config_dir: /etc/restic
restic_cache_dir: /var/cache/restic

# Backend type: "sftp" or "s3"
backup_backend: sftp

# --- SFTP backend settings ---
# restic_repository is auto-constructed from these when backup_backend=sftp
backup_sftp_user: ""
backup_sftp_host: ""
backup_sftp_path: backups
backup_sftp_port: 22  # Override to 23 for Hetzner Storage Box

# SSH key for SFTP backup server access
restic_ssh_key_src: "~/hosting-platform.key"      # path on control machine
restic_ssh_key_path: /etc/restic/hosting-platform.key  # deployed path on servers

# --- S3 backend settings ---
# Works with AWS S3, MinIO, Backblaze B2, Wasabi, or any S3-compatible service
backup_s3_endpoint: ""       # e.g. s3.amazonaws.com, s3.eu-central-1.amazonaws.com, s3.wasabisys.com
backup_s3_bucket: ""         # e.g. my-hosting-backups
backup_s3_path: ""           # optional prefix inside bucket (e.g. backups)
backup_s3_access_key: ""
backup_s3_secret_key: ""
backup_s3_region: ""         # optional, some providers require it

# Repository URL — auto-constructed based on backend type
restic_repository: >-
  {% if backup_backend == 's3' -%}
  s3:https://{{ backup_s3_endpoint }}/{{ backup_s3_bucket }}{{ ('/' + backup_s3_path) if backup_s3_path else '' }}/{{ inventory_hostname }}
  {%- else -%}
  sftp:{{ backup_sftp_user }}@{{ backup_sftp_host }}:{{ backup_sftp_path }}/{{ inventory_hostname }}
  {%- endif %}

# Restic repository password (for encryption)
# restic_password: <set in vault or group_vars>

# Backup schedule (systemd timers)
restic_backup_schedule: daily
restic_backup_time: "*-*-* 02:00:00"  # Daily at 2 AM (systemd OnCalendar format)

# Backup retention policy
restic_keep_daily: 7
restic_keep_weekly: 4
restic_keep_monthly: 12
restic_keep_yearly: 2

# Backup paths per server — resolved from group_vars using inventory_hostname
# e.g. ns1_backup_paths, ns2_backup_paths in group_vars/all.yml
restic_backup_paths: "{{ lookup('vars', inventory_hostname + '_backup_paths', default=[]) }}"

# Common backup exclusions
restic_exclude_patterns:
  - "*.tmp"
  - "*.log"
  - "*.cache"
  - "**/node_modules"
  - "**/venv"
  - "**/__pycache__"
  - "/tmp/*"
  - "/var/tmp/*"

# Backup notifications
# Webhook defaults to the central alert_webhook_url from common role.
# Override per-role if you want backup alerts to go somewhere different.
restic_notify_on_failure: true
restic_notify_email: ""
restic_notify_webhook_url: "{{ alert_webhook_url | default('') }}"

# PostgreSQL dump before backup (captures all database content)
# Pipes pg_dumpall directly to restic stdin (no plaintext staging on disk).
# Provides point-in-time recovery independent of streaming replication
# (protects against corruption that replicates to standby).
restic_pgdump_enabled: true

# Backup pre/post hooks (optional commands to run before/after backup)
restic_pre_backup_hook: ""
restic_post_backup_hook: ""

# Backup health check (optional)
restic_healthcheck_url: ""  # healthchecks.io or similar
