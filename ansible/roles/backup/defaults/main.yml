---
# Backup Role — Default Variables
# Deploys Restic backup to Hetzner Storagebox

# Restic configuration
restic_version: "0.16.4"
restic_install_dir: /usr/local/bin
restic_config_dir: /etc/restic
restic_cache_dir: /var/cache/restic

# Backup repository (Hetzner Storagebox)
restic_repository: "sftp:{{ backup_storagebox_user }}@{{ backup_storagebox_host }}:{{ backup_storagebox_path }}/{{ inventory_hostname }}"
# backup_storagebox_user: u335448-sub9
# backup_storagebox_host: u335448.your-storagebox.de
# backup_storagebox_path: /backups

# SSH key for Storagebox access
# The private key is copied from the control machine to each server.
# Stored in restic config dir (not /root/.ssh) so the hardened systemd service can read it.
restic_ssh_key_src: "~/phoenix-host.key"      # path on control machine
restic_ssh_key_path: /etc/restic/phoenix-host.key  # deployed path on servers

# Restic repository password (for encryption)
# restic_password: <set in vault or group_vars>

# Backup schedule (systemd timers)
restic_backup_schedule: daily
restic_backup_time: "02:00"  # 2 AM

# Backup retention policy
restic_keep_daily: 7
restic_keep_weekly: 4
restic_keep_monthly: 12
restic_keep_yearly: 2

# Backup paths per server — resolved from group_vars using inventory_hostname
# e.g. ns1_backup_paths, ns2_backup_paths, admin1_backup_paths in group_vars/all.yml
restic_backup_paths: "{{ lookup('vars', inventory_hostname + '_backup_paths', default=[]) }}"

# Common backup exclusions
restic_exclude_patterns:
  - "*.tmp"
  - "*.log"
  - "*.cache"
  - "**/node_modules"
  - "**/venv"
  - "**/__pycache__"
  - "/tmp/*"
  - "/var/tmp/*"

# Backup notifications (optional)
restic_notify_on_failure: false
restic_notify_email: ""

# Backup pre/post hooks (optional commands to run before/after backup)
restic_pre_backup_hook: ""
restic_post_backup_hook: ""

# Backup health check (optional)
restic_healthcheck_url: ""  # healthchecks.io or similar
