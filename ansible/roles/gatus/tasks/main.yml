---
# Gatus Monitoring Role — Main Tasks
# Deploys Gatus as HA status dashboard and alert receiver.
# Uses existing PostgreSQL HA cluster and Traefik reverse proxy.
# Deployed with serial: 1 so the first node creates the database before the second starts.

- name: Create Gatus installation directory
  file:
    path: "{{ gatus_install_dir }}"
    state: directory
    mode: '0755'
  tags: [gatus]

# --- Secret generation (idempotent, persisted to .generated_secrets/) ---

- name: Ensure secrets directory exists on controller
  file:
    path: "{{ playbook_dir }}/.generated_secrets"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  run_once: true
  tags: [gatus]

- name: Generate Gatus database password if not set
  set_fact:
    gatus_db_password: "{{ lookup('password', playbook_dir + '/.generated_secrets/gatus_db_password length=32 chars=ascii_letters,digits') }}"
  when: gatus_db_password is not defined or gatus_db_password | length == 0
  no_log: true
  tags: [gatus]

- name: Generate Gatus external endpoint token if not set
  set_fact:
    gatus_external_token: "{{ lookup('password', playbook_dir + '/.generated_secrets/gatus_external_token length=48 chars=ascii_letters,digits') }}"
  when: gatus_external_token is not defined or gatus_external_token | length == 0
  no_log: true
  tags: [gatus]

# --- Database creation (on primary only, replicated to standby) ---

- name: Check if Gatus database user exists
  community.docker.docker_container_exec:
    container: postgresql
    command: >
      psql -U postgres -tAc
      "SELECT 1 FROM pg_roles WHERE rolname='{{ gatus_db_user }}'"
  register: gatus_user_check
  changed_when: false
  when: inventory_hostname == postgresql_primary_node
  tags: [gatus]

- name: Create Gatus database user
  community.docker.docker_container_exec:
    container: postgresql
    command: >
      psql -U postgres -c
      "CREATE USER {{ gatus_db_user }} WITH PASSWORD '{{ gatus_db_password }}'"
  when:
    - inventory_hostname == postgresql_primary_node
    - gatus_user_check.stdout | default('') | trim == ""
  no_log: true
  tags: [gatus]

- name: Create Gatus database if not exists
  community.docker.docker_container_exec:
    container: postgresql
    command: >
      bash -c "psql -U postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='{{ gatus_db_name }}'\" | grep -q 1 || createdb -U postgres -O {{ gatus_db_user }} {{ gatus_db_name }}"
  when: inventory_hostname == postgresql_primary_node
  changed_when: false
  tags: [gatus]

# --- OIDC application creation in Zitadel (automated, requires PAT) ---
# Creates an OIDC application for Gatus in Zitadel if:
#   1. zitadel_service_pat is set (admin created a service account PAT)
#   2. gatus_oidc_client_id is NOT already set (app not yet created)
# The client_id and client_secret are persisted to .generated_secrets/

- name: Load persisted Gatus OIDC client_id if available
  set_fact:
    gatus_oidc_client_id: "{{ lookup('file', playbook_dir + '/.generated_secrets/gatus_oidc_client_id', errors='ignore') | default('', true) }}"
  when: gatus_oidc_client_id is not defined or gatus_oidc_client_id | length == 0
  tags: [gatus]

- name: Load persisted Gatus OIDC client_secret if available
  set_fact:
    gatus_oidc_client_secret: "{{ lookup('file', playbook_dir + '/.generated_secrets/gatus_oidc_client_secret', errors='ignore') | default('', true) }}"
  when: gatus_oidc_client_secret is not defined or gatus_oidc_client_secret | length == 0
  no_log: true
  tags: [gatus]

- name: Search for Zitadel project (for Gatus OIDC app)
  uri:
    url: "https://{{ zitadel_domain }}/management/v1/projects/_search"
    method: POST
    headers:
      Authorization: "Bearer {{ zitadel_service_pat }}"
      Content-Type: application/json
    body_format: json
    body: {}
    status_code: 200
    validate_certs: "{{ gatus_validate_certs | default(false) }}"
  register: gatus_oidc_project_search
  run_once: true
  when:
    - zitadel_service_pat | default('') | length > 0
    - gatus_oidc_client_id | default('') | length == 0
    - zitadel_project_id is not defined or zitadel_project_id | length == 0
  tags: [gatus]

- name: Set Zitadel project ID for Gatus
  set_fact:
    gatus_oidc_zitadel_project_id: >-
      {{ zitadel_project_id | default(
         gatus_oidc_project_search.json.result[0].id
         if (gatus_oidc_project_search.json.result | default([]) | length > 0)
         else '') }}
  run_once: true
  when:
    - zitadel_service_pat | default('') | length > 0
    - gatus_oidc_client_id | default('') | length == 0
  tags: [gatus]

- name: Create Gatus OIDC application in Zitadel
  uri:
    url: "https://{{ zitadel_domain }}/management/v1/projects/{{ gatus_oidc_zitadel_project_id }}/apps/oidc"
    method: POST
    headers:
      Authorization: "Bearer {{ zitadel_service_pat }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "Gatus Dashboard"
      redirectUris:
        - "{{ gatus_oidc_redirect_url }}"
      postLogoutRedirectUris:
        - "https://{{ gatus_domain }}"
      responseTypes:
        - "OIDC_RESPONSE_TYPE_CODE"
      grantTypes:
        - "OIDC_GRANT_TYPE_AUTHORIZATION_CODE"
      appType: "OIDC_APP_TYPE_WEB"
      authMethodType: "OIDC_AUTH_METHOD_TYPE_BASIC"
    status_code: [200, 409]
    validate_certs: "{{ gatus_validate_certs | default(false) }}"
  register: zitadel_oidc_app
  run_once: true
  when:
    - zitadel_service_pat | default('') | length > 0
    - gatus_oidc_client_id | default('') | length == 0
    - gatus_oidc_zitadel_project_id | default('') | length > 0
  tags: [gatus]

- name: Persist Gatus OIDC client_id
  copy:
    content: "{{ zitadel_oidc_app.json.clientId }}"
    dest: "{{ playbook_dir }}/.generated_secrets/gatus_oidc_client_id"
    mode: '0600'
  delegate_to: localhost
  become: false
  run_once: true
  when: zitadel_oidc_app is changed
  tags: [gatus]

- name: Persist Gatus OIDC client_secret
  copy:
    content: "{{ zitadel_oidc_app.json.clientSecret }}"
    dest: "{{ playbook_dir }}/.generated_secrets/gatus_oidc_client_secret"
    mode: '0600'
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  when: zitadel_oidc_app is changed
  tags: [gatus]

- name: Set OIDC client credentials from Zitadel API response
  set_fact:
    gatus_oidc_client_id: "{{ zitadel_oidc_app.json.clientId }}"
    gatus_oidc_client_secret: "{{ zitadel_oidc_app.json.clientSecret }}"
  run_once: true
  no_log: true
  when: zitadel_oidc_app is changed
  tags: [gatus]

# --- Deploy configuration files ---

- name: Deploy Gatus config
  template:
    src: config.yaml.j2
    dest: "{{ gatus_install_dir }}/config.yaml"
    mode: '0600'
  notify: restart gatus
  tags: [gatus]

- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ gatus_install_dir }}/docker-compose.yml"
    mode: '0644'
  notify: restart gatus
  tags: [gatus]

# --- Start Gatus ---

- name: Start Gatus stack
  community.docker.docker_compose_v2:
    project_src: "{{ gatus_install_dir }}"
    pull: missing
    state: present
  tags: [gatus]

- name: Wait for Gatus to be healthy
  uri:
    url: "http://127.0.0.1:{{ gatus_local_port }}/health"
    status_code: 200
  retries: 20
  delay: 3
  register: gatus_health
  until: gatus_health.status == 200
  tags: [gatus]

# --- DNS record creation (optional, via PowerDNS API) ---

- name: Build LUA health-check DNS records for Gatus
  set_fact:
    _gatus_lua_records: >-
      {{ [{'content': 'A "ifportup(' + (dns_health_check_port | default(443) | string) + ', {' +
          (groups['dns_servers'] | map('extract', hostvars, 'ansible_host') | map('regex_replace', '(.*)', "'" + '\\1' + "'") | join(', ')) +
          "}, {selector='all'})\"", 'disabled': false}] +
         ([] if (groups['dns_servers'] | map('extract', hostvars, 'public_ipv6') | select('defined') | list | length == 0) else
          [{'content': 'AAAA "ifportup(' + (dns_health_check_port | default(443) | string) + ', {' +
            (groups['dns_servers'] | map('extract', hostvars, 'public_ipv6') | select('defined') | map('regex_replace', '(.*)', "'" + '\\1' + "'") | join(', ')) +
            "}, {selector='all'})\"", 'disabled': false}])
      }}
  run_once: true
  when:
    - gatus_create_dns_records | default(true)
    - dns_health_check_enabled | default(false) | bool
  tags: [gatus, dns]

- name: Create DNS records for Gatus dashboard (health-checked LUA)
  when:
    - gatus_create_dns_records | default(true)
    - powerdns_api_key is defined
    - dns_health_check_enabled | default(false) | bool
  run_once: true
  uri:
    url: "http://{{ powerdns_bind_interface | default('127.0.0.1') }}:{{ powerdns_nginx_api_port | default('8081') }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      rrsets:
        - name: "{{ gatus_domain }}."
          type: A
          changetype: DELETE
        - name: "{{ gatus_domain }}."
          type: AAAA
          changetype: DELETE
        - name: "{{ gatus_domain }}."
          type: LUA
          ttl: "{{ dns_health_check_ttl | default(30) }}"
          changetype: REPLACE
          records: "{{ _gatus_lua_records }}"
    status_code: [200, 204]
  ignore_errors: true
  tags: [gatus, dns]

- name: Create DNS A records for Gatus dashboard (static round-robin)
  when:
    - gatus_create_dns_records | default(true)
    - powerdns_api_key is defined
    - not (dns_health_check_enabled | default(false) | bool)
  run_once: true
  uri:
    url: "http://{{ powerdns_bind_interface | default('127.0.0.1') }}:{{ powerdns_nginx_api_port | default('8081') }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      rrsets:
        - name: "{{ gatus_domain }}."
          type: A
          ttl: 300
          changetype: REPLACE
          records: >-
            {{
              groups['dns_servers']
              | map('extract', hostvars, 'ansible_host')
              | map('community.general.dict_kv', 'content')
              | map('combine', {'disabled': false})
              | list
            }}
    status_code: [200, 204]
  ignore_errors: true
  tags: [gatus, dns]

- name: Create DNS AAAA records for Gatus dashboard (static round-robin)
  when:
    - gatus_create_dns_records | default(true)
    - powerdns_api_key is defined
    - not (dns_health_check_enabled | default(false) | bool)
    - groups['dns_servers'] | map('extract', hostvars, 'public_ipv6') | select('defined') | list | length > 0
  run_once: true
  uri:
    url: "http://{{ powerdns_bind_interface | default('127.0.0.1') }}:{{ powerdns_nginx_api_port | default('8081') }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      rrsets:
        - name: "{{ gatus_domain }}."
          type: AAAA
          ttl: 300
          changetype: REPLACE
          records: >-
            {{
              groups['dns_servers']
              | map('extract', hostvars, 'public_ipv6')
              | select('defined')
              | map('community.general.dict_kv', 'content')
              | map('combine', {'disabled': false})
              | list
            }}
    status_code: [200, 204]
  ignore_errors: true
  tags: [gatus, dns]

- name: Increment SOA serial after DNS record changes
  when:
    - gatus_create_dns_records | default(true)
    - powerdns_api_key is defined
  run_once: true
  community.docker.docker_container_exec:
    container: powerdns-auth
    command: pdnsutil increase-serial {{ platform_domain }}
  changed_when: true
  ignore_errors: true
  tags: [gatus, dns]

# --- Update platform-alert.sh with Gatus endpoint info ---
# Re-deploy the shared alert library now that we know the Gatus token and port

- name: Update shared alert helper with Gatus endpoint info
  template:
    src: "{{ playbook_dir }}/roles/common/templates/platform-alert.sh.j2"
    dest: /usr/local/lib/platform-alert.sh
    mode: '0644'
  tags: [gatus]

# --- Restart PostgreSQL so it can deliver alerts to Gatus ---
# PostgreSQL's entrypoint uses GATUS_URL/GATUS_TOKEN env vars. On initial deploy
# (before Gatus existed), the Gatus container wasn't reachable. Recreating
# PostgreSQL now reconnects it to the Gatus network endpoint.

- name: Check if PostgreSQL container is running
  community.docker.docker_container_info:
    name: postgresql
  register: pg_container_info
  ignore_errors: true
  tags: [gatus]

- name: Recreate PostgreSQL to connect to Gatus for alert delivery
  community.docker.docker_compose_v2:
    project_src: /opt/postgresql
    state: present
    recreate: always
  when:
    - pg_container_info is success
    - pg_container_info.container.State.Running | default(false)
  tags: [gatus]

# --- Status display ---

- name: Display Gatus deployment status
  debug:
    msg:
      - "Gatus {{ gatus_version }} deployed on {{ inventory_hostname }}"
      - "Dashboard: https://{{ gatus_domain }}"
      - "Local API: http://127.0.0.1:{{ gatus_local_port }}"
      - ""
      - "External endpoint token is in ansible/.generated_secrets/gatus_external_token"
      - ""
      - "To configure notification targets, set gatus_alerting_* variables"
      - "in group_vars/all.yml and re-deploy:"
      - "  ansible-playbook -i inventory/hosts.yml deploy-gatus.yml"
  tags: [gatus]
