---
# Uptime Kuma — Optional UI-Based Monitoring
# Only deploys on the configured node when uptime_kuma_enabled is true.

- name: Skip Uptime Kuma (not enabled)
  debug:
    msg: "Uptime Kuma is disabled (set uptime_kuma_enabled: true to deploy)"
  when: not (uptime_kuma_enabled | bool)
  tags: [uptime-kuma]

- name: Skip Uptime Kuma (not target node)
  debug:
    msg: "Uptime Kuma runs on {{ uptime_kuma_node }} only (this is {{ inventory_hostname }})"
  when: uptime_kuma_enabled | bool and inventory_hostname != uptime_kuma_node
  tags: [uptime-kuma]

- block:
    - name: Create Uptime Kuma directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ uptime_kuma_install_dir }}"
        - "{{ uptime_kuma_install_dir }}/data"
      tags: [uptime-kuma]

    - name: Deploy docker-compose.yml
      template:
        src: docker-compose.yml.j2
        dest: "{{ uptime_kuma_install_dir }}/docker-compose.yml"
        mode: '0644'
      tags: [uptime-kuma]

    - name: Start Uptime Kuma
      community.docker.docker_compose_v2:
        project_src: "{{ uptime_kuma_install_dir }}"
        state: present
        pull: missing
      tags: [uptime-kuma]

    - name: Wait for Uptime Kuma container to be healthy
      community.docker.docker_container_info:
        name: uptime-kuma
      register: _uk_health
      retries: 12
      delay: 5
      until: (_uk_health.container.State.Health.Status | default('')) == 'healthy'
      tags: [uptime-kuma]

    # DNS record for Uptime Kuma (active-passive, primary IP only)
    - name: Create DNS A record for Uptime Kuma
      uri:
        url: "http://{{ powerdns_bind_interface | default('127.0.0.1') }}:{{ powerdns_nginx_api_port | default('8081') }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
        method: PATCH
        headers:
          X-API-Key: "{{ powerdns_api_key }}"
        body_format: json
        body:
          rrsets:
            - name: "{{ uptime_kuma_domain }}."
              type: A
              ttl: 30
              changetype: REPLACE
              records:
                - content: "{{ hostvars[dns_failover_primary | default('ns1')]['ansible_host'] }}"
                  disabled: false
        status_code: [200, 204]
      ignore_errors: true
      when:
        - uptime_kuma_create_dns_records | bool
        - powerdns_api_key is defined
      tags: [uptime-kuma]

    - name: Create DNS AAAA record for Uptime Kuma
      uri:
        url: "http://{{ powerdns_bind_interface | default('127.0.0.1') }}:{{ powerdns_nginx_api_port | default('8081') }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
        method: PATCH
        headers:
          X-API-Key: "{{ powerdns_api_key }}"
        body_format: json
        body:
          rrsets:
            - name: "{{ uptime_kuma_domain }}."
              type: AAAA
              ttl: 30
              changetype: REPLACE
              records:
                - content: "{{ hostvars[dns_failover_primary | default('ns1')]['public_ipv6'] }}"
                  disabled: false
        status_code: [200, 204]
      ignore_errors: true
      when:
        - uptime_kuma_create_dns_records | bool
        - powerdns_api_key is defined
        - hostvars[dns_failover_primary | default('ns1')]['public_ipv6'] is defined
      tags: [uptime-kuma]

    - name: Increment SOA serial after DNS record creation
      community.docker.docker_container_exec:
        container: powerdns-auth
        command: pdnsutil increase-serial {{ platform_domain }}
      changed_when: true
      ignore_errors: true
      when:
        - uptime_kuma_create_dns_records | bool
        - powerdns_api_key is defined
      tags: [uptime-kuma]

    - name: Display Uptime Kuma info
      debug:
        msg:
          - "Uptime Kuma deployed on {{ inventory_hostname }}"
          - "Dashboard: https://{{ uptime_kuma_domain }}"
          - ""
          - "First visit: create an admin account at the URL above."
          - "Data stored at: {{ uptime_kuma_install_dir }}/data/"
          - "Backed up automatically via /opt in restic."
      tags: [uptime-kuma]

  when: uptime_kuma_enabled | bool and inventory_hostname == uptime_kuma_node
