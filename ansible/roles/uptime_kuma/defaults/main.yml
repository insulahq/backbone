---
# Uptime Kuma — Optional UI-Based Monitoring
# Supplements Gatus (infrastructure HA monitoring) with a user-friendly
# web UI for adding custom monitors and notification targets.
#
# Set uptime_kuma_enabled: true in group_vars/all.yml to deploy.
# Runs on a single node (not HA) — Gatus handles infrastructure HA.

uptime_kuma_enabled: false

# Version
# v2 line. Runs SQLite (pinned in docker-compose.yml.j2, so v2's "choose a
# database" page never appears); the role and test-suite read the admin
# count from that file. The data lives only on uptime_kuma_node: after a
# rebuild, restore it from backup (docs/RECOVERY.md Scenario 3, pitfall 5).
uptime_kuma_version: "2"
uptime_kuma_image: "louislam/uptime-kuma:{{ uptime_kuma_version }}"

# Installation
uptime_kuma_install_dir: /opt/uptime-kuma
uptime_kuma_node: "{{ groups['dns_servers'] | first }}"  # Deploy on primary node only

# Domain (behind Traefik)
uptime_kuma_domain: "monitor.{{ platform_domain }}"

# DNS record management
uptime_kuma_create_dns_records: true
