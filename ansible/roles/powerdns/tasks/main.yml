---
# PowerDNS Role — Main Tasks
# Deploys PowerDNS on both ns1 and ns2 with shared PostgreSQL HA backend.
# Both nodes run as Native (read-write) — zone data replicates via
# PostgreSQL streaming replication, NOT AXFR.

- name: Check if WireGuard IP is available
  set_fact:
    has_wireguard_ip: "{{ wireguard_ip is defined and wireguard_ip | length > 0 }}"

- name: Display binding interface
  debug:
    msg: "PowerDNS on {{ inventory_hostname }} will bind API to: {{ powerdns_bind_interface }} ({{ 'WireGuard tunnel' if has_wireguard_ip else 'localhost - will reconfigure after WireGuard deployment' }})"

- name: Create PowerDNS installation directory
  file:
    path: "{{ powerdns_install_dir }}"
    state: directory
    mode: '0755'

- name: Ensure powerdns_internal Docker network exists
  community.docker.docker_network:
    name: powerdns_internal
    driver: bridge
    state: present

- name: Ensure secrets directory exists on controller
  file:
    path: "{{ playbook_dir }}/.generated_secrets"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  run_once: true

- name: Generate PowerDNS API key if not set
  set_fact:
    powerdns_api_key: "{{ lookup('password', playbook_dir + '/.generated_secrets/powerdns_api_key length=64 chars=ascii_letters,digits') }}"
  when: powerdns_api_key is not defined or powerdns_api_key | length == 0
  no_log: true

- name: Persist PowerDNS API key to secrets file
  copy:
    content: "{{ powerdns_api_key }}"
    dest: "{{ playbook_dir }}/.generated_secrets/powerdns_api_key"
    mode: '0600'
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  changed_when: false

- name: Generate PowerDNS DB password if not set
  set_fact:
    powerdns_db_password: "{{ lookup('password', playbook_dir + '/.generated_secrets/powerdns_db_password length=32 chars=ascii_letters,digits') }}"
  when: powerdns_db_password is not defined or powerdns_db_password | length == 0
  no_log: true

- name: Generate PowerDNS-Admin database password if not set
  set_fact:
    powerdns_admin_sqla_db_password: "{{ lookup('password', playbook_dir + '/.generated_secrets/powerdns_admin_sqla_db_password length=32 chars=ascii_letters,digits') }}"
  when: powerdns_admin_sqla_db_password is not defined or powerdns_admin_sqla_db_password | length == 0
  no_log: true

- name: Generate PowerDNS-Admin secret key if not set
  set_fact:
    powerdns_admin_secret_key: "{{ lookup('password', playbook_dir + '/.generated_secrets/powerdns_admin_secret_key length=64 chars=ascii_letters,digits') }}"
  when: powerdns_admin_secret_key is not defined or powerdns_admin_secret_key | length == 0
  no_log: true

# --- Database setup (on PostgreSQL HA primary only) ---
# PowerDNS and PowerDNS-Admin databases live in the HA cluster.
# Schema is created on the primary and replicated to standby automatically.
# Check the ACTUAL PG role at runtime — after failover, the configured
# postgresql_primary_node may be the standby.

- name: Check if local PostgreSQL is the actual primary
  community.docker.docker_container_exec:
    container: postgresql
    command: psql -U postgres -tAc "SELECT NOT pg_is_in_recovery();"
  register: _pg_is_primary
  changed_when: false
  ignore_errors: true

- name: Create PowerDNS database user and database
  when: (_pg_is_primary.stdout | default('') | trim) == 't'
  block:
    - name: Create PowerDNS database user if not exists
      community.docker.docker_container_exec:
        container: postgresql
        command: >
          bash -c "psql -U postgres -tc \"SELECT 1 FROM pg_roles WHERE rolname='{{ powerdns_db_user }}'\" | grep -q 1 ||
                   psql -U postgres -c \"CREATE USER {{ powerdns_db_user }} WITH PASSWORD '{{ powerdns_db_password }}'\""
      changed_when: false
      no_log: true

    - name: Create PowerDNS database if not exists
      community.docker.docker_container_exec:
        container: postgresql
        command: >
          bash -c "psql -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname='{{ powerdns_db_name }}'\" | grep -q 1 ||
                   createdb -U postgres -O {{ powerdns_db_user }} {{ powerdns_db_name }}"
      changed_when: false

    - name: Check if PowerDNS schema exists
      community.docker.docker_container_exec:
        container: postgresql
        command: bash -c "psql -U postgres -d {{ powerdns_db_name }} -tAc \"SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='domains' LIMIT 1\""
      register: schema_check
      changed_when: false

    - name: Initialize PowerDNS schema
      community.docker.docker_container_exec:
        container: postgresql
        command: bash -c "psql -U postgres -d {{ powerdns_db_name }} < /dev/stdin"
        stdin: "{{ lookup('template', 'init-schema.sql.j2') }}"
      when: (schema_check.stdout | default('') | trim) != "1"

    # Grants must run unconditionally — the schema init is skipped when tables
    # already exist (idempotent CREATE TABLE IF NOT EXISTS), but the GRANT
    # statements at the end of init-schema.sql only execute on first creation.
    # This task ensures pdns always has the required permissions.
    - name: Ensure PowerDNS database user has table permissions
      community.docker.docker_container_exec:
        container: postgresql
        command: >
          bash -c "psql -U postgres -d {{ powerdns_db_name }} -c
          'GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO {{ powerdns_db_user }};
           GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO {{ powerdns_db_user }};'"
      changed_when: false

- name: Create PowerDNS-Admin database and user
  when: (_pg_is_primary.stdout | default('') | trim) == 't'
  block:
    - name: Create PowerDNS-Admin database user if not exists
      community.docker.docker_container_exec:
        container: postgresql
        command: >
          bash -c "psql -U postgres -tc \"SELECT 1 FROM pg_roles WHERE rolname='{{ powerdns_admin_sqla_db_user }}'\" | grep -q 1 ||
                   psql -U postgres -c \"CREATE USER {{ powerdns_admin_sqla_db_user }} WITH PASSWORD '{{ powerdns_admin_sqla_db_password }}'\""
      changed_when: false
      no_log: true

    - name: Create PowerDNS-Admin database if not exists
      community.docker.docker_container_exec:
        container: postgresql
        command: >
          bash -c "psql -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname='{{ powerdns_admin_sqla_db_name }}'\" | grep -q 1 ||
                   createdb -U postgres -O {{ powerdns_admin_sqla_db_user }} {{ powerdns_admin_sqla_db_name }}"
      changed_when: false

# --- Deploy PowerDNS stack ---

- name: Deploy PowerDNS configuration
  template:
    src: pdns.conf.j2
    dest: "{{ powerdns_install_dir }}/pdns.conf"
    mode: '0640'
    owner: root
    # GID 953 matches the pdns user inside the powerdns-auth container.
    # This numeric GID is intentional — the group does not exist on the host OS,
    # but the bind-mounted file must be readable by the container's pdns process.
    group: '953'
  notify: restart powerdns

- name: Deploy nginx proxy configuration
  template:
    src: nginx.conf.j2
    dest: "{{ powerdns_install_dir }}/nginx.conf"
    mode: '0644'
  notify: restart powerdns

- name: Deploy docker-compose.yml for PowerDNS
  template:
    src: docker-compose.yml.j2
    dest: "{{ powerdns_install_dir }}/docker-compose.yml"
    mode: '0644'
  notify: restart powerdns

- name: Start PowerDNS services
  community.docker.docker_compose_v2:
    project_src: "{{ powerdns_install_dir }}"
    state: present

- name: Wait for PowerDNS to be ready
  uri:
    url: "http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_api_port }}/api/v1/servers/localhost"
    method: GET
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
    status_code: 200
  retries: 30
  delay: 2
  register: pdns_ready
  until: pdns_ready.status == 200

# --- Platform zone creation (on PG primary only — writes need read-write DB) ---

- name: Create platform zone ({{ platform_domain }})
  uri:
    url: "http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_api_port }}/api/v1/servers/localhost/zones"
    method: POST
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "{{ platform_domain }}."
      kind: "Native"
      nameservers:
        - "ns1.{{ platform_domain }}."
        - "ns2.{{ platform_domain }}."
      soa_edit_api: "INCEPTION-INCREMENT"
    status_code: [201, 409]  # 409 = already exists
  register: zone_create_result
  when: (_pg_is_primary.stdout | default('') | trim) == 't'
  ignore_errors: true

- name: Increment SOA serial after zone creation (gotcha 33)
  community.docker.docker_container_exec:
    container: powerdns-auth
    command: pdnsutil increase-serial {{ platform_domain }}
  when:
    - (_pg_is_primary.stdout | default('') | trim) == 't'
    - zone_create_result.status | default(0) == 201
  changed_when: true

# --- Platform base domain DNS records ---
# Active-passive failover: dns_failover_primary (default ns1) is preferred.
# Uses ifportup(443) with priority groups — checks if Traefik port is open.
# When dns_health_check_enabled is false, falls back to static active-passive (primary IP only).

- name: Compute DNS failover address order for base domain
  set_fact:
    _dns_primary: "{{ dns_failover_primary | default('ns1') }}"
    _dns_secondary: "{{ groups['dns_servers'] | difference([dns_failover_primary | default('ns1')]) | first }}"
  when:
    - (_pg_is_primary.stdout | default('') | trim) == 't'
    - powerdns_api_key is defined
    - dns_health_check_enabled | default(false) | bool
  tags: [powerdns, dns]

- name: Build LUA health-check DNS records for base domain
  set_fact:
    _base_domain_lua_records: >-
      {{ [{'content': 'A "ifportup(443,
      { {\'' + hostvars[_dns_primary]['ansible_host'] + '\'}, {\'' + hostvars[_dns_secondary]['ansible_host'] + '\'} })"', 'disabled': false}] +
         ([] if (groups['dns_servers'] | map('extract', hostvars, 'public_ipv6') | select('defined') | list | length == 0) else
          [{'content': 'AAAA "ifportup(443,
      { {\'' + hostvars[_dns_primary]['public_ipv6'] + '\'}, {\'' + hostvars[_dns_secondary]['public_ipv6'] + '\'} })"', 'disabled': false}])
      }}
  when:
    - (_pg_is_primary.stdout | default('') | trim) == 't'
    - powerdns_api_key is defined
    - dns_health_check_enabled | default(false) | bool
  tags: [powerdns, dns]

- name: Create base domain DNS records (health-checked LUA)
  when:
    - (_pg_is_primary.stdout | default('') | trim) == 't'
    - powerdns_api_key is defined
    - dns_health_check_enabled | default(false) | bool
  uri:
    url: "http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_api_port }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      rrsets:
        - name: "{{ platform_domain }}."
          type: A
          changetype: DELETE
        - name: "{{ platform_domain }}."
          type: AAAA
          changetype: DELETE
        - name: "{{ platform_domain }}."
          type: LUA
          ttl: "{{ dns_health_check_ttl | default(30) }}"
          changetype: REPLACE
          records: "{{ _base_domain_lua_records }}"
    status_code: [200, 204]
  ignore_errors: true
  tags: [powerdns, dns]

- name: Create base domain A record (active-passive — primary only)
  when:
    - (_pg_is_primary.stdout | default('') | trim) == 't'
    - powerdns_api_key is defined
    - not (dns_health_check_enabled | default(false) | bool)
  uri:
    url: "http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_api_port }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      rrsets:
        - name: "{{ platform_domain }}."
          type: LUA
          changetype: DELETE
        - name: "{{ platform_domain }}."
          type: A
          ttl: 30
          changetype: REPLACE
          records:
            - content: "{{ hostvars[dns_failover_primary | default('ns1')]['ansible_host'] }}"
              disabled: false
    status_code: [200, 204]
  ignore_errors: true
  tags: [powerdns, dns]

- name: Create base domain AAAA record (active-passive — primary only)
  when:
    - (_pg_is_primary.stdout | default('') | trim) == 't'
    - powerdns_api_key is defined
    - not (dns_health_check_enabled | default(false) | bool)
    - hostvars[dns_failover_primary | default('ns1')]['public_ipv6'] is defined
  uri:
    url: "http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_api_port }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      rrsets:
        - name: "{{ platform_domain }}."
          type: AAAA
          ttl: 30
          changetype: REPLACE
          records:
            - content: "{{ hostvars[dns_failover_primary | default('ns1')]['public_ipv6'] }}"
              disabled: false
    status_code: [200, 204]
  ignore_errors: true
  tags: [powerdns, dns]

- name: Create NS glue records (ns1/ns2 A records)
  uri:
    url: "http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_api_port }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      rrsets:
        - name: "ns1.{{ platform_domain }}."
          type: A
          ttl: 3600
          changetype: REPLACE
          records:
            - content: "{{ hostvars['ns1']['ansible_host'] }}"
              disabled: false
        - name: "ns2.{{ platform_domain }}."
          type: A
          ttl: 3600
          changetype: REPLACE
          records:
            - content: "{{ hostvars['ns2']['ansible_host'] }}"
              disabled: false
    status_code: [200, 204]
  when:
    - (_pg_is_primary.stdout | default('') | trim) == 't'
    - powerdns_api_key is defined
  ignore_errors: true
  tags: [powerdns, dns]

- name: Create NS glue AAAA records (ns1/ns2 IPv6)
  uri:
    url: "http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_api_port }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      rrsets:
        - name: "ns1.{{ platform_domain }}."
          type: AAAA
          ttl: 3600
          changetype: REPLACE
          records:
            - content: "{{ hostvars['ns1']['public_ipv6'] }}"
              disabled: false
        - name: "ns2.{{ platform_domain }}."
          type: AAAA
          ttl: 3600
          changetype: REPLACE
          records:
            - content: "{{ hostvars['ns2']['public_ipv6'] }}"
              disabled: false
    status_code: [200, 204]
  when:
    - (_pg_is_primary.stdout | default('') | trim) == 't'
    - powerdns_api_key is defined
    - hostvars['ns1']['public_ipv6'] is defined
    - hostvars['ns2']['public_ipv6'] is defined
  ignore_errors: true
  tags: [powerdns, dns]

- name: Increment SOA serial after base domain record changes
  community.docker.docker_container_exec:
    container: powerdns-auth
    command: pdnsutil increase-serial {{ platform_domain }}
  changed_when: true
  when:
    - (_pg_is_primary.stdout | default('') | trim) == 't'
    - powerdns_api_key is defined
  ignore_errors: true
  tags: [powerdns, dns]

# --- Status display ---

- name: Display PowerDNS deployment status
  debug:
    msg:
      - "PowerDNS deployed on {{ inventory_hostname }}"
      - "Mode: Native (read-write, shared PostgreSQL HA backend)"
      - "DNS Server: {{ ansible_default_ipv4.address }}:53 (IPv4+IPv6 dual-stack)"
      - "PowerDNS API: http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_api_port }} (NetBird only)"
      - "PowerDNS-Admin UI: http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_admin_port }} (WireGuard + NetBird only)"
      - "{{ 'PowerDNS-Admin UI: running' if powerdns_admin_enabled | bool else '' }}"
      - "Platform zone: {{ platform_domain }}"
