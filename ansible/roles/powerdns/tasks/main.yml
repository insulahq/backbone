---
# PowerDNS Role — Main Tasks
# Deploys PowerDNS on both ns1 and ns2 with shared PostgreSQL HA backend.
# Both nodes run as Native (read-write) — zone data replicates via
# PostgreSQL streaming replication, NOT AXFR.

- name: Check if WireGuard IP is available
  set_fact:
    has_wireguard_ip: "{{ wireguard_ip is defined and wireguard_ip | length > 0 }}"

- name: Display binding interface
  debug:
    msg: "PowerDNS on {{ inventory_hostname }} will bind API to: {{ powerdns_bind_interface }} ({{ 'WireGuard tunnel' if has_wireguard_ip else 'localhost - will reconfigure after WireGuard deployment' }})"

- name: Create PowerDNS installation directory
  file:
    path: "{{ powerdns_install_dir }}"
    state: directory
    mode: '0755'

- name: Ensure secrets directory exists on controller
  file:
    path: "{{ playbook_dir }}/.generated_secrets"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  run_once: true

- name: Generate PowerDNS API key if not set
  set_fact:
    powerdns_api_key: "{{ lookup('password', playbook_dir + '/.generated_secrets/powerdns_api_key length=64 chars=ascii_letters,digits') }}"
  when: powerdns_api_key is not defined or powerdns_api_key | length == 0
  no_log: true

- name: Generate PowerDNS DB password if not set
  set_fact:
    powerdns_db_password: "{{ lookup('password', playbook_dir + '/.generated_secrets/powerdns_db_password length=32 chars=ascii_letters,digits') }}"
  when: powerdns_db_password is not defined or powerdns_db_password | length == 0
  no_log: true

- name: Generate PowerDNS-Admin database password if not set
  set_fact:
    powerdns_admin_sqla_db_password: "{{ lookup('password', playbook_dir + '/.generated_secrets/powerdns_admin_sqla_db_password length=32 chars=ascii_letters,digits') }}"
  when: powerdns_admin_sqla_db_password is not defined or powerdns_admin_sqla_db_password | length == 0
  no_log: true

- name: Generate PowerDNS-Admin secret key if not set
  set_fact:
    powerdns_admin_secret_key: "{{ lookup('password', playbook_dir + '/.generated_secrets/powerdns_admin_secret_key length=64 chars=ascii_letters,digits') }}"
  when: powerdns_admin_secret_key is not defined or powerdns_admin_secret_key | length == 0
  no_log: true

# --- Database setup (on PostgreSQL HA primary only) ---
# PowerDNS and PowerDNS-Admin databases live in the HA cluster.
# Schema is created on the primary and replicated to standby automatically.

- name: Create PowerDNS database user and database
  when: inventory_hostname == postgresql_primary_node
  block:
    - name: Create PowerDNS database user if not exists
      community.docker.docker_container_exec:
        container: postgresql
        command: >
          bash -c "psql -U postgres -tc \"SELECT 1 FROM pg_roles WHERE rolname='{{ powerdns_db_user }}'\" | grep -q 1 ||
                   psql -U postgres -c \"CREATE USER {{ powerdns_db_user }} WITH PASSWORD '{{ powerdns_db_password }}'\""
      changed_when: false
      no_log: true

    - name: Create PowerDNS database if not exists
      community.docker.docker_container_exec:
        container: postgresql
        command: >
          bash -c "psql -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname='{{ powerdns_db_name }}'\" | grep -q 1 ||
                   createdb -U postgres -O {{ powerdns_db_user }} {{ powerdns_db_name }}"
      changed_when: false

    - name: Check if PowerDNS schema exists
      community.docker.docker_container_exec:
        container: postgresql
        command: >
          psql -U postgres -d {{ powerdns_db_name }} -tc
          "SELECT 1 FROM information_schema.tables WHERE table_name='domains'"
      register: schema_check
      changed_when: false

    - name: Deploy schema init script to host
      template:
        src: init-schema.sql.j2
        dest: "{{ powerdns_install_dir }}/init-schema.sql"
        mode: '0600'
      when: schema_check.stdout | trim == ""

    - name: Copy schema init script into PostgreSQL container
      shell: docker cp {{ powerdns_install_dir }}/init-schema.sql postgresql:/tmp/init-schema.sql
      when: schema_check.stdout | trim == ""

    - name: Initialize PowerDNS schema
      community.docker.docker_container_exec:
        container: postgresql
        command: psql -U postgres -d {{ powerdns_db_name }} -f /tmp/init-schema.sql
      when: schema_check.stdout | trim == ""

- name: Create PowerDNS-Admin database and user
  when: inventory_hostname == postgresql_primary_node
  block:
    - name: Create PowerDNS-Admin database user if not exists
      community.docker.docker_container_exec:
        container: postgresql
        command: >
          bash -c "psql -U postgres -tc \"SELECT 1 FROM pg_roles WHERE rolname='{{ powerdns_admin_sqla_db_user }}'\" | grep -q 1 ||
                   psql -U postgres -c \"CREATE USER {{ powerdns_admin_sqla_db_user }} WITH PASSWORD '{{ powerdns_admin_sqla_db_password }}'\""
      changed_when: false
      no_log: true

    - name: Create PowerDNS-Admin database if not exists
      community.docker.docker_container_exec:
        container: postgresql
        command: >
          bash -c "psql -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname='{{ powerdns_admin_sqla_db_name }}'\" | grep -q 1 ||
                   createdb -U postgres -O {{ powerdns_admin_sqla_db_user }} {{ powerdns_admin_sqla_db_name }}"
      changed_when: false

# --- OIDC application creation in Zitadel (automated, requires PAT) ---
# Creates an OIDC application for PowerDNS-Admin in Zitadel if:
#   1. powerdns_admin_enabled is true (PDA runs on this node)
#   2. zitadel_service_pat is set (admin created a service account PAT)
#   3. powerdns_admin_oidc_client_id is NOT already set (app not yet created)
# The client_id and client_secret are persisted to .generated_secrets/

- name: Load persisted PowerDNS-Admin OIDC client_id if available
  set_fact:
    powerdns_admin_oidc_client_id: "{{ lookup('file', playbook_dir + '/.generated_secrets/powerdns_admin_oidc_client_id', errors='ignore') | default('', true) }}"
  when: powerdns_admin_oidc_client_id is not defined or powerdns_admin_oidc_client_id | length == 0
  tags: [powerdns, dns]

- name: Load persisted PowerDNS-Admin OIDC client_secret if available
  set_fact:
    powerdns_admin_oidc_client_secret: "{{ lookup('file', playbook_dir + '/.generated_secrets/powerdns_admin_oidc_client_secret', errors='ignore') | default('', true) }}"
  when: powerdns_admin_oidc_client_secret is not defined or powerdns_admin_oidc_client_secret | length == 0
  no_log: true
  tags: [powerdns, dns]

- name: Search for Hosting Platform project in Zitadel
  uri:
    url: "https://{{ zitadel_domain }}/management/v1/projects/_search"
    method: POST
    headers:
      Authorization: "Bearer {{ zitadel_service_pat }}"
      Content-Type: application/json
    body_format: json
    body:
      queries:
        - nameQuery:
            name: "Hosting Platform"
            method: TEXT_QUERY_METHOD_EQUALS
    status_code: 200
    validate_certs: "{{ powerdns_admin_validate_certs | default(false) }}"
  register: pdnsadmin_project_search
  run_once: true
  when:
    - powerdns_admin_enabled | bool
    - zitadel_service_pat | default('') | length > 0
    - powerdns_admin_oidc_client_id | default('') | length == 0
  tags: [powerdns, dns]

- name: Create Hosting Platform project if not exists
  uri:
    url: "https://{{ zitadel_domain }}/management/v1/projects"
    method: POST
    headers:
      Authorization: "Bearer {{ zitadel_service_pat }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "Hosting Platform"
    status_code: [200]
    validate_certs: "{{ powerdns_admin_validate_certs | default(false) }}"
  register: pdnsadmin_project_created
  run_once: true
  when:
    - powerdns_admin_enabled | bool
    - zitadel_service_pat | default('') | length > 0
    - powerdns_admin_oidc_client_id | default('') | length == 0
    - pdnsadmin_project_search.json.result | default([]) | length == 0
  tags: [powerdns, dns]

- name: Set Zitadel project ID for PowerDNS-Admin
  set_fact:
    pdnsadmin_zitadel_project_id: >-
      {{ (pdnsadmin_project_search.json.result[0].id)
         if (pdnsadmin_project_search.json.result | default([]) | length > 0)
         else (pdnsadmin_project_created.json.id | default('')) }}
  run_once: true
  when:
    - powerdns_admin_enabled | bool
    - zitadel_service_pat | default('') | length > 0
    - powerdns_admin_oidc_client_id | default('') | length == 0
  tags: [powerdns, dns]

- name: Create PowerDNS-Admin OIDC application in Zitadel
  uri:
    url: "https://{{ zitadel_domain }}/management/v1/projects/{{ pdnsadmin_zitadel_project_id }}/apps/oidc"
    method: POST
    headers:
      Authorization: "Bearer {{ zitadel_service_pat }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "PowerDNS Admin"
      redirectUris: >-
        {{
          groups['dns_servers']
          | map('extract', hostvars, 'wireguard_ip')
          | select('defined')
          | map('regex_replace', '(.*)', 'http://\1:' + (powerdns_nginx_admin_port | string) + '/oidc/authorized')
          | list
        }}
      postLogoutRedirectUris: >-
        {{
          groups['dns_servers']
          | map('extract', hostvars, 'wireguard_ip')
          | select('defined')
          | map('regex_replace', '(.*)', 'http://\1:' + (powerdns_nginx_admin_port | string))
          | list
        }}
      responseTypes:
        - "OIDC_RESPONSE_TYPE_CODE"
      grantTypes:
        - "OIDC_GRANT_TYPE_AUTHORIZATION_CODE"
      appType: "OIDC_APP_TYPE_WEB"
      authMethodType: "OIDC_AUTH_METHOD_TYPE_BASIC"
      devMode: true
    status_code: [200]
    validate_certs: "{{ powerdns_admin_validate_certs | default(false) }}"
  register: pdnsadmin_oidc_app
  run_once: true
  when:
    - powerdns_admin_enabled | bool
    - zitadel_service_pat | default('') | length > 0
    - powerdns_admin_oidc_client_id | default('') | length == 0
    - pdnsadmin_zitadel_project_id | default('') | length > 0
  tags: [powerdns, dns]

- name: Persist PowerDNS-Admin OIDC client_id
  copy:
    content: "{{ pdnsadmin_oidc_app.json.clientId }}"
    dest: "{{ playbook_dir }}/.generated_secrets/powerdns_admin_oidc_client_id"
    mode: '0600'
  delegate_to: localhost
  become: false
  run_once: true
  when: pdnsadmin_oidc_app is changed
  tags: [powerdns, dns]

- name: Persist PowerDNS-Admin OIDC client_secret
  copy:
    content: "{{ pdnsadmin_oidc_app.json.clientSecret }}"
    dest: "{{ playbook_dir }}/.generated_secrets/powerdns_admin_oidc_client_secret"
    mode: '0600'
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  when: pdnsadmin_oidc_app is changed
  tags: [powerdns, dns]

- name: Set PowerDNS-Admin OIDC client credentials from Zitadel API response
  set_fact:
    powerdns_admin_oidc_client_id: "{{ pdnsadmin_oidc_app.json.clientId }}"
    powerdns_admin_oidc_client_secret: "{{ pdnsadmin_oidc_app.json.clientSecret }}"
  run_once: true
  no_log: true
  when: pdnsadmin_oidc_app is changed
  tags: [powerdns, dns]

# --- Deploy PowerDNS stack ---

- name: Deploy PowerDNS configuration
  template:
    src: pdns.conf.j2
    dest: "{{ powerdns_install_dir }}/pdns.conf"
    mode: '0640'
    owner: root
    group: '953'  # pdns user UID inside the container
  notify: restart powerdns

- name: Deploy nginx proxy configuration
  template:
    src: nginx.conf.j2
    dest: "{{ powerdns_install_dir }}/nginx.conf"
    mode: '0644'
  notify: restart powerdns

- name: Deploy docker-compose.yml for PowerDNS
  template:
    src: docker-compose.yml.j2
    dest: "{{ powerdns_install_dir }}/docker-compose.yml"
    mode: '0644'
  notify: restart powerdns

- name: Start PowerDNS services
  community.docker.docker_compose_v2:
    project_src: "{{ powerdns_install_dir }}"
    state: present

- name: Wait for PowerDNS to be ready
  uri:
    url: "http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_api_port }}/api/v1/servers/localhost"
    method: GET
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
    status_code: 200
  retries: 30
  delay: 2
  register: pdns_ready
  until: pdns_ready.status == 200

# --- Platform zone creation (run once on any node) ---

- name: Create platform zone ({{ platform_domain }})
  uri:
    url: "http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_api_port }}/api/v1/servers/localhost/zones"
    method: POST
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "{{ platform_domain }}."
      kind: "Native"
      nameservers:
        - "ns1.{{ platform_domain }}."
        - "ns2.{{ platform_domain }}."
      soa_edit_api: "INCEPTION-INCREMENT"
    status_code: [201, 409]  # 409 = already exists
  register: zone_create_result
  run_once: true
  ignore_errors: yes

- name: Increment SOA serial after zone creation (gotcha 33)
  community.docker.docker_container_exec:
    container: powerdns-auth
    command: pdnsutil increase-serial {{ platform_domain }}
  when: zone_create_result.status == 201
  run_once: true
  changed_when: true

# --- Platform base domain DNS records ---
# Creates static A/AAAA records for the base domain (e.g., example.com) pointing
# to both servers. No LUA health-checks — the base domain doesn't front a specific
# service that fails independently per-node. Services that need failover
# (Zitadel, NetBird, Gatus) have their own LUA records.

- name: Create base domain A records (static round-robin)
  when:
    - powerdns_api_key is defined
  run_once: true
  uri:
    url: "http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_api_port }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      rrsets:
        - name: "{{ platform_domain }}."
          type: A
          ttl: 300
          changetype: REPLACE
          records: >-
            {{
              groups['dns_servers']
              | map('extract', hostvars, 'ansible_host')
              | map('community.general.dict_kv', 'content')
              | map('combine', {'disabled': false})
              | list
            }}
    status_code: [200, 204]
  ignore_errors: true
  tags: [powerdns, dns]

- name: Create base domain AAAA records (static round-robin)
  when:
    - powerdns_api_key is defined
    - groups['dns_servers'] | map('extract', hostvars, 'public_ipv6') | select('defined') | list | length > 0
  run_once: true
  uri:
    url: "http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_api_port }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      rrsets:
        - name: "{{ platform_domain }}."
          type: AAAA
          ttl: 300
          changetype: REPLACE
          records: >-
            {{
              groups['dns_servers']
              | map('extract', hostvars, 'public_ipv6')
              | select('defined')
              | map('community.general.dict_kv', 'content')
              | map('combine', {'disabled': false})
              | list
            }}
    status_code: [200, 204]
  ignore_errors: true
  tags: [powerdns, dns]

- name: Create NS glue records (ns1/ns2 A records)
  uri:
    url: "http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_api_port }}/api/v1/servers/localhost/zones/{{ platform_domain }}."
    method: PATCH
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
      Content-Type: application/json
    body_format: json
    body:
      rrsets:
        - name: "ns1.{{ platform_domain }}."
          type: A
          ttl: 3600
          changetype: REPLACE
          records:
            - content: "{{ hostvars['ns1']['ansible_host'] }}"
              disabled: false
        - name: "ns2.{{ platform_domain }}."
          type: A
          ttl: 3600
          changetype: REPLACE
          records:
            - content: "{{ hostvars['ns2']['ansible_host'] }}"
              disabled: false
    status_code: [200, 204]
  run_once: true
  when: powerdns_api_key is defined
  ignore_errors: true
  tags: [powerdns, dns]

- name: Increment SOA serial after base domain record changes
  community.docker.docker_container_exec:
    container: powerdns-auth
    command: pdnsutil increase-serial {{ platform_domain }}
  run_once: true
  changed_when: true
  when: powerdns_api_key is defined
  ignore_errors: true
  tags: [powerdns, dns]

# --- Status display ---

- name: Display PowerDNS deployment status
  debug:
    msg:
      - "PowerDNS deployed on {{ inventory_hostname }}"
      - "Mode: Native (read-write, shared PostgreSQL HA backend)"
      - "DNS Server: {{ ansible_default_ipv4.address }}:53 (IPv4+IPv6 dual-stack)"
      - "PowerDNS API: http://{{ powerdns_bind_interface }}:{{ powerdns_nginx_api_port }} (NetBird only)"
      - "{{ 'PowerDNS-Admin UI: http://' + powerdns_bind_interface + ':' + powerdns_nginx_admin_port | string + ' (NetBird only)' if powerdns_admin_enabled else 'PowerDNS-Admin: disabled on this node (runs on ' + powerdns_admin_node + ')' }}"
      - "{{ 'PowerDNS-Admin OIDC: enabled (Zitadel)' if (powerdns_admin_enabled | bool and powerdns_admin_oidc_client_id) else ('PowerDNS-Admin OIDC: disabled — set zitadel_service_pat to enable' if powerdns_admin_enabled | bool else '') }}"
      - "Platform zone: {{ platform_domain }}"
