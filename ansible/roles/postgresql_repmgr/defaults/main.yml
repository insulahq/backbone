---
# PostgreSQL + repmgr Role — Default Variables
# Deploys PostgreSQL with repmgr for primary/standby HA.
# Uses sourcemation/postgres-repmgr image which bundles PostgreSQL + repmgr 5.5
# and handles automatic primary detection and streaming replication setup.
#
# Primary:  ns1 (100.83.100.184) — node 1, REPMGR_ROLE=primary
# Standby:  ns2 (100.83.42.33)  — node 2, REPMGR_ROLE=standby, clones from ns1
# Failover: repmgrd on ns2 auto-promotes if ns1 is unreachable
# Rejoin:   repmgr node rejoin + pg_rewind when ns1 comes back online

# Image — sourcemation/postgres-repmgr (only available with latest/PG18)
postgresql_image: "sourcemation/postgres-repmgr:latest"

# Installation directory
postgresql_install_dir: /opt/postgresql

# Network — binds on 0.0.0.0:5432, traffic reaches us only via NetBird mesh
postgresql_port: 5432

# Cluster identification
postgresql_repmgr_cluster: "phoenix-host"

# Primary server NetBird IP — ns1 is always the preferred primary
postgresql_primary_netbird_ip: "100.83.100.184"  # ns1

# Node network names (NetBird mesh IPs) — used by repmgr for inter-node communication
postgresql_ns1_netbird_ip: "100.83.100.184"
postgresql_ns2_netbird_ip: "100.83.42.33"

# repmgr cluster credentials — set in group_vars/all.yml
# postgresql_superuser_password: ""    # postgres superuser (POSTGRES_PASSWORD)
# postgresql_repmgr_password: ""       # repmgr replication user
# postgresql_netbird_password: ""      # netbird app user

# Application databases to create on primary after initial setup
postgresql_databases:
  - name: netbird
    user: netbird
    password: "{{ postgresql_netbird_password }}"

# Data directory inside container (standard postgres path)
postgresql_data_dir: /var/lib/postgresql/data
