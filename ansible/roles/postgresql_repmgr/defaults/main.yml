---
# PostgreSQL + repmgr Role -- Default Variables
# Deploys PostgreSQL 18 with repmgr 5.5 for primary/standby streaming replication.
# Uses sourcemation/postgres-repmgr image (only available as latest, bundles PG18).
#
# Primary node is configurable via postgresql_primary_node.
# The other node is automatically configured as standby.
# repmgrd handles auto-failover with 60s debounce (6 attempts x 10s interval).

# Image
postgresql_image: "sourcemation/postgres-repmgr:latest"

# Installation directory
postgresql_install_dir: /opt/postgresql

# Network
postgresql_port: 5432

# Cluster identification
postgresql_repmgr_cluster: "phoenix-host"

# Primary server -- determines which node runs as primary vs standby
# Detection uses inventory_hostname (avoids breakage when NetBird IPs change)
postgresql_primary_node: "ns2"

# Credentials -- set in group_vars/all.yml
# postgresql_superuser_password: ""
# postgresql_repmgr_password: ""
# postgresql_netbird_password: ""

# Application databases to create on primary
postgresql_databases:
  - name: netbird
    user: netbird
    password: "{{ postgresql_netbird_password }}"

# Data directory inside container
postgresql_data_dir: /var/lib/postgresql/data
