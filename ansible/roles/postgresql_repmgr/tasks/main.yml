---
# PostgreSQL + repmgr Role — Main Tasks

# Persist PostgreSQL passwords to .generated_secrets/ for consistency.
# These are set in group_vars/all.yml (via setup.sh) but should also
# exist as individual files alongside all other auto-generated secrets.
- name: Ensure secrets directory exists on controller
  file:
    path: "{{ playbook_dir }}/.generated_secrets"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  run_once: true

- name: Persist PostgreSQL passwords to secrets files
  copy:
    content: "{{ item.value }}"
    dest: "{{ playbook_dir }}/.generated_secrets/{{ item.name }}"
    mode: '0600'
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  changed_when: false
  loop:
    - { name: postgresql_superuser_password, value: "{{ postgresql_superuser_password }}" }
    - { name: postgresql_repmgr_password, value: "{{ postgresql_repmgr_password }}" }
    - { name: postgresql_netbird_password, value: "{{ postgresql_netbird_password }}" }
    - { name: postgresql_netbird_dex_password, value: "{{ postgresql_netbird_dex_password }}" }

- name: Create PostgreSQL installation directory
  file:
    path: "{{ postgresql_install_dir }}"
    state: directory
    mode: '0755'

- name: Determine if this node is the primary or standby
  set_fact:
    postgresql_is_primary: "{{ inventory_hostname == postgresql_primary_node }}"
    postgresql_node_id: "{{ postgresql_node_ids[inventory_hostname] | default(groups['all'].index(inventory_hostname) + 1) }}"

- name: Show PostgreSQL node role
  debug:
    msg: "PostgreSQL role on {{ inventory_hostname }}: {{ 'PRIMARY' if postgresql_is_primary else 'STANDBY' }} (node {{ postgresql_node_id }})"

- name: Deploy entrypoint wrapper script
  template:
    src: entrypoint-wrapper.sh.j2
    dest: "{{ postgresql_install_dir }}/entrypoint-wrapper.sh"
    mode: '0755'
  notify: restart postgresql

- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ postgresql_install_dir }}/docker-compose.yml"
    mode: '0644'
  notify: restart postgresql

- name: Write initial pgproxy target (points to current primary via WireGuard IP)
  copy:
    # Both Docker containers (pgproxy) and host-level services (PowerDNS socat)
    # can reach the WireGuard IP, so we use it for both.
    # On the primary: own WireGuard IP (local PG). On the standby: peer's WireGuard IP.
    # Local primary: use Docker DNS 'postgresql' (WireGuard IP unreachable from Docker bridge).
    # Remote primary (standby node): use peer hostname (resolved via extra_hosts in pgproxy container).
    content: "{{ 'postgresql' if postgresql_is_primary else groups['dns_servers'] | difference([inventory_hostname]) | first }}"
    dest: "{{ postgresql_install_dir }}/pgproxy-target"
    owner: '999'
    group: '999'
    mode: '0644'

# PG Role Watchdog — polls PG role every 10s and self-heals pgproxy/DNS/consumers.
# Replaces the unreliable signal-file mechanism that had race conditions.
- name: Stop and disable old signal-file mechanism (replaced by watchdog)
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - pg-restart-consumers.path
    - pg-restart-consumers.service
  ignore_errors: true

- name: Clean up stale signal-file artifacts
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/pg-restart-consumers.path
    - /etc/systemd/system/pg-restart-consumers.service
    - "{{ postgresql_install_dir }}/signals"

- name: Deploy PG role watchdog script
  template:
    src: pg-role-watchdog.sh.j2
    dest: /usr/local/bin/pg-role-watchdog.sh
    mode: '0755'

- name: Deploy PG role watchdog timer
  template:
    src: pg-role-watchdog.timer.j2
    dest: /etc/systemd/system/pg-role-watchdog.timer
    mode: '0644'

- name: Deploy PG role watchdog service
  template:
    src: pg-role-watchdog.service.j2
    dest: /etc/systemd/system/pg-role-watchdog.service
    mode: '0644'

- name: Enable and start PG role watchdog
  systemd:
    name: pg-role-watchdog.timer
    daemon_reload: true
    enabled: true
    state: started

- name: Start PostgreSQL stack
  community.docker.docker_compose_v2:
    project_src: "{{ postgresql_install_dir }}"
    pull: missing
    state: present

- name: Wait for PostgreSQL to accept connections
  community.docker.docker_container_exec:
    container: postgresql
    command: >
      pg_isready -U postgres -h localhost
  register: pg_ready
  retries: 40
  delay: 5
  until: pg_ready.rc | default(1) == 0
  changed_when: false
  ignore_errors: false

# Ensure pg_hba.conf allows connections from Docker bridge networks and NetBird mesh
# This is set during initdb by the entrypoint-wrapper, but added here for idempotency
# on existing deployments where the data volume was initialized before this rule existed
- name: Ensure pg_hba.conf allows Docker bridge and NetBird mesh connections
  community.docker.docker_container_exec:
    container: postgresql
    command: >
      bash -c "grep -q '172.16.0.0/12' /var/lib/postgresql/data/pg_hba.conf ||
               (sed -i 's|172.0.0.0/8|172.16.0.0/12|g; s|100.75.0.0/16|100.64.0.0/10|g; s| all trust| all scram-sha-256|g' /var/lib/postgresql/data/pg_hba.conf &&
                pg_ctl -D /var/lib/postgresql/data reload)"
  when: postgresql_is_primary
  changed_when: false

- name: Ensure pg_hba.conf allows IPv6 Docker ULA connections
  community.docker.docker_container_exec:
    container: postgresql
    command: >
      bash -c "grep -q 'fd00::/8' /var/lib/postgresql/data/pg_hba.conf ||
               (echo 'host all all fd00::/8 scram-sha-256' >> /var/lib/postgresql/data/pg_hba.conf &&
                pg_ctl -D /var/lib/postgresql/data reload)"
  when: postgresql_is_primary
  changed_when: false

# Create application databases on primary only (replicated to standby via streaming)
- name: Create application user and database on primary
  community.docker.docker_container_exec:
    container: postgresql
    command: >
      psql -U postgres -tc
      "SELECT 1 FROM pg_roles WHERE rolname='{{ item.user }}'"
  register: pg_user_check
  changed_when: false
  loop: "{{ postgresql_databases }}"
  when: postgresql_is_primary

- name: Create database user if not exists
  community.docker.docker_container_exec:
    container: postgresql
    command: >
      psql -U postgres -c
      "CREATE USER {{ item.item.user }} WITH PASSWORD '{{ item.item.password }}'"
  when:
    - postgresql_is_primary
    - item.stdout is defined
    - item.stdout | trim == ""
  loop: "{{ pg_user_check.results }}"
  no_log: true

- name: Create application database if not exists
  community.docker.docker_container_exec:
    container: postgresql
    command: >
      bash -c "psql -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname='{{ item.name }}'\" | grep -q 1 || createdb -U postgres -O {{ item.user }} {{ item.name }}"
  loop: "{{ postgresql_databases }}"
  when: postgresql_is_primary
  changed_when: false

- name: Wait extra time for standby to complete initial sync
  pause:
    seconds: 15
  when: not postgresql_is_primary

# PostgreSQL scheduled maintenance — VACUUM ANALYZE + REINDEX
- name: Deploy PostgreSQL maintenance script
  template:
    src: pg-maintenance.sh.j2
    dest: /usr/local/bin/pg-maintenance.sh
    mode: '0755'
  when: postgresql_maintenance_enabled
  tags: [postgresql, maintenance]

- name: Deploy PostgreSQL maintenance systemd service
  template:
    src: pg-maintenance.service.j2
    dest: /etc/systemd/system/pg-maintenance.service
    mode: '0644'
  when: postgresql_maintenance_enabled
  tags: [postgresql, maintenance]

- name: Deploy PostgreSQL maintenance systemd timer
  template:
    src: pg-maintenance.timer.j2
    dest: /etc/systemd/system/pg-maintenance.timer
    mode: '0644'
  when: postgresql_maintenance_enabled
  tags: [postgresql, maintenance]

- name: Enable and start PostgreSQL maintenance timer
  systemd:
    name: pg-maintenance.timer
    enabled: yes
    state: started
    daemon_reload: yes
  when: postgresql_maintenance_enabled
  tags: [postgresql, maintenance]

- name: Display PostgreSQL deployment status
  debug:
    msg:
      - "PostgreSQL deployed on {{ inventory_hostname }}"
      - "Role: {{ 'PRIMARY (node ' + postgresql_node_id | string + ')' if postgresql_is_primary else 'STANDBY (node ' + postgresql_node_id | string + ')' }}"
      - "Listening: {{ wireguard_ip | default('127.0.0.1', true) }}:{{ postgresql_port }} (WireGuard tunnel only)"
      - "Application DBs: {{ postgresql_databases | map(attribute='name') | list | join(', ') }}"
