---
# Verification playbook for postgresql_repmgr role
- name: Verify postgresql_repmgr role
  hosts: all
  gather_facts: false
  tasks:
    - name: Check PostgreSQL container is running
      ansible.builtin.command: docker ps --filter name=postgresql --format "{{ '{{' }}.Status{{ '}}' }}"
      register: pg_status
      changed_when: false
      failed_when: "'Up' not in pg_status.stdout"

    - name: Check PostgreSQL accepts connections
      ansible.builtin.command: docker exec postgresql pg_isready -U postgres -h localhost
      register: pg_ready
      changed_when: false
      failed_when: pg_ready.rc != 0

    - name: Check PostgreSQL data directory exists
      ansible.builtin.command: docker exec postgresql test -d /var/lib/postgresql/data
      register: pg_data
      changed_when: false
      failed_when: pg_data.rc != 0

    - name: Check repmgr is available
      ansible.builtin.command: docker exec postgresql repmgr --version
      register: repmgr_version
      changed_when: false
      failed_when: repmgr_version.rc != 0
