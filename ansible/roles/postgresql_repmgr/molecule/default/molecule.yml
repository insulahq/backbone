---
# Molecule test configuration for postgresql_repmgr role
# Tests single-node deployment (primary only, no replication peer)
# Runs: molecule test -s default (from roles/postgresql_repmgr/)
# Requires: pip install molecule molecule-plugins[docker]

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/../../requirements.yml

driver:
  name: docker

platforms:
  - name: test-postgresql
    image: debian:trixie
    pre_build_image: true
    privileged: true
    command: /sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  inventory:
    host_vars:
      test-postgresql:
        postgresql_primary_node: test-postgresql
        netbird_ip: "127.0.0.1"
        postgresql_superuser_password: "test_superuser_pass"
        postgresql_repmgr_password: "test_repmgr_pass"
        postgresql_netbird_password: "test_netbird_pass"

verifier:
  name: ansible
