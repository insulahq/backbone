---
# PowerDNS Slave Role — Main Tasks
# Deploys PowerDNS Secondary on ns2 with SQLite backend
# Zone replication via NetBird mesh (AXFR/NOTIFY from ns1)

- name: Check if NetBird IPs are available
  debug:
    msg:
      - "ns1 replication IP: {{ hostvars['ns1']['netbird_ip'] | default(hostvars['ns1']['ansible_host']) }}"
      - "ns2 bind IP: {{ netbird_ip | default(ansible_default_ipv4.address) }}"
      - ""
      - "{% if hostvars['ns1']['netbird_ip'] is defined %}Using NetBird mesh for zone replication (secure){% else %}Using public IPs for zone replication (will reconfigure after NetBird deployment){% endif %}"

- name: Create PowerDNS installation directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ powerdns_install_dir }}"
    - "{{ powerdns_install_dir }}/backups"

- name: Deploy PowerDNS configuration
  template:
    src: pdns.conf.j2
    dest: "{{ powerdns_install_dir }}/pdns.conf"
    mode: '0644'
  notify: restart powerdns

- name: Deploy docker-compose.yml for PowerDNS
  template:
    src: docker-compose.yml.j2
    dest: "{{ powerdns_install_dir }}/docker-compose.yml"
    mode: '0644'
  notify: restart powerdns

- name: Start PowerDNS services
  community.docker.docker_compose_v2:
    project_src: "{{ powerdns_install_dir }}"
    state: present
  register: powerdns_compose_result

- name: Wait for PowerDNS to be ready
  command: docker exec powerdns-slave pdns_control ping
  register: pdns_ping
  retries: 30
  delay: 2
  until: pdns_ping.rc == 0
  changed_when: false

- name: Get list of zones (after AXFR from ns1)
  command: docker exec powerdns-slave pdns_control list-zones
  register: pdns_zones
  changed_when: false
  ignore_errors: yes

- name: Display PowerDNS deployment status
  debug:
    msg:
      - "PowerDNS Secondary deployed on {{ inventory_hostname }}"
      - "DNS Server: {{ ansible_default_ipv4.address }}:53 (public)"
      - "Role: Secondary (read-only, receives AXFR from ns1)"
      - "Primary server: {{ powerdns_primary_server }}"
      - "NOTIFY accepted from: {{ powerdns_allow_notify_from | join(', ') }}"
      - "Backend: SQLite ({{ powerdns_db_path }})"
      - ""
      - "Zone replication:"
      - "{% if hostvars['ns1']['netbird_ip'] is defined %}  - NOTIFY from ns1 NetBird IP ({{ powerdns_primary_server }}){% else %}  - NOTIFY from ns1 public IP ({{ powerdns_primary_server }}) — TEMPORARY{% endif %}"
      - "{% if hostvars['ns1']['netbird_ip'] is defined %}  - AXFR transfers via encrypted NetBird mesh{% else %}  - AXFR transfers via public internet — WILL RECONFIGURE AFTER NETBIRD{% endif %}"
      - "  - No public AXFR serving (disabled for security)"
      - ""
      - "Zones replicated: {{ pdns_zones.stdout_lines | default(['(waiting for first NOTIFY from ns1)']) }}"

- name: Display security notice
  debug:
    msg:
      - "{% if hostvars['ns1']['netbird_ip'] is defined %}SECURITY: Zone replication via encrypted NetBird mesh{% else %}NOTICE: Zone replication currently via public IPs (temporary){% endif %}"
      - "{% if hostvars['ns1']['netbird_ip'] is defined %}ns1 sends NOTIFY to: {{ netbird_ip | default(ansible_default_ipv4.address) }} (ns2 NetBird IP){% else %}ns1 sends NOTIFY to: {{ ansible_default_ipv4.address }} (ns2 public IP){% endif %}"
      - "{% if hostvars['ns1']['netbird_ip'] is defined %}ns2 fetches AXFR from: {{ powerdns_primary_server }} (ns1 NetBird IP){% else %}ns2 fetches AXFR from: {{ powerdns_primary_server }} (ns1 public IP){% endif %}"
      - "{% if hostvars['ns1']['netbird_ip'] is defined %}Public internet cannot trigger zone transfers or access replication traffic{% else %}After NetBird deployment, reconfigure to use NetBird mesh for encrypted replication{% endif %}"
      - ""
      - "Public access: DNS queries only (port 53)"
      - "No API, no web server, no management interface on secondary"
