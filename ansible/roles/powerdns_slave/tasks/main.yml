---
# PowerDNS authoritative secondary — runs on ns2 (Helsinki)
# Pulls all zones from ns1 via AXFR (notify + periodic check).
# Uses SQLite backend — data persisted on named Docker volume.
#
# Runs as a Docker Compose stack:
#   - powerdns/pdns-auth-49  — PowerDNS authoritative server (secondary mode)
#
# Firewall: port 53 (UDP+TCP) already opened by common/nftables role.

# ---------------------------------------------------------------------------
# Docker — install from Docker's official apt repo
# ---------------------------------------------------------------------------

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Add Docker apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian
      bookworm stable
    filename: docker
    state: present
    update_cache: true

- name: Install Docker CE and Docker Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Start and enable Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Configure Docker daemon DNS and log rotation
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "dns": ["1.1.1.1", "8.8.8.8"],
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "userland-proxy": false
      }
    owner: root
    group: root
    mode: '0644'
  notify: Restart Docker

# Allow unprivileged processes (uid 953 — pdns) to bind port 53 in the host
# network namespace. Required because the PowerDNS container runs with
# network_mode: host; with host networking, Docker sysctls: cannot set
# per-network-namespace parameters — they must be applied to the host itself.
# Setting ip_unprivileged_port_start=53 means any process may bind ports >= 53
# without CAP_NET_BIND_SERVICE or root. Combined with cap_add: NET_BIND_SERVICE
# in the compose file, this lets the container run as uid 953 (not root).
- name: Allow unprivileged port 53 binding for PowerDNS (network_mode host)
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: '53'
    state: present
    sysctl_set: true
    reload: true

# ---------------------------------------------------------------------------
# Directory layout
# ---------------------------------------------------------------------------

- name: Create PowerDNS stack directory
  ansible.builtin.file:
    path: /opt/powerdns
    state: directory
    owner: root
    group: root
    mode: '0750'

# ---------------------------------------------------------------------------
# Configuration files
# ---------------------------------------------------------------------------

- name: Deploy PowerDNS secondary configuration
  ansible.builtin.template:
    src: pdns-slave.conf.j2
    dest: /opt/powerdns/pdns.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart PowerDNS

- name: Deploy Docker Compose stack
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/powerdns/docker-compose.yml
    owner: root
    group: root
    mode: '0640'
  notify: Restart PowerDNS

# ---------------------------------------------------------------------------
# Start the stack
# ---------------------------------------------------------------------------

- name: Pull and start PowerDNS secondary stack
  community.docker.docker_compose_v2:
    project_src: /opt/powerdns
    state: present
    pull: always

- name: Wait for PowerDNS secondary to be listening on port 53
  ansible.builtin.wait_for:
    port: 53
    host: "127.0.0.1"
    timeout: 60
    delay: 5

# ---------------------------------------------------------------------------
# Autoprimary registration — ns1 must be in supermasters table for
# autosecondary to accept NOTIFY and pull zones via AXFR
# ---------------------------------------------------------------------------

- name: Check if ns1 is registered as autoprimary on secondary
  ansible.builtin.command:
    cmd: >
      docker compose exec -T pdns
      pdnsutil list-autoprimaries
  args:
    chdir: /opt/powerdns
  register: powerdns_slave_autoprimaries
  changed_when: false

- name: Register ns1 as autoprimary on secondary
  ansible.builtin.command:
    cmd: >
      docker compose exec -T pdns
      pdnsutil add-autoprimary {{ ns1_netbird_ip }} ns1.{{ platform_domain }} ""
  args:
    chdir: /opt/powerdns
  when: ns1_netbird_ip not in powerdns_slave_autoprimaries.stdout
  changed_when: true

# ---------------------------------------------------------------------------
# Zone reconciliation — eventual consistency for zone deletions
# ---------------------------------------------------------------------------
# The DNS protocol has no "delete zone" NOTIFY. When a zone is removed on ns1,
# ns2 retains it indefinitely until explicitly told to remove it. This cron job
# runs every 5 minutes, compares the local zone list against ns1's REST API,
# and deletes any orphan zones (present locally but absent on ns1).
#
# Prerequisites:
#   - ns1 REST API accessible from ns2 over NetBird on port {{ pdns_api_port }}
#     (nftables DNAT + allow rule in common role for dns_master)
#   - ns2 REST API enabled (api=yes in pdns-slave.conf, bound to 127.0.0.1)
#     (nftables DNAT + allow rule in common role for dns_slave)
#   - python3 available on ns2 (standard Debian 13 install; installed explicitly below)

- name: Install python3 for JSON parsing in reconciliation script
  ansible.builtin.apt:
    name: python3
    state: present

- name: Deploy zone reconciliation script
  ansible.builtin.template:
    src: pdns-reconcile-zones.sh.j2
    dest: /usr/local/bin/pdns-reconcile-zones.sh
    owner: root
    group: root
    mode: '0750'

- name: Install reconciliation cron job (every 5 minutes)
  ansible.builtin.copy:
    dest: /etc/cron.d/pdns-reconcile
    content: |
      # Zone reconciliation — delete zones on ns2 that no longer exist on ns1.
      # Logs to syslog: journalctl -t pdns-reconcile
      */5 * * * * root /usr/local/bin/pdns-reconcile-zones.sh
    owner: root
    group: root
    mode: '0644'
