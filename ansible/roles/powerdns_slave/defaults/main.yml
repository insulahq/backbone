---
# PowerDNS Slave Role — Default Variables
# Deploys PowerDNS Secondary on ns2 with SQLite backend

# PowerDNS versions
powerdns_version: "4.9"
powerdns_image: "powerdns/pdns-auth-49:latest"

# Installation directory
powerdns_install_dir: /opt/powerdns

# PowerDNS configuration
powerdns_primary: no
powerdns_secondary: yes
powerdns_autosecondary: yes  # Auto-create zones on first NOTIFY
powerdns_api_enabled: yes     # API enabled — proxied via nginx on NetBird IP only
powerdns_webserver_enabled: yes
powerdns_webserver_port: 8081  # Internal port (Docker only, never exposed publicly)
powerdns_dns_port: 53

# Nginx proxy — exposes API on NetBird interface only (mirrors NS1 pattern)
powerdns_nginx_api_port: 8081
powerdns_bind_interface: "{{ netbird_ip | default('127.0.0.1') }}"  # NS2 NetBird IP

# DNSSEC
powerdns_dnssec_enabled: yes

# Zone replication (AXFR/NOTIFY)
# Include BOTH NetBird IP AND public IP for resilience.
# When NS1's WireGuard is down after reboot, NOTIFY arrives from public IP.
powerdns_allow_notify_from:
  - "{{ hostvars['ns1']['netbird_ip'] | default(hostvars['ns1']['ansible_host']) }}"
  - "{{ hostvars['ns1']['ansible_host'] }}"

# AXFR source — pull zones from ns1 (NetBird IP preferred)
powerdns_primary_server: "{{ hostvars['ns1']['netbird_ip'] | default(hostvars['ns1']['ansible_host']) }}"

# AXFR settings
powerdns_xfr_cycle_interval: 60      # Check for zone updates every 60 seconds
powerdns_axfr_fetch_timeout: 10      # Timeout for AXFR transfers

# SQLite backend (lightweight for secondary)
powerdns_db_path: /var/lib/powerdns/pdns.sqlite3

# Logging
powerdns_log_level: "4"  # 0=nothing, 9=very verbose
