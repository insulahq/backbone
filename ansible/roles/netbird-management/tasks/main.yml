---
# NetBird self-hosted management server — runs on ns1 (Falkenstein)
# Provides: WireGuard mesh VPN for zero-trust admin access to all cluster nodes
# Co-hosted with PowerDNS master (ns1) per architecture decision ADR-013

- name: Install Docker (NetBird management runs as Docker Compose stack)
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-plugin
    state: present

- name: Start and enable Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Create NetBird management directory
  ansible.builtin.file:
    path: /opt/netbird
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Create NetBird data directory
  ansible.builtin.file:
    path: /opt/netbird/data
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Deploy NetBird Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/netbird/docker-compose.yml
    owner: root
    group: root
    mode: '0640'
  notify: Restart NetBird management

- name: Deploy NetBird management config
  ansible.builtin.template:
    src: management.json.j2
    dest: /opt/netbird/data/management.json
    owner: root
    group: root
    mode: '0640'
  notify: Restart NetBird management

- name: Open HTTPS port for NetBird management UI + gRPC (UFW)
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
    comment: "NetBird management server (HTTPS + gRPC)"

- name: Open HTTP port for cert-manager ACME challenge (UFW)
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    comment: "NetBird HTTP (ACME challenge for Let's Encrypt)"

- name: Open STUN/TURN port for NetBird relay (UFW)
  community.general.ufw:
    rule: allow
    port: "3478"
    proto: udp
    comment: "NetBird STUN/TURN relay"

- name: Open WireGuard port (UFW)
  community.general.ufw:
    rule: allow
    port: "51820"
    proto: udp
    comment: "WireGuard/NetBird data plane"

- name: Pull and start NetBird management stack
  community.docker.docker_compose_v2:
    project_src: /opt/netbird
    state: present
    pull: always

- name: Wait for NetBird management to be healthy
  ansible.builtin.wait_for:
    port: 443
    host: "127.0.0.1"
    timeout: 60
    delay: 5
