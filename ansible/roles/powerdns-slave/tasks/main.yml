---
# PowerDNS AXFR slave — runs on ns2 (Helsinki)
# Pulls all zones from ns1 via AXFR. No local PostgreSQL needed.
# Uses SQLite backend (sufficient for a read-only slave).

- name: Add PowerDNS apt signing key
  ansible.builtin.get_url:
    url: "https://repo.powerdns.com/FD380FBB-pub.asc"
    dest: /etc/apt/keyrings/powerdns.asc
    mode: '0644'

- name: Add PowerDNS apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/powerdns.asc] http://repo.powerdns.com/debian bookworm-auth-{{ pdns_version | replace('.', '') }} main"
    filename: powerdns
    state: present

- name: Pin PowerDNS packages to official repo
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/pdns
    content: |
      Package: pdns-*
      Pin: origin repo.powerdns.com
      Pin-Priority: 600
    mode: '0644'

- name: Install PowerDNS with SQLite backend (slave — no PG needed)
  ansible.builtin.apt:
    name:
      - pdns-server
      - pdns-backend-sqlite3
    state: present
    update_cache: true

- name: Ensure PowerDNS data directory exists
  ansible.builtin.file:
    path: /var/lib/powerdns
    state: directory
    owner: pdns
    group: pdns
    mode: '0750'

- name: Initialise PowerDNS SQLite schema (slave)
  ansible.builtin.shell: |
    sqlite3 /var/lib/powerdns/pdns.sqlite3 < /usr/share/pdns-backend-sqlite3/schema/schema.sqlite3.sql
  args:
    creates: /var/lib/powerdns/pdns.sqlite3

- name: Set ownership on SQLite database
  ansible.builtin.file:
    path: /var/lib/powerdns/pdns.sqlite3
    owner: pdns
    group: pdns
    mode: '0640'

- name: Deploy PowerDNS slave configuration
  ansible.builtin.template:
    src: pdns-slave.conf.j2
    dest: /etc/powerdns/pdns.conf
    owner: root
    group: pdns
    mode: '0640'
  notify: Restart PowerDNS

- name: Deploy PowerDNS SQLite backend configuration
  ansible.builtin.template:
    src: gsqlite3.conf.j2
    dest: /etc/powerdns/pdns.d/gsqlite3.conf
    owner: root
    group: pdns
    mode: '0640'
  notify: Restart PowerDNS

- name: Start and enable PowerDNS (slave)
  ansible.builtin.systemd:
    name: pdns
    state: started
    enabled: true

- name: Verify PowerDNS slave is listening on port 53
  ansible.builtin.wait_for:
    port: 53
    host: "127.0.0.1"
    timeout: 30
