---
# NetBird Peer Role — Main Tasks
# Installs NetBird peer client via official apt repository and enrolls with management server.
# Compatible with NetBird v0.66+ combined server architecture.

- name: Validate netbird_setup_key is set
  assert:
    that:
      - netbird_setup_key is defined
      - netbird_setup_key | length > 0
    fail_msg: >-
      netbird_setup_key is empty. Create a setup key in the NetBird dashboard
      (Settings > Setup Keys > Add Key) and set it in group_vars/all.yml
      before running peer enrollment. See docs/BOOTSTRAP.md Phase 2 manual steps.
  tags: [netbird, netbird_peer]

- name: Install apt dependencies for NetBird repo
  apt:
    name:
      - curl
      - gnupg
      - apt-transport-https
    state: present
    update_cache: true

- name: Create apt keyrings directory
  file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: Download NetBird GPG key (armored)
  get_url:
    url: https://pkgs.netbird.io/debian/public.key
    dest: /tmp/netbird.asc
    mode: '0644'
    force: true

- name: Dearmor NetBird GPG key
  command: gpg --dearmor -o /usr/share/keyrings/netbird.gpg /tmp/netbird.asc
  args:
    creates: /usr/share/keyrings/netbird.gpg

- name: Add NetBird apt repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/netbird.gpg] https://pkgs.netbird.io/debian/ stable main"
    state: present
    filename: netbird
    update_cache: true

- name: Install NetBird client
  apt:
    name: netbird
    state: present
    update_cache: true

- name: Enable and start NetBird daemon
  systemd:
    name: netbird
    enabled: "{{ netbird_autostart }}"
    state: started
    daemon_reload: true

- name: Wait for NetBird daemon to be ready
  wait_for:
    path: /var/run/netbird.sock
    state: present
    timeout: 30
  ignore_errors: true

- name: Check if NetBird is already enrolled
  stat:
    path: "{{ netbird_config_dir }}/config.json"
  register: netbird_config

- name: Enroll NetBird peer with management server
  when: not netbird_config.stat.exists
  block:
    - name: Assert setup key is defined
      assert:
        that:
          - netbird_setup_key is defined
          - netbird_setup_key | length > 0
        fail_msg: "netbird_setup_key must be defined in group_vars/all.yml"

    - name: Run netbird up to enroll peer
      command: >
        netbird up
        --setup-key {{ netbird_setup_key }}
        --management-url {{ netbird_management_url }}
        --hostname {{ netbird_peer_hostname }}
        --log-level {{ netbird_log_level }}
      register: netbird_enroll_result
      changed_when: true
      no_log: true

    - name: Show enrollment result
      debug:
        msg: "NetBird peer enrolled as {{ netbird_peer_hostname }}"

- name: Wait for NetBird to reach Connected state
  command: netbird status
  register: netbird_status
  until: "'Connected' in netbird_status.stdout"
  retries: 15
  delay: 3
  changed_when: false
  failed_when: false

- name: Display NetBird peer status
  debug:
    msg: "{{ netbird_status.stdout_lines }}"
