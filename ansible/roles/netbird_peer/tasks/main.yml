---
# NetBird peer enrollment — runs on all platform servers (ns1, ns2, k3s nodes, etc.)
# Enrolls the host into the NetBird WireGuard mesh using the management server on ns1.
#
# Setup key strategy:
#   A one-time setup key is generated via the NetBird API (from the Ansible control
#   machine) immediately before enrollment. It expires after 1 use or 10 minutes,
#   whichever comes first. The key carries auto_groups so the peer is placed into
#   the "phoenix-host.net" group automatically at enrollment — no separate API call
#   needed. This prevents key reuse and limits exposure.
#
#   Requires: netbird_api_pat set in group_vars/all.yml (a Personal Access Token
#   generated in the NetBird dashboard under Settings → Access Tokens).
#
# Idempotency:
#   If the peer is already enrolled (netbird status shows Connected), the enrollment
#   and group tasks are skipped. Re-running the playbook is safe.

# ---------------------------------------------------------------------------
# Install NetBird client
# ---------------------------------------------------------------------------

- name: Add NetBird apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.netbird.io/debian/public.key"
    dest: /etc/apt/keyrings/netbird.asc
    mode: '0644'

- name: Add NetBird apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/netbird.asc] https://pkgs.netbird.io/debian stable main"
    filename: netbird
    state: present

- name: Install NetBird client
  ansible.builtin.apt:
    name: netbird
    state: present
    update_cache: true

- name: Ensure /etc/netbird config directory exists
  ansible.builtin.file:
    path: /etc/netbird
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy NetBird client configuration
  ansible.builtin.template:
    src: netbird-client.json.j2
    dest: /etc/netbird/config.json
    owner: root
    group: root
    mode: '0600'
  notify: Restart NetBird service

- name: Start and enable NetBird service
  ansible.builtin.systemd:
    name: netbird
    state: started
    enabled: true

# ---------------------------------------------------------------------------
# Check if already enrolled — skip key generation if already connected
# ---------------------------------------------------------------------------

- name: Check if peer is already enrolled
  ansible.builtin.command:
    cmd: netbird status --json
  register: netbird_peer_status_check
  changed_when: false
  failed_when: false

- name: Set enrolled fact
  ansible.builtin.set_fact:
    netbird_peer_already_enrolled: >-
      {{ (netbird_peer_status_check.stdout | from_json).management.connected | bool
         if netbird_peer_status_check.rc == 0
            and netbird_peer_status_check.stdout | trim | length > 0
            and (netbird_peer_status_check.stdout | trim).startswith('{')
         else false }}

# ---------------------------------------------------------------------------
# Generate a one-time setup key via NetBird API (runs on control machine)
# Requires: netbird_api_pat defined in group_vars/all.yml
# ---------------------------------------------------------------------------

- name: Fail if API PAT not configured and peer not yet enrolled
  ansible.builtin.fail:
    msg: >
      netbird_api_pat is not set in group_vars/all.yml.
      Generate a Personal Access Token in the NetBird dashboard under
      Settings → Access Tokens, then set netbird_api_pat in all.yml.
  when:
    - not netbird_peer_already_enrolled
    - netbird_api_pat == "CHANGE_ME_GENERATE_IN_NETBIRD_DASHBOARD"

# ---------------------------------------------------------------------------
# Resolve the "phoenix-host.net" group ID — used as auto_groups on the key
# so the peer is placed into the group automatically at enrollment time.
# ---------------------------------------------------------------------------

- name: Fetch NetBird groups from API
  ansible.builtin.uri:
    url: "{{ netbird_management_url }}/api/groups"
    method: GET
    headers:
      Authorization: "Token {{ netbird_api_pat }}"
    status_code: 200
    validate_certs: true
  register: netbird_peer_groups_response
  delegate_to: localhost
  when: not netbird_peer_already_enrolled

- name: Resolve phoenix-host.net group ID
  ansible.builtin.set_fact:
    netbird_peer_platform_group_id: >-
      {{ (netbird_peer_groups_response.json
          | selectattr('name', 'equalto', netbird_platform_group)
          | map(attribute='id')
          | list
          | first) }}
  when: not netbird_peer_already_enrolled

- name: Fail if platform group not found
  ansible.builtin.fail:
    msg: >
      NetBird group "{{ netbird_platform_group }}" not found.
      Create it in the NetBird dashboard before enrolling peers.
  when:
    - not netbird_peer_already_enrolled
    - netbird_peer_platform_group_id is not defined or netbird_peer_platform_group_id == ''

- name: Create one-time setup key via NetBird API
  ansible.builtin.uri:
    url: "{{ netbird_management_url }}/api/setup-keys"
    method: POST
    headers:
      Authorization: "Token {{ netbird_api_pat }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "ansible-{{ inventory_hostname }}-{{ ansible_facts['date_time']['iso8601_basic_short'] }}"
      type: "one-off"
      expires_in: 600          # 10 minutes — expires even if unused
      usage_limit: 1
      auto_groups:
        - "{{ netbird_peer_platform_group_id }}"
      ephemeral: false
    status_code: 200
    validate_certs: true
  register: netbird_peer_setup_key_response
  delegate_to: localhost
  when: not netbird_peer_already_enrolled
  no_log: true                 # Don't log the API response containing the key

- name: Enroll peer with one-time setup key
  ansible.builtin.command:
    cmd: >
      netbird up
      --management-url {{ netbird_management_url }}
      --setup-key {{ netbird_peer_setup_key_response.json.key }}
      --hostname {{ inventory_hostname }}.{{ platform_domain }}
  changed_when: true
  when: not netbird_peer_already_enrolled
  no_log: true                 # Don't log the setup key value

- name: Verify peer is connected
  ansible.builtin.command:
    cmd: netbird status
  register: netbird_peer_verify
  changed_when: false
  retries: 6
  delay: 5
  until: "'Connected' in netbird_peer_verify.stdout"

- name: Show NetBird status
  ansible.builtin.debug:
    msg: "{{ netbird_peer_verify.stdout_lines }}"
