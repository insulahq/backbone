---
# NetBird Peer Role — Main Tasks
# Installs NetBird peer client via official apt repository.
# Enrollment is done manually after deployment:
#   netbird up --setup-key <KEY> --management-url https://vpn.<domain> --hostname <hostname>

- name: Install apt dependencies for NetBird repo
  apt:
    name:
      - curl
      - gnupg
      - apt-transport-https
    state: present
    update_cache: true

- name: Create apt keyrings directory
  file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: Download NetBird GPG key (armored)
  get_url:
    url: https://pkgs.netbird.io/debian/public.key
    dest: /tmp/netbird.asc
    mode: '0644'
    force: true

- name: Dearmor NetBird GPG key
  command: gpg --dearmor -o /usr/share/keyrings/netbird.gpg /tmp/netbird.asc
  args:
    creates: /usr/share/keyrings/netbird.gpg

- name: Add NetBird apt repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/netbird.gpg] https://pkgs.netbird.io/debian/ stable main"
    state: present
    filename: netbird
    update_cache: true

- name: Install NetBird client
  apt:
    name: netbird
    state: present
    update_cache: true

- name: Enable and start NetBird daemon
  systemd:
    name: netbird
    enabled: "{{ netbird_autostart }}"
    state: started
    daemon_reload: true

- name: Wait for NetBird daemon to be ready
  wait_for:
    path: /var/run/netbird.sock
    state: present
    timeout: 30
  ignore_errors: true

- name: Check if NetBird is already enrolled
  stat:
    path: "{{ netbird_config_dir }}/config.json"
  register: netbird_config

- name: Display enrollment instructions
  debug:
    msg:
      - "NetBird client installed on {{ inventory_hostname }}"
      - ""
      - "To enroll this peer, run manually on the server:"
      - "  netbird up --setup-key <KEY> --management-url {{ netbird_management_url }} --hostname {{ netbird_peer_hostname }}"
      - ""
      - "Create a setup key in the NetBird dashboard: Settings > Setup Keys > Add Key"
  when: not netbird_config.stat.exists

# Signal server failback guard — hourly check that restarts the peer client
# if it's connected to the wrong signal server after failover/failback (gotcha 136).
- name: Deploy NetBird signal check script
  template:
    src: netbird-signal-check.sh.j2
    dest: /usr/local/bin/netbird-signal-check.sh
    mode: '0755'

- name: Deploy NetBird signal check timer
  template:
    src: netbird-signal-check.timer.j2
    dest: /etc/systemd/system/netbird-signal-check.timer
    mode: '0644'
  notify: reload systemd

- name: Deploy NetBird signal check service
  template:
    src: netbird-signal-check.service.j2
    dest: /etc/systemd/system/netbird-signal-check.service
    mode: '0644'
  notify: reload systemd

- name: Enable and start NetBird signal check timer
  systemd:
    name: netbird-signal-check.timer
    daemon_reload: true
    enabled: true
    state: started

- name: Display NetBird peer status
  command: netbird status
  register: netbird_status
  changed_when: false
  failed_when: false
  when: netbird_config.stat.exists

- name: Show peer status
  debug:
    msg: "{{ netbird_status.stdout_lines }}"
  when: netbird_config.stat.exists and netbird_status.stdout_lines is defined
