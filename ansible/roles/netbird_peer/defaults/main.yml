---
# NetBird Peer Role — Default Variables

# Installation method: apt (official NetBird apt repository)
netbird_install_method: apt

# Peer hostname (defaults to inventory_hostname)
netbird_peer_hostname: "{{ inventory_hostname }}"

# Management server URL (set in group_vars/all.yml)
# netbird_management_url: defined in group_vars/all.yml

# Auto-start on boot
netbird_autostart: true

# Log level
netbird_log_level: info

# Config file path (written by netbird up)
netbird_config_dir: /etc/netbird

# --- Self-heal guard (gotcha 148) ---
# Periodic check that restarts the NetBird engine (netbird down && up) when
# management/signal stay disconnected — the automated version of the manual
# stranded-peer remedy. Works without any server-side reachability, so it is
# the only mechanism that recovers a peer after a hard primary failure.
netbird_selfheal_enabled: true
netbird_selfheal_interval: "2min"    # timer cadence
netbird_selfheal_fail_threshold: 3   # consecutive failed checks before restart (~6 min)
netbird_selfheal_cooldown_secs: 900  # min seconds between restarts (flap guard)

# Minimum client version — keeps clients current for relay/lazy-connection
# fixes and security patches. NOTE (2026-07-22): a version floor does NOT
# prevent the management-reconnect wedge — a 0.74.7 (current) client was
# observed wedging permanently after a 90s endpoint outage, same as older
# ones. The self-heal guard above is the effective protection; this floor
# is hygiene. When set (e.g. "0.74.7"), peers below it are upgraded from
# the NetBird apt repo. Empty = disabled.
netbird_peer_min_version: ""
