---
# PowerDNS authoritative master — runs on ns1 (Falkenstein)
# Provides: primary DNS for all customer zones, API for Management API, AXFR to ns2

- name: Install PostgreSQL (PowerDNS backend)
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2   # Required for Ansible postgresql_* modules
    state: present

- name: Start and enable PostgreSQL
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true

- name: Create PowerDNS database user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ pdns_db_user }}"
    password: "{{ pdns_db_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE

- name: Create PowerDNS database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ pdns_db_name }}"
    owner: "{{ pdns_db_user }}"
    encoding: UTF8

- name: Grant privileges on PowerDNS database
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    database: "{{ pdns_db_name }}"
    privs: ALL
    type: database
    roles: "{{ pdns_db_user }}"

- name: Add PowerDNS apt signing key
  ansible.builtin.get_url:
    url: "https://repo.powerdns.com/FD380FBB-pub.asc"
    dest: /etc/apt/keyrings/powerdns.asc
    mode: '0644'

- name: Add PowerDNS apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/powerdns.asc] http://repo.powerdns.com/debian bookworm-auth-{{ pdns_version | replace('.', '') }} main"
    filename: powerdns
    state: present

- name: Pin PowerDNS packages to official repo
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/pdns
    content: |
      Package: pdns-*
      Pin: origin repo.powerdns.com
      Pin-Priority: 600
    mode: '0644'

- name: Install PowerDNS authoritative server and PostgreSQL backend
  ansible.builtin.apt:
    name:
      - pdns-server
      - pdns-backend-pgsql
    state: present
    update_cache: true

- name: Initialise PowerDNS PostgreSQL schema
  become: true
  become_user: postgres
  community.postgresql.postgresql_script:
    db: "{{ pdns_db_name }}"
    path: /usr/share/pdns-backend-pgsql/schema/schema.pgsql.sql
  register: schema_result
  # Only run if the 'domains' table doesn't exist yet
  failed_when: false
  changed_when: "'already exists' not in (schema_result.stderr | default(''))"

- name: Deploy PowerDNS master configuration
  ansible.builtin.template:
    src: pdns.conf.j2
    dest: /etc/powerdns/pdns.conf
    owner: root
    group: pdns
    mode: '0640'
  notify: Restart PowerDNS

- name: Deploy PowerDNS PostgreSQL backend configuration
  ansible.builtin.template:
    src: gpgsql.conf.j2
    dest: /etc/powerdns/pdns.d/gpgsql.conf
    owner: root
    group: pdns
    mode: '0640'
  notify: Restart PowerDNS

- name: Ensure pdns.d directory exists
  ansible.builtin.file:
    path: /etc/powerdns/pdns.d
    state: directory
    owner: root
    group: pdns
    mode: '0750'

- name: Open PowerDNS API port in UFW (internal only — restrict to NetBird mesh)
  community.general.ufw:
    rule: allow
    port: "{{ pdns_api_port }}"
    proto: tcp
    src: "127.0.0.1"
    comment: "PowerDNS API — localhost only (Management API accesses via localhost)"

- name: Start and enable PowerDNS
  ansible.builtin.systemd:
    name: pdns
    state: started
    enabled: true

- name: Verify PowerDNS is listening on port 53
  ansible.builtin.wait_for:
    port: 53
    host: "127.0.0.1"
    timeout: 30
