[defaults]
inventory            = inventory/hosts.yml
interpreter_python   = /usr/bin/python3
private_key_file   = ~/phoenix-host.key
remote_user        = root
host_key_checking  = True
retry_files_enabled = False
stdout_callback    = default
result_format      = yaml
collections_path   = ~/.ansible/collections

[ssh_connection]
# Prevent SSH from launching a GUI password prompt
# SSH_ASKPASS is intentionally unset — use key-based auth only
ssh_args = -o BatchMode=yes -o ConnectTimeout=10 -o ControlMaster=no -o ControlPath=none
pipelining = True
