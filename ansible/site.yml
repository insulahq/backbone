---
# Phoenix Host -- Infrastructure Playbook
# Deploys fully redundant DNS + VPN mesh infrastructure on ns1 + ns2
#
# Bootstrap order matters:
#   1. common    -- OS hardening, Docker, nftables, fail2ban
#   2. powerdns  -- DNS servers (primary on ns1, secondary on ns2)
#   3. traefik   -- Reverse proxy with DNS-01 ACME (needs PowerDNS API)
#   4. postgresql -- HA database for NetBird (needs NetBird IPs after first deploy)
#   5. netbird   -- VPN mesh management (needs Traefik + PostgreSQL)
#   6. peers     -- Enroll all servers in the VPN mesh
#   7. backup    -- Restic backup to Hetzner Storagebox
#
# IMPORTANT: Fresh deployment requires multiple runs. See docs/BOOTSTRAP.md

- name: Apply common configuration to all servers
  hosts: all
  roles:
    - common

- name: Deploy PowerDNS primary
  hosts: powerdns_primary
  roles:
    - powerdns_master

- name: Deploy PowerDNS secondary
  hosts: powerdns_secondary
  roles:
    - powerdns_slave

- name: Deploy Traefik reverse proxy
  hosts: netbird_management
  roles:
    - traefik

- name: Deploy PostgreSQL primary/standby with repmgr
  hosts: netbird_management
  serial: 1
  roles:
    - postgresql_repmgr

- name: Deploy NetBird management server
  hosts: netbird_management
  roles:
    - netbird_management

- name: Deploy NetBird peers
  hosts: netbird_peers
  roles:
    - netbird_peer

- name: Deploy backup configuration
  hosts: backup_targets
  roles:
    - backup
