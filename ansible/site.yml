---
# Hosting Platform -- Infrastructure Playbook
# Deploys fully redundant DNS + VPN mesh infrastructure on ns1 + ns2
#
# Bootstrap order matters:
#   0. ssh-keys    -- Generate per-server SSH keypairs (local only, always runs)
#   1. common      -- OS hardening, Docker, nftables, fail2ban, deploy SSH public keys
#   2. traefik     -- Reverse proxy (needs to start before NetBird for certs)
#   3. postgresql  -- HA database (needed by PowerDNS, NetBird, and Zitadel)
#   4. powerdns    -- DNS servers (both nodes, shared PostgreSQL HA backend)
#   5. netbird     -- VPN mesh management (needs Traefik + PostgreSQL)
#   6. peers       -- Enroll all servers in the VPN mesh
#   7. zitadel     -- Central IAM (needs Traefik + PostgreSQL + PowerDNS for DNS records)
#   8. gatus       -- Monitoring dashboard + alert receiver (needs Traefik + PostgreSQL + PowerDNS)
#   9. portainer   -- Docker management UI (needs NetBird IPs, internal only)
#  10. backup      -- Restic backup to Hetzner Storagebox
#
# IMPORTANT: Fresh deployment requires multiple runs. See docs/BOOTSTRAP.md
#
# SSH keys: Per-server ED25519 keypairs are auto-generated in .generated_secrets/ssh/.
# First run (bootstrap): ansible-playbook site.yml -e 'ansible_ssh_private_key_file=~/hosting-platform.key'
# Subsequent runs use the per-server keys automatically (configured in group_vars/all.yml).

# Pre-play: Generate per-server SSH keypairs locally (no server connection needed).
# Tags: [always] ensures this runs regardless of --tags filtering.
# Idempotent: skips generation if key files already exist.
- name: Generate per-server SSH keypairs (local only)
  hosts: all
  gather_facts: false
  tags: [always]
  tasks:
    - name: Create SSH key directory on control machine
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{{ playbook_dir }}/.generated_secrets/ssh"
        state: directory
        mode: '0700'

    - name: Generate ED25519 keypair for {{ inventory_hostname }}
      delegate_to: localhost
      ansible.builtin.command: >
        ssh-keygen -t ed25519
        -f "{{ playbook_dir }}/.generated_secrets/ssh/{{ inventory_hostname }}"
        -N "" -C "ansible@{{ inventory_hostname }}"
      args:
        creates: "{{ playbook_dir }}/.generated_secrets/ssh/{{ inventory_hostname }}"

    - name: Set correct permissions on private key
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ playbook_dir }}/.generated_secrets/ssh/{{ inventory_hostname }}"
        mode: '0600'

- name: Apply common configuration to all servers
  hosts: all
  tags: [common]
  roles:
    - common

- name: Deploy Traefik reverse proxy
  hosts: dns_servers
  tags: [traefik]
  roles:
    - traefik

- name: Deploy PostgreSQL primary node first
  hosts: dns_servers
  serial: 1
  tags: [postgresql]
  roles:
    - role: postgresql_repmgr
      when: inventory_hostname == postgresql_primary_node

- name: Deploy PostgreSQL standby node
  hosts: dns_servers
  serial: 1
  tags: [postgresql]
  roles:
    - role: postgresql_repmgr
      when: inventory_hostname != postgresql_primary_node

- name: Deploy PowerDNS (both nodes, shared PostgreSQL HA)
  hosts: dns_servers
  tags: [powerdns, dns]
  roles:
    - powerdns

- name: Deploy NetBird management server
  hosts: dns_servers
  tags: [netbird, netbird_management]
  roles:
    - netbird_management

- name: Deploy NetBird peers
  hosts: netbird_peers
  tags: [netbird, netbird_peer]
  roles:
    - netbird_peer

- name: Deploy Zitadel IAM
  hosts: dns_servers
  serial: 1
  tags: [zitadel]
  roles:
    - zitadel

- name: Deploy Gatus monitoring
  hosts: dns_servers
  serial: 1
  tags: [gatus]
  roles:
    - gatus

- name: Deploy Portainer Docker management
  hosts: dns_servers
  tags: [portainer]
  roles:
    - portainer

- name: Deploy backup configuration
  hosts: backup_targets
  tags: [backup]
  roles:
    - backup
