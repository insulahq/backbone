---
# Phoenix Host — Main Ansible Playbook
# Aligned with docs/04-deployment/FRESH_INFRASTRUCTURE_PLAN.md

- name: Apply common configuration to all servers
  hosts: all
  roles:
    - common

# Phase 1 deployment order
- name: Deploy PowerDNS primary
  hosts: powerdns_primary
  roles:
    - powerdns_master

- name: Deploy PowerDNS secondary
  hosts: powerdns_secondary
  roles:
    - powerdns_slave

