---
# Hosting Platform -- Infrastructure Playbook
# Deploys fully redundant DNS + VPN mesh infrastructure on ns1 + ns2
#
# Three-phase deployment ensures the primary node is fully operational
# before the secondary joins:
#
#   Phase 1: Infrastructure backbone (both nodes)
#            common, wireguard, postgresql
#   Phase 2: Services on primary node (dns_failover_primary, default: ns1)
#            powerdns, traefik, zitadel, netbird, gatus, portainer, backup
#            PowerDNS runs first so Traefik can issue certs via DNS-01 immediately
#   Phase 3: Services on secondary node
#            Same services, same order — joins as replica
#   Phase 4: Peer enrollment (both nodes)
#            netbird peers
#
# DNS active-passive failover sends all traffic to the primary node.
# The secondary only receives traffic when the primary fails health checks.
#
# Phase tags (phase1, phase2, phase3, phase4) allow running specific phases.
# Service tags (traefik, zitadel, etc.) match roles in both phases 2 and 3,
# deploying primary first then secondary automatically.
#
# Performance: Phase 2 and 3 each use a SINGLE play with multiple roles,
# sharing one SSH connection and skipping redundant fact gathering.
#
# SSH keys: Per-server ED25519 keypairs are auto-generated in .generated_secrets/ssh/.
# First run (bootstrapping SSH key):
#   ansible-playbook site.yml -e 'ansible_ssh_private_key_file=~/hosting-platform.key'
# Subsequent runs use the per-server keys automatically (configured in group_vars/all.yml).

# Pre-play: Generate per-server SSH keypairs (shared across all playbooks)
- import_playbook: _ssh-keys.yml

# ============================================================================
# Pre-flight: Validate required variables before any deployment
# ============================================================================
# Catches placeholder values and missing credentials BEFORE deployment starts.
# Runs with tags: [always] so it executes regardless of --tags filtering.

- name: "Pre-flight: Validate required variables"
  hosts: all
  gather_facts: false
  become: false
  tags: [always]
  tasks:
    - name: Validate PostgreSQL passwords are not placeholders
      run_once: true
      assert:
        that:
          - postgresql_superuser_password is defined
          - postgresql_superuser_password | length > 0
          - "'GENERATE' not in postgresql_superuser_password"
          - postgresql_repmgr_password is defined
          - postgresql_repmgr_password | length > 0
          - "'GENERATE' not in postgresql_repmgr_password"
          - postgresql_netbird_password is defined
          - postgresql_netbird_password | length > 0
          - "'GENERATE' not in postgresql_netbird_password"
          - postgresql_netbird_dex_password is defined
          - postgresql_netbird_dex_password | length > 0
          - "'GENERATE' not in postgresql_netbird_dex_password"
        fail_msg: >-
          PostgreSQL passwords must be set in group_vars/all.yml.
          Generate with: openssl rand -base64 22

    - name: Validate PowerDNS API key is not a placeholder
      run_once: true
      assert:
        that:
          - powerdns_api_key is defined
          - powerdns_api_key | length > 0
          - "'GENERATE' not in powerdns_api_key"
        fail_msg: >-
          powerdns_api_key must be set in group_vars/all.yml.
          Generate with: openssl rand -base64 48

    - name: Validate platform_domain is not example.com
      run_once: true
      assert:
        that:
          - platform_domain is defined
          - platform_domain != 'example.com'
        fail_msg: >-
          platform_domain is still set to 'example.com'.
          Set your actual domain in group_vars/all.yml.

    - name: Validate server IPs are not placeholders
      when: inventory_hostname in groups.get('dns_servers', [])
      assert:
        that:
          - ansible_host is defined
          - "'<' not in ansible_host"
        fail_msg: >-
          ansible_host for {{ inventory_hostname }} is still a placeholder.
          Set the public IPv4 address in inventory/hosts.yml.

    - name: Validate backup credentials (when backups enabled)
      run_once: true
      when: backup_enabled | default(false) | bool
      assert:
        that:
          - backup_sftp_user is defined
          - "'<' not in (backup_sftp_user | string)"
          - backup_sftp_host is defined
          - "'<' not in (backup_sftp_host | string)"
        fail_msg: >-
          backup_enabled is true but backup server credentials are still placeholders.
          Set backup_sftp_user and backup_sftp_host in group_vars/all.yml,
          or set backup_enabled: false to skip backup deployment.

# ============================================================================
# Pre-flight: Auto-detect PostgreSQL primary after failover
# ============================================================================
# On existing clusters, queries each node to find the actual primary.
# If a failover has occurred (e.g., ns2 promoted), this overrides
# postgresql_primary_node and dns_failover_primary for the entire run.
# Skipped on fresh bootstrap (no containers running yet).

- name: "Pre-flight: Auto-detect PostgreSQL primary node"
  # NOTE: this pre-task respects --limit. When bootstrapping a fresh NEW_NODE
  # with `--limit NEW_NODE`, detection sees only the standby and keeps the
  # default primary, causing UPDATE-against-local-PG failures downstream.
  # Workaround: pass `-e postgresql_primary_node=<ACTUAL> dns_failover_primary=<ACTUAL>`.
  # Documented in RECOVERY.md Scenario 3 pitfalls.
  hosts: dns_servers
  gather_facts: false
  tags: [always]
  tasks:
    - name: Check if PostgreSQL container is running
      shell: "docker ps --filter name=^postgresql$ --filter status=running --format 'running'"
      register: _pg_container_running
      changed_when: false
      failed_when: false

    - name: Query PostgreSQL primary status
      command: docker exec postgresql psql -U postgres -tAc "SELECT NOT pg_is_in_recovery();"
      register: _pg_is_primary
      changed_when: false
      failed_when: false
      when: _pg_container_running.stdout | default('') == 'running'

    - name: Detect actual primary node
      run_once: true
      block:
        - name: Build list of nodes reporting as primary
          set_fact:
            _detected_primaries: >-
              {{ groups['dns_servers']
                 | select('in', (hostvars | dict2items
                   | selectattr('value._pg_is_primary.stdout', 'defined')
                   | selectattr('value._pg_is_primary.stdout', 'match', '^\s*t\s*$')
                   | map(attribute='key') | list))
                 | list }}

        - name: Override postgresql_primary_node if failover detected
          set_fact:
            postgresql_primary_node: "{{ _detected_primaries[0] }}"
            dns_failover_primary: "{{ _detected_primaries[0] }}"
          delegate_to: "{{ item }}"
          delegate_facts: true
          loop: "{{ groups['all'] }}"
          when:
            - _detected_primaries | length == 1
            - _detected_primaries[0] != (postgresql_primary_node | default('ns1'))

        - name: Report primary detection result
          debug:
            msg: >-
              {% if _detected_primaries | length == 1 and _detected_primaries[0] != (postgresql_primary_node | default('ns1')) %}
              FAILOVER DETECTED: Configured primary={{ postgresql_primary_node | default('ns1') }}, actual primary={{ _detected_primaries[0] }}. Overriding for this run.
              {% elif _detected_primaries | length == 1 %}
              PostgreSQL primary confirmed: {{ _detected_primaries[0] }} (matches configuration)
              {% elif _detected_primaries | length == 0 %}
              No PostgreSQL containers detected (fresh deploy) — using configured primary: {{ postgresql_primary_node | default('ns1') }}
              {% else %}
              WARNING: Multiple nodes report as primary ({{ _detected_primaries | join(', ') }}). Split-brain? Using configured: {{ postgresql_primary_node | default('ns1') }}
              {% endif %}

# ============================================================================
# Phase 1: Infrastructure backbone (both nodes)
# ============================================================================

# Step 1: OS hardening, Docker, nftables, fail2ban, SSH keys
- name: "Phase 1: OS hardening and Docker (all nodes)"
  hosts: all
  tags: [common, phase1]
  roles:
    - common

# Step 2: WireGuard infrastructure tunnel (zero external dependencies)
- name: "Phase 1: WireGuard tunnel (all nodes)"
  hosts: dns_servers
  tags: [wireguard, phase1]
  roles:
    - wireguard

# Step 3: PostgreSQL HA — primary first, then standby
- name: "Phase 1: PostgreSQL HA — primary node"
  hosts: dns_servers
  serial: 1
  tags: [postgresql, phase1]
  roles:
    - role: postgresql_repmgr
      when: inventory_hostname == postgresql_primary_node

- name: "Phase 1: PostgreSQL HA — standby node"
  hosts: dns_servers
  serial: 1
  tags: [postgresql, phase1]
  roles:
    - role: postgresql_repmgr
      when: inventory_hostname != postgresql_primary_node

# ============================================================================
# Phase 2: Services on primary node (single play, shared SSH connection)
# ============================================================================
# All services deploy in dependency order on the primary node.
# DB migrations (Zitadel, Gatus) run here first; the secondary just starts.
# gather_facts: false — facts already gathered and cached in Phase 1.

- name: "Phase 2: All services (primary node)"
  hosts: "{{ dns_failover_primary | default('ns1') }}"
  gather_facts: false
  tags: [phase2, powerdns, dns, traefik, zitadel, netbird, netbird_management, gatus, portainer, backup, openziti]
  roles:
    - { role: powerdns, tags: [powerdns, dns, phase2] }
    - { role: traefik, tags: [traefik, phase2] }
    - { role: zitadel, tags: [zitadel, phase2] }
    - { role: netbird_management, tags: [netbird, netbird_management, phase2] }
    - { role: gatus, tags: [gatus, phase2] }
    - { role: portainer, tags: [portainer, phase2] }
    - { role: uptime_kuma, tags: [uptime-kuma, phase2] }
    - { role: openziti, tags: [openziti, phase2] }
    - { role: backup, tags: [backup, phase2] }

# ============================================================================
# Phase 3: Services on secondary node (single play, shared SSH connection)
# ============================================================================
# Same services on the secondary. DB migrations already complete from Phase 2.

- name: "Phase 3: All services (secondary node)"
  hosts: "dns_servers:!{{ dns_failover_primary | default('ns1') }}"
  gather_facts: false
  tags: [phase3, powerdns, dns, traefik, zitadel, netbird, netbird_management, gatus, portainer, backup, openziti]
  roles:
    - { role: powerdns, tags: [powerdns, dns, phase3] }
    - { role: traefik, tags: [traefik, phase3] }
    - { role: zitadel, tags: [zitadel, phase3] }
    - { role: netbird_management, tags: [netbird, netbird_management, phase3] }
    - { role: gatus, tags: [gatus, phase3] }
    - { role: portainer, tags: [portainer, phase3] }
    - { role: openziti, tags: [openziti, phase3] }
    - { role: backup, tags: [backup, phase3] }

# ============================================================================
# Phase 4: Peer enrollment (both nodes)
# ============================================================================

- name: "Phase 4: NetBird peer enrollment"
  hosts: netbird_peers
  gather_facts: false
  tags: [netbird, netbird_peer, phase4]
  roles:
    - netbird_peer

# ============================================================================
# Post-deploy: Encrypt secrets at rest with Ansible Vault (opt-in)
# ============================================================================
# Run explicitly: ansible-playbook site.yml --tags encrypt_secrets --vault-password-file ~/.vault_pass
# Encrypts all generated secret files in .generated_secrets/ (excluding SSH keys).
# Subsequent runs with --vault-password-file will auto-decrypt before use and re-encrypt after.

- name: "Post-deploy: Decrypt vault-encrypted secrets (if present)"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: Find secret files (excluding SSH keys)
      find:
        paths: "{{ playbook_dir }}/.generated_secrets"
        file_type: file
        recurse: false
      register: _secret_files

    - name: Check for vault-encrypted files
      command: "head -1 {{ item.path }}"
      loop: "{{ _secret_files.files }}"
      register: _secret_headers
      changed_when: false
      when: _secret_files.files | length > 0

    - name: Decrypt vault-encrypted secrets for this run
      command: "ansible-vault decrypt {{ item.item.path }}"
      loop: "{{ _secret_headers.results | default([]) }}"
      when:
        - item.stdout is defined
        - "'$ANSIBLE_VAULT;' in item.stdout"
      changed_when: true
      no_log: true

- name: "Post-deploy: Encrypt secrets at rest with Ansible Vault"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [never, encrypt_secrets]
  tasks:
    - name: Find secret files (excluding SSH keys)
      find:
        paths: "{{ playbook_dir }}/.generated_secrets"
        file_type: file
        recurse: false
      register: _secret_files

    - name: Check which files are not yet encrypted
      command: "head -1 {{ item.path }}"
      loop: "{{ _secret_files.files }}"
      register: _secret_headers
      changed_when: false

    - name: Encrypt unencrypted secret files
      command: "ansible-vault encrypt {{ item.item.path }}"
      loop: "{{ _secret_headers.results }}"
      when: "'$ANSIBLE_VAULT;' not in item.stdout"
      changed_when: true
      no_log: true
