---
# Hosting Platform -- Infrastructure Playbook
# Deploys fully redundant DNS + VPN mesh infrastructure on ns1 + ns2
#
# Three-phase deployment ensures the primary node is fully operational
# before the secondary joins:
#
#   Phase 1: Infrastructure backbone (both nodes)
#            common, wireguard, postgresql
#   Phase 2: Services on primary node (dns_failover_primary, default: ns1)
#            powerdns, traefik, zitadel, netbird, gatus, portainer, backup
#   Phase 3: Services on secondary node
#            Same services, same order — joins as replica
#   Phase 4: Peer enrollment (both nodes)
#            netbird peers
#
# DNS active-passive failover sends all traffic to the primary node.
# The secondary only receives traffic when the primary fails health checks.
#
# Phase tags (phase1, phase2, phase3, phase4) allow running specific phases.
# Service tags (traefik, zitadel, etc.) match plays in both phases 2 and 3,
# deploying primary first then secondary automatically.
#
# SSH keys: Per-server ED25519 keypairs are auto-generated in .generated_secrets/ssh/.
# First run (bootstrapping SSH key):
#   ansible-playbook site.yml -e 'ansible_ssh_private_key_file=~/hosting-platform.key'
# Subsequent runs use the per-server keys automatically (configured in group_vars/all.yml).

# Pre-play: Generate per-server SSH keypairs (shared across all playbooks)
- import_playbook: _ssh-keys.yml

# ============================================================================
# Phase 1: Infrastructure backbone (both nodes)
# ============================================================================

# Step 1: OS hardening, Docker, nftables, fail2ban, SSH keys
- name: "Phase 1: OS hardening and Docker (all nodes)"
  hosts: all
  tags: [common, phase1]
  roles:
    - common

# Step 2: WireGuard infrastructure tunnel (zero external dependencies)
- name: "Phase 1: WireGuard tunnel (all nodes)"
  hosts: dns_servers
  tags: [wireguard, phase1]
  roles:
    - wireguard

# Step 3: PostgreSQL HA — primary first, then standby
- name: "Phase 1: PostgreSQL HA — primary node"
  hosts: dns_servers
  serial: 1
  tags: [postgresql, phase1]
  roles:
    - role: postgresql_repmgr
      when: inventory_hostname == postgresql_primary_node

- name: "Phase 1: PostgreSQL HA — standby node"
  hosts: dns_servers
  serial: 1
  tags: [postgresql, phase1]
  roles:
    - role: postgresql_repmgr
      when: inventory_hostname != postgresql_primary_node

# ============================================================================
# Phase 2: Services on primary node
# ============================================================================
# The primary node (dns_failover_primary) gets all services first.
# After this phase, the primary is fully operational and serving traffic.

# Step 4: PowerDNS authoritative DNS
- name: "Phase 2: PowerDNS (primary node)"
  hosts: "{{ dns_failover_primary | default('ns1') }}"
  tags: [powerdns, dns, phase2]
  roles:
    - powerdns

# Step 5: Traefik reverse proxy + ACME wildcard TLS cert
- name: "Phase 2: Traefik (primary node)"
  hosts: "{{ dns_failover_primary | default('ns1') }}"
  tags: [traefik, phase2]
  roles:
    - traefik

# Step 6: Zitadel IAM (OIDC provider)
- name: "Phase 2: Zitadel (primary node)"
  hosts: "{{ dns_failover_primary | default('ns1') }}"
  tags: [zitadel, phase2]
  roles:
    - zitadel

# Step 7: NetBird VPN mesh management
- name: "Phase 2: NetBird management (primary node)"
  hosts: "{{ dns_failover_primary | default('ns1') }}"
  tags: [netbird, netbird_management, phase2]
  roles:
    - netbird_management

# Step 8: Gatus monitoring dashboard
- name: "Phase 2: Gatus monitoring (primary node)"
  hosts: "{{ dns_failover_primary | default('ns1') }}"
  tags: [gatus, phase2]
  roles:
    - gatus

# Step 9: Portainer Docker management
- name: "Phase 2: Portainer (primary node)"
  hosts: "{{ dns_failover_primary | default('ns1') }}"
  tags: [portainer, phase2]
  roles:
    - portainer

# Step 10: Backup to Hetzner Storagebox
- name: "Phase 2: Backup (primary node)"
  hosts: "{{ dns_failover_primary | default('ns1') }}"
  tags: [backup, phase2]
  roles:
    - backup

# ============================================================================
# Phase 3: Services on secondary node
# ============================================================================
# Same services deployed to the secondary node. DB migrations already ran
# on the primary in Phase 2, so the secondary just starts the services.

- name: "Phase 3: PowerDNS (secondary node)"
  hosts: "dns_servers:!{{ dns_failover_primary | default('ns1') }}"
  tags: [powerdns, dns, phase3]
  roles:
    - powerdns

- name: "Phase 3: Traefik (secondary node)"
  hosts: "dns_servers:!{{ dns_failover_primary | default('ns1') }}"
  tags: [traefik, phase3]
  roles:
    - traefik

- name: "Phase 3: Zitadel (secondary node)"
  hosts: "dns_servers:!{{ dns_failover_primary | default('ns1') }}"
  tags: [zitadel, phase3]
  roles:
    - zitadel

- name: "Phase 3: NetBird management (secondary node)"
  hosts: "dns_servers:!{{ dns_failover_primary | default('ns1') }}"
  tags: [netbird, netbird_management, phase3]
  roles:
    - netbird_management

- name: "Phase 3: Gatus monitoring (secondary node)"
  hosts: "dns_servers:!{{ dns_failover_primary | default('ns1') }}"
  tags: [gatus, phase3]
  roles:
    - gatus

- name: "Phase 3: Portainer (secondary node)"
  hosts: "dns_servers:!{{ dns_failover_primary | default('ns1') }}"
  tags: [portainer, phase3]
  roles:
    - portainer

- name: "Phase 3: Backup (secondary node)"
  hosts: "dns_servers:!{{ dns_failover_primary | default('ns1') }}"
  tags: [backup, phase3]
  roles:
    - backup

# ============================================================================
# Phase 4: Peer enrollment (both nodes)
# ============================================================================

- name: "Phase 4: NetBird peer enrollment"
  hosts: netbird_peers
  tags: [netbird, netbird_peer, phase4]
  roles:
    - netbird_peer
