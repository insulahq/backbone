---
# Hosting Platform — System Test Suite
#
# Comprehensive tests for all infrastructure components, service integrations,
# and failover scenarios.
#
# Usage:
#   # All non-destructive tests
#   ansible-playbook -i inventory/hosts.yml test-suite.yml
#
#   # Specific test groups
#   ansible-playbook -i inventory/hosts.yml test-suite.yml --tags dns
#   ansible-playbook -i inventory/hosts.yml test-suite.yml --tags postgresql
#
#   # Include destructive failover tests (will temporarily stop services)
#   ansible-playbook -i inventory/hosts.yml test-suite.yml --tags failover
#
# Available tags:
#   dns, tls, postgresql, netbird, zitadel, gatus, portainer,
#   backup, maintenance, cross_node, failover, summary
#
# The playbook collects results into _test_results and prints a summary table.
# Failed tests are reported as Ansible failures for CI integration.

- import_playbook: _ssh-keys.yml

# ============================================================================
# Play 1: Per-host infrastructure tests
# ============================================================================
- name: "Per-host infrastructure tests"
  hosts: dns_servers
  gather_facts: true
  any_errors_fatal: false
  vars:
    _test_results: []
    _peer: "{{ groups['dns_servers'] | difference([inventory_hostname]) | first }}"
    _peer_ip: "{{ hostvars[_peer]['ansible_host'] }}"
    _peer_wireguard_ip: "{{ hostvars[_peer]['wireguard_ip'] | default('') }}"
    # _pg_primary is detected dynamically in the first task
  pre_tasks:
    - name: "Detect current PostgreSQL primary"
      community.docker.docker_container_exec:
        container: postgresql
        command: psql -U postgres -tAc "SELECT NOT pg_is_in_recovery();"
      register: _pg_is_primary
      changed_when: false
      ignore_errors: true
      tags: [always]

    - name: "Set _pg_primary fact"
      set_fact:
        _pg_primary: "{{ inventory_hostname if (_pg_is_primary.stdout | default('') | trim) == 't' else groups['dns_servers'] | difference([inventory_hostname]) | first }}"
      tags: [always]
  tasks:

    # ------------------------------------------------------------------
    # DNS Tests
    # ------------------------------------------------------------------
    - name: "DNS | SOA resolution via local PowerDNS"
      command: "dig @127.0.0.1 {{ platform_domain }} SOA +short +time=5"
      register: _t_dns_soa
      changed_when: false
      ignore_errors: true
      tags: [dns]

    - name: "DNS | Record result — SOA resolution"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'DNS SOA resolution', 'host': inventory_hostname, 'passed': _t_dns_soa.rc == 0 and _t_dns_soa.stdout | length > 0}] }}"
      tags: [dns]

    - name: "DNS | A record for platform domain"
      command: "dig @127.0.0.1 {{ platform_domain }} A +short +time=5"
      register: _t_dns_a
      changed_when: false
      ignore_errors: true
      tags: [dns]

    - name: "DNS | Record result — A record"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'DNS A record (' + platform_domain + ')', 'host': inventory_hostname, 'passed': _t_dns_a.rc == 0 and hostvars[_pg_primary]['ansible_host'] in _t_dns_a.stdout}] }}"
      tags: [dns]

    - name: "DNS | Resolution of all service domains"
      command: "dig @127.0.0.1 {{ item }} A +short +time=5"
      loop:
        - "{{ netbird_dashboard_domain | default('vpn.' + platform_domain) }}"
        - "{{ zitadel_domain | default('auth.' + platform_domain) }}"
        - "{{ gatus_domain | default('status.' + platform_domain) }}"
      register: _t_dns_services
      changed_when: false
      ignore_errors: true
      tags: [dns]

    - name: "DNS | Record result — service domains"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'DNS resolution (' + item.item + ')', 'host': inventory_hostname, 'passed': item.rc == 0 and item.stdout | length > 0}] }}"
      loop: "{{ _t_dns_services.results }}"
      loop_control:
        label: "{{ item.item }}"
      tags: [dns]

    - name: "DNS | PowerDNS API health (via nginx)"
      uri:
        url: "http://{{ wireguard_ip | default('127.0.0.1', true) }}:{{ powerdns_nginx_api_port | default('8081') }}/api/v1/servers/localhost"
        headers:
          X-API-Key: "{{ powerdns_api_key }}"
        status_code: 200
        timeout: 10
      register: _t_dns_api
      ignore_errors: true
      tags: [dns]

    - name: "DNS | Record result — API health"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'PowerDNS API health', 'host': inventory_hostname, 'passed': _t_dns_api is success}] }}"
      tags: [dns]

    # ------------------------------------------------------------------
    # TLS / Traefik Tests
    # ------------------------------------------------------------------
    - name: "TLS | Traefik healthcheck (ping)"
      community.docker.docker_container_exec:
        container: traefik
        command: traefik healthcheck --ping
      register: _t_traefik_ping
      ignore_errors: true
      changed_when: false
      tags: [tls]

    - name: "TLS | Record result — Traefik ping"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'Traefik healthcheck', 'host': inventory_hostname, 'passed': _t_traefik_ping.rc | default(1) == 0}] }}"
      tags: [tls]

    - name: "TLS | Valid certificate for all service domains"
      uri:
        url: "https://{{ item }}"
        status_code: [200, 301, 302, 401, 403]
        validate_certs: true
        timeout: 10
      loop:
        - "{{ netbird_dashboard_domain | default('vpn.' + platform_domain) }}"
        - "{{ zitadel_domain | default('auth.' + platform_domain) }}"
        - "{{ gatus_domain | default('status.' + platform_domain) }}"
      register: _t_tls_certs
      ignore_errors: true
      run_once: true
      tags: [tls]

    - name: "TLS | Record result — valid certificates"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'Valid TLS cert (' + item.item + ')', 'host': inventory_hostname, 'passed': item is success}] }}"
      loop: "{{ _t_tls_certs.results }}"
      loop_control:
        label: "{{ item.item }}"
      run_once: true
      tags: [tls]

    - name: "TLS | HTTP→HTTPS redirect"
      uri:
        url: "http://{{ ansible_host }}"
        follow_redirects: none
        status_code: [301, 302, 308]
        timeout: 5
      register: _t_tls_redirect
      ignore_errors: true
      tags: [tls]

    - name: "TLS | Record result — HTTP redirect"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'HTTP→HTTPS redirect', 'host': inventory_hostname, 'passed': _t_tls_redirect is success}] }}"
      tags: [tls]

    # ------------------------------------------------------------------
    # PostgreSQL HA Tests
    # ------------------------------------------------------------------
    - name: "PostgreSQL | Container running and healthy"
      community.docker.docker_container_info:
        name: postgresql
      register: _t_pg_container
      ignore_errors: true
      tags: [postgresql]

    - name: "PostgreSQL | Record result — container health"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'PostgreSQL container running', 'host': inventory_hostname, 'passed': _t_pg_container is success and (_t_pg_container.container.State.Running | default(false))}] }}"
      tags: [postgresql]

    - name: "PostgreSQL | Accepts connections"
      community.docker.docker_container_exec:
        container: postgresql
        command: pg_isready -U postgres -h localhost
      register: _t_pg_ready
      ignore_errors: true
      changed_when: false
      tags: [postgresql]

    - name: "PostgreSQL | Record result — accepts connections"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'PostgreSQL accepts connections', 'host': inventory_hostname, 'passed': _t_pg_ready.rc | default(1) == 0}] }}"
      tags: [postgresql]

    - name: "PostgreSQL | Repmgr cluster status"
      community.docker.docker_container_exec:
        container: postgresql
        command: repmgr -f /etc/repmgr/repmgr.conf cluster show --compact
      register: _t_pg_repmgr
      ignore_errors: true
      changed_when: false
      tags: [postgresql]

    - name: "PostgreSQL | Record result — repmgr cluster"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'Repmgr cluster visible', 'host': inventory_hostname, 'passed': 'primary' in (_t_pg_repmgr.stdout | default('')) and 'running' in (_t_pg_repmgr.stdout | default(''))}] }}"
      tags: [postgresql]

    - name: "PostgreSQL | Streaming replication active (standby only)"
      community.docker.docker_container_exec:
        container: postgresql
        command: >
          psql -U postgres -tAc
          "SELECT status FROM pg_stat_wal_receiver"
      register: _t_pg_repl
      ignore_errors: true
      changed_when: false
      when: inventory_hostname != _pg_primary
      tags: [postgresql]

    - name: "PostgreSQL | Record result — replication streaming"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'PostgreSQL replication streaming', 'host': inventory_hostname, 'passed': 'streaming' in (_t_pg_repl.stdout | default(''))}] }}"
      when: inventory_hostname != _pg_primary
      tags: [postgresql]

    - name: "PostgreSQL | Application databases exist"
      community.docker.docker_container_exec:
        container: postgresql
        command: >
          psql -U postgres -tAc
          "SELECT datname FROM pg_database WHERE datname IN ('netbird','netbird_dex','netbird_events','pdns','pdnsadmin','zitadel','gatus') ORDER BY datname"
      register: _t_pg_dbs
      ignore_errors: true
      changed_when: false
      when: inventory_hostname == _pg_primary
      tags: [postgresql]

    - name: "PostgreSQL | Record result — application databases"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'Application databases exist (found: ' + (_t_pg_dbs.stdout | default('') | trim) + ')', 'host': inventory_hostname, 'passed': (_t_pg_dbs.stdout_lines | default([]) | length) >= 3}] }}"
      when: inventory_hostname == _pg_primary
      tags: [postgresql]

    - name: "PostgreSQL | Streaming replication active (primary check)"
      community.docker.docker_container_exec:
        container: postgresql
        command: >
          psql -U postgres -tAc
          "SELECT client_addr, state FROM pg_stat_replication"
      register: _t_pg_repl_primary
      ignore_errors: true
      changed_when: false
      when: inventory_hostname == _pg_primary
      tags: [postgresql]

    - name: "PostgreSQL | Record result — replication active"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'Replication streaming (' + (_t_pg_repl_primary.stdout | default('none') | trim) + ')', 'host': inventory_hostname, 'passed': 'streaming' in (_t_pg_repl_primary.stdout | default(''))}] }}"
      when: inventory_hostname == _pg_primary
      tags: [postgresql]

    # ------------------------------------------------------------------
    # PG Write Proxy Tests (pgproxy)
    # ------------------------------------------------------------------

    - name: "pgproxy | Docker container running"
      community.docker.docker_container_info:
        name: pgproxy
      register: _t_pgproxy_container
      ignore_errors: true
      tags: [postgresql, pgproxy]

    - name: "pgproxy | Record result — container running"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'pgproxy container running', 'host': inventory_hostname, 'passed': _t_pgproxy_container.container.State.Running | default(false)}] }}"
      tags: [postgresql, pgproxy]

    - name: "pgproxy | Docker container healthy"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'pgproxy container healthy', 'host': inventory_hostname, 'passed': _t_pgproxy_container.container.State.Health.Status | default('') == 'healthy'}] }}"
      tags: [postgresql, pgproxy]

    - name: "pgproxy | Write test via pgproxy (primary only)"
      community.docker.docker_container_exec:
        container: postgresql
        env:
          PGPASSWORD: "{{ postgresql_superuser_password }}"
        command: >
          psql -U postgres -h pgproxy -c
          "CREATE TABLE IF NOT EXISTS _pgproxy_test (id int); DROP TABLE _pgproxy_test;"
      register: _t_pgproxy_write
      ignore_errors: true
      changed_when: false
      when: inventory_hostname == _pg_primary
      tags: [postgresql, pgproxy]

    - name: "pgproxy | Record result — write via pgproxy"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'pgproxy write test', 'host': inventory_hostname, 'passed': _t_pgproxy_write.rc | default(1) == 0}] }}"
      when: inventory_hostname == _pg_primary
      tags: [postgresql, pgproxy]

    - name: "pgproxy | Target file exists"
      stat:
        path: /opt/postgresql/pgproxy-target
      register: _t_pgproxy_target
      tags: [postgresql, pgproxy]

    - name: "pgproxy | Record result — target file"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'pgproxy-target file exists', 'host': inventory_hostname, 'passed': _t_pgproxy_target.stat.exists | default(false)}] }}"
      tags: [postgresql, pgproxy]

    # ------------------------------------------------------------------
    # NetBird Tests
    # ------------------------------------------------------------------
    - name: "NetBird | Peer status"
      command: netbird status
      register: _t_nb_status
      changed_when: false
      ignore_errors: true
      tags: [netbird]

    - name: "NetBird | Record result — peer connected"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'NetBird peer connected', 'host': inventory_hostname, 'passed': 'Connected' in (_t_nb_status.stdout | default(''))}] }}"
      tags: [netbird]

    - name: "NetBird | Management API health"
      uri:
        url: "https://{{ netbird_dashboard_domain | default('vpn.' + platform_domain) }}/api/instance"
        status_code: 200
        validate_certs: "{{ netbird_validate_certs | default(false) }}"
        timeout: 10
      register: _t_nb_api
      ignore_errors: true
      tags: [netbird]

    - name: "NetBird | Record result — API health"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'NetBird API health', 'host': inventory_hostname, 'passed': _t_nb_api is success}] }}"
      tags: [netbird]

    - name: "NetBird | Cross-node mesh connectivity (ping peer)"
      command: "ping -c 2 -W 3 {{ _peer_wireguard_ip }}"
      register: _t_nb_ping
      changed_when: false
      ignore_errors: true
      when: _peer_wireguard_ip | length > 0
      tags: [netbird, cross_node]

    - name: "NetBird | Record result — mesh ping"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'NetBird mesh ping to ' + _peer, 'host': inventory_hostname, 'passed': _t_nb_ping.rc | default(1) == 0}] }}"
      when: _peer_wireguard_ip | length > 0
      tags: [netbird, cross_node]

    # ------------------------------------------------------------------
    # Backup Tests
    # ------------------------------------------------------------------
    - name: "Backup | Restic timer active"
      command: systemctl is-active restic-backup.timer
      register: _t_backup_timer
      changed_when: false
      ignore_errors: true
      tags: [backup]

    - name: "Backup | Record result — timer active"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'Restic backup timer active', 'host': inventory_hostname, 'passed': _t_backup_timer.rc | default(1) == 0}] }}"
      tags: [backup]

    - name: "Backup | backup server SFTP connectivity"
      shell: "echo quit | sftp -F /dev/null -oConnectTimeout=10 -oBatchMode=yes -oStrictHostKeyChecking=yes -oUserKnownHostsFile={{ restic_config_dir | default('/etc/restic') }}/known_hosts -i {{ restic_ssh_key_path | default('/etc/restic/hosting-platform.key') }} {{ backup_sftp_user }}@{{ backup_sftp_host }} 2>&1"
      register: _t_backup_sftp
      changed_when: false
      ignore_errors: true
      when: backup_sftp_user is defined and backup_sftp_host is defined
      tags: [backup]

    - name: "Backup | Record result — SFTP connectivity"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'backup server SFTP connection', 'host': inventory_hostname, 'passed': _t_backup_sftp.rc | default(1) == 0}] }}"
      when: backup_sftp_user is defined
      tags: [backup]

    # ------------------------------------------------------------------
    # Platform DNS Switch Tests
    # ------------------------------------------------------------------

    - name: "DNS Switch | Script exists and is executable"
      stat:
        path: /usr/local/bin/platform-dns-switch
      register: _t_dns_switch_script
      tags: [dns, maintenance]

    - name: "DNS Switch | Record result — script exists"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'platform-dns-switch script exists', 'host': inventory_hostname, 'passed': _t_dns_switch_script.stat.exists | default(false) and _t_dns_switch_script.stat.executable | default(false)}] }}"
      tags: [dns, maintenance]

    - name: "DNS Switch | Environment file exists"
      stat:
        path: /etc/platform-dns-switch.env
      register: _t_dns_switch_env
      tags: [dns, maintenance]

    - name: "DNS Switch | Record result — env file exists"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'platform-dns-switch.env exists', 'host': inventory_hostname, 'passed': _t_dns_switch_env.stat.exists | default(false)}] }}"
      tags: [dns, maintenance]

    - name: "DNS Switch | Verify primary-only mode (API connectivity)"
      shell: "/usr/local/bin/platform-dns-switch primary-only 2>&1"
      register: _t_dns_switch_po
      changed_when: false
      ignore_errors: true
      when: inventory_hostname == _pg_primary
      tags: [dns, maintenance]

    - name: "DNS Switch | Record result — primary-only API call"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'platform-dns-switch primary-only succeeds', 'host': inventory_hostname, 'passed': _t_dns_switch_po.rc | default(1) == 0}] }}"
      when: inventory_hostname == _pg_primary
      tags: [dns, maintenance]

    # ------------------------------------------------------------------
    # Maintenance Timer Tests
    # ------------------------------------------------------------------
    - name: "Maintenance | Docker cleanup timer"
      command: systemctl is-active docker-cleanup.timer
      register: _t_maint_docker
      changed_when: false
      ignore_errors: true
      tags: [maintenance]

    - name: "Maintenance | Disk monitor timer"
      command: systemctl is-active disk-monitor.timer
      register: _t_maint_disk
      changed_when: false
      ignore_errors: true
      tags: [maintenance]

    - name: "Maintenance | PostgreSQL maintenance timer"
      command: systemctl is-active pg-maintenance.timer
      register: _t_maint_pg
      changed_when: false
      ignore_errors: true
      tags: [maintenance]

    - name: "Maintenance | Record result — Docker cleanup timer"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'Docker cleanup timer', 'host': inventory_hostname, 'passed': _t_maint_docker.rc | default(1) == 0}] }}"
      tags: [maintenance]

    - name: "Maintenance | Record result — Disk monitor timer"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'Disk monitor timer', 'host': inventory_hostname, 'passed': _t_maint_disk.rc | default(1) == 0}] }}"
      tags: [maintenance]

    - name: "Maintenance | Record result — PG maintenance timer"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'PG maintenance timer', 'host': inventory_hostname, 'passed': _t_maint_pg.rc | default(1) == 0}] }}"
      tags: [maintenance]

    # ------------------------------------------------------------------
    # Container Health Tests (all Docker containers)
    # ------------------------------------------------------------------
    - name: "Containers | List all containers with health status"
      shell: 'docker ps --format "{% raw %}{{.Names}}|{{.Status}}{% endraw %}" 2>/dev/null'
      register: _t_containers
      changed_when: false
      ignore_errors: true
      tags: [dns, tls, postgresql, netbird, zitadel, gatus, portainer]

    - name: "Containers | Check for unhealthy containers"
      set_fact:
        _unhealthy_containers: "{{ _t_containers.stdout_lines | default([]) | select('search', 'unhealthy') | list }}"
      tags: [dns, tls, postgresql, netbird, zitadel, gatus, portainer]

    - name: "Containers | Record result — no unhealthy containers"
      set_fact:
        _test_results: "{{ _test_results + [{'name': 'No unhealthy containers' + (' (unhealthy: ' + (_unhealthy_containers | join(', ')) + ')' if _unhealthy_containers | length > 0 else ''), 'host': inventory_hostname, 'passed': _unhealthy_containers | length == 0}] }}"
      tags: [dns, tls, postgresql, netbird, zitadel, gatus, portainer]

    # ------------------------------------------------------------------
    # Store per-host results for final aggregation
    # ------------------------------------------------------------------
    - name: "Store per-host test results"
      set_fact:
        _host_test_results: "{{ _test_results }}"
      tags: [always]

# ============================================================================
# Play 2: Cluster-wide service and integration tests (run_once)
# ============================================================================
- name: "Cluster-wide service and integration tests"
  hosts: dns_servers
  gather_facts: false
  any_errors_fatal: false
  vars:
    _cluster_results: []
    _zitadel_url: "https://{{ zitadel_domain | default('auth.' + platform_domain) }}"
    _netbird_url: "https://{{ netbird_dashboard_domain | default('vpn.' + platform_domain) }}"
    _gatus_url: "https://{{ gatus_domain | default('status.' + platform_domain) }}"
  tasks:

    # ------------------------------------------------------------------
    # Zitadel Tests
    # ------------------------------------------------------------------
    - name: "Zitadel | OIDC Discovery endpoint"
      uri:
        url: "{{ _zitadel_url }}/.well-known/openid-configuration"
        status_code: 200
        return_content: true
        validate_certs: true
        timeout: 10
      register: _t_zitadel_oidc
      ignore_errors: true
      run_once: true
      tags: [zitadel]

    - name: "Zitadel | Record result — OIDC Discovery"
      set_fact:
        _cluster_results: "{{ _cluster_results + [{'name': 'Zitadel OIDC Discovery', 'host': 'cluster', 'passed': _t_zitadel_oidc is success and 'authorization_endpoint' in (_t_zitadel_oidc.content | default(''))}] }}"
      run_once: true
      tags: [zitadel]

    - name: "Zitadel | Admin console accessible"
      uri:
        url: "{{ _zitadel_url }}/ui/console"
        status_code: 200
        validate_certs: true
        timeout: 10
      register: _t_zitadel_console
      ignore_errors: true
      run_once: true
      tags: [zitadel]

    - name: "Zitadel | Record result — console accessible"
      set_fact:
        _cluster_results: "{{ _cluster_results + [{'name': 'Zitadel console accessible', 'host': 'cluster', 'passed': _t_zitadel_console is success}] }}"
      run_once: true
      tags: [zitadel]

    # ------------------------------------------------------------------
    # Gatus Service Tests
    # ------------------------------------------------------------------
    - name: "Gatus | Dashboard accessible"
      uri:
        url: "{{ _gatus_url }}/health"
        status_code: 200
        timeout: 10
      register: _t_gatus_health
      ignore_errors: true
      run_once: true
      tags: [gatus]

    - name: "Gatus | Record result — dashboard health"
      set_fact:
        _cluster_results: "{{ _cluster_results + [{'name': 'Gatus dashboard healthy', 'host': 'cluster', 'passed': _t_gatus_health is success}] }}"
      run_once: true
      tags: [gatus]

    - name: "Gatus | External endpoint accepts push (test event)"
      uri:
        url: "http://127.0.0.1:{{ gatus_local_port | default('8080') }}/api/v1/endpoints/test_push/external?success=true"
        method: POST
        headers:
          Authorization: "Bearer {{ gatus_external_token | default('') }}"
        status_code: [200, 404]
        timeout: 10
      register: _t_gatus_push
      ignore_errors: true
      run_once: true
      when: gatus_external_token | default('') | length > 0
      tags: [gatus]

    - name: "Gatus | Record result — external push"
      set_fact:
        _cluster_results: "{{ _cluster_results + [{'name': 'Gatus external endpoint accepts push', 'host': 'cluster', 'passed': _t_gatus_push is success}] }}"
      run_once: true
      when: gatus_external_token | default('') | length > 0
      tags: [gatus]

    # ------------------------------------------------------------------
    # Portainer Service Tests
    # ------------------------------------------------------------------
    - name: "Portainer | API accessible via NetBird"
      uri:
        url: "http://{{ hostvars[inventory_hostname]['wireguard_ip'] | default('127.0.0.1', true) }}:{{ portainer_port | default('9000') }}/api/system/status"
        status_code: [200, 302, 401]
        timeout: 10
      register: _t_portainer_api
      ignore_errors: true
      run_once: true
      tags: [portainer]

    - name: "Portainer | Record result — API accessible"
      set_fact:
        _cluster_results: "{{ _cluster_results + [{'name': 'Portainer API accessible', 'host': 'cluster', 'passed': _t_portainer_api is success}] }}"
      run_once: true
      tags: [portainer]

    # ------------------------------------------------------------------
    # Cross-node DNS consistency
    # ------------------------------------------------------------------
    - name: "Cross-node | Wait for PG replication to propagate SOA (15s)"
      pause:
        seconds: 15
      run_once: true
      tags: [cross_node, dns]

    - name: "Cross-node | DNS SOA serial matches between nodes"
      shell: "dig @{{ hostvars[item]['ansible_host'] }} {{ platform_domain }} SOA +short +time=5 | awk '{print $3}'"
      loop: "{{ groups['dns_servers'] }}"
      register: _t_cross_soa
      changed_when: false
      ignore_errors: true
      run_once: true
      tags: [cross_node, dns]

    - name: "Cross-node | Record result — SOA serial match"
      set_fact:
        _cluster_results: "{{ _cluster_results + [{'name': 'DNS SOA serial consistent across nodes (' + (_t_cross_soa.results | map(attribute='stdout') | join(' vs ') | default('unknown')) + ')', 'host': 'cluster', 'passed': _t_cross_soa.results | map(attribute='stdout') | unique | list | length == 1}] }}"
      run_once: true
      tags: [cross_node, dns]

    # ------------------------------------------------------------------
    # Store cluster results
    # ------------------------------------------------------------------
    - name: "Store cluster test results"
      set_fact:
        _cluster_test_results: "{{ _cluster_results }}"
      run_once: true
      tags: [always]

# ============================================================================
# Play 3: Failover tests (destructive — only with --tags failover)
# ============================================================================
- name: "Failover tests (destructive)"
  hosts: dns_servers
  gather_facts: false
  any_errors_fatal: false
  vars:
    _failover_results: []
  pre_tasks:
    - name: "Failover | Detect current PostgreSQL primary"
      community.docker.docker_container_exec:
        container: postgresql
        command: psql -U postgres -tAc "SELECT NOT pg_is_in_recovery();"
      register: _fo_pg_is_primary
      changed_when: false
      ignore_errors: true
      tags: [failover, never]

    - name: "Failover | Set dynamic test variables"
      set_fact:
        _pg_primary: "{{ inventory_hostname if (_fo_pg_is_primary.stdout | default('') | trim) == 't' else groups['dns_servers'] | difference([inventory_hostname]) | first }}"
      tags: [failover, never]

    - name: "Failover | Stabilize — ensure pgproxy targets and DNS are correct"
      shell: |
        ROLE=$(docker exec postgresql psql -U postgres -tAc "SELECT pg_is_in_recovery();")
        LOCAL_WG=$(docker exec postgresql printenv LOCAL_WG_IP)
        PEER_WG=$(docker exec postgresql printenv PEER_WG_IP)
        if [ "$ROLE" = "f" ]; then
          echo "$LOCAL_WG" > /opt/postgresql/pgproxy-target
        else
          echo "$PEER_WG" > /opt/postgresql/pgproxy-target
        fi
        docker restart pgproxy 2>/dev/null || true
      changed_when: false
      tags: [failover, never]

    - name: "Failover | Stabilize — wait for PowerDNS to be healthy"
      community.docker.docker_container_info:
        name: powerdns-auth
      register: _pdns_health
      retries: 12
      delay: 5
      until: _pdns_health.container.State.Health.Status | default('') == 'healthy'
      tags: [failover, never]

    - name: "Failover | Stabilize — switch DNS to current primary"
      command: /usr/local/bin/platform-dns-switch primary-only
      when: (_fo_pg_is_primary.stdout | default('') | trim) == 't'
      changed_when: true
      ignore_errors: true
      retries: 3
      delay: 3
      register: _dns_stab
      until: _dns_stab.rc == 0
      tags: [failover, never]

    - name: "Failover | Stabilize — wait for DNS propagation (15s)"
      pause:
        seconds: 15
      run_once: true
      tags: [failover, never]

    - name: "Failover | Resolve test nodes (primary = test node, standby = surviving)"
      set_fact:
        _test_node: "{{ _pg_primary }}"
        _surviving_node: "{{ groups['dns_servers'] | difference([_pg_primary]) | first }}"
        _surviving_key: "{{ playbook_dir }}/.generated_secrets/ssh/{{ groups['dns_servers'] | difference([_pg_primary]) | first }}"
      run_once: true
      tags: [failover, never]
  tasks:

    # --- DNS failover: stop Traefik, verify other node still serves ---
    - name: "Failover | Stop Traefik on {{ _test_node }} to test DNS failover"
      community.docker.docker_compose_v2:
        project_src: /opt/traefik
        state: stopped
      when: inventory_hostname == _test_node
      run_once: true
      tags: [failover, never]

    - name: "Failover | Wait for DNS cache expiry (35s)"
      pause:
        seconds: 35
      run_once: true
      tags: [failover, never]

    - name: "Failover | Verify surviving node still serves HTTPS"
      uri:
        url: "https://{{ hostvars[_surviving_node]['ansible_host'] }}"
        validate_certs: false
        status_code: [200, 301, 302, 308, 404]
        timeout: 10
      register: _t_fo_https
      ignore_errors: true
      run_once: true
      delegate_to: "{{ _surviving_node }}"
      vars:
        ansible_ssh_private_key_file: "{{ _surviving_key }}"
      tags: [failover, never]

    - name: "Failover | Record result — surviving node HTTPS"
      set_fact:
        _failover_results: "{{ _failover_results + [{'name': 'Surviving node serves HTTPS after Traefik stop on ' + _test_node, 'host': 'cluster', 'passed': _t_fo_https is success}] }}"
      run_once: true
      tags: [failover, never]

    - name: "Failover | Restart Traefik on {{ _test_node }}"
      community.docker.docker_compose_v2:
        project_src: /opt/traefik
        state: present
      when: inventory_hostname == _test_node
      run_once: true
      tags: [failover, never]

    - name: "Failover | Wait for Traefik to recover (15s)"
      pause:
        seconds: 15
      run_once: true
      tags: [failover, never]

    - name: "Failover | Verify recovered node serves HTTPS"
      uri:
        url: "https://{{ hostvars[_test_node]['ansible_host'] }}"
        validate_certs: false
        status_code: [200, 301, 302, 308, 404]
        timeout: 10
      register: _t_fo_recovery
      ignore_errors: true
      retries: 3
      delay: 5
      until: _t_fo_recovery is success
      when: inventory_hostname == _test_node
      tags: [failover, never]

    - name: "Failover | Record result — Traefik recovery"
      set_fact:
        _failover_results: "{{ _failover_results + [{'name': 'Traefik recovered on ' + _test_node, 'host': 'cluster', 'passed': _t_fo_recovery is success}] }}"
      run_once: true
      tags: [failover, never]

    # --- PostgreSQL failover: stop primary, verify standby promotes ---
    # NOTE: Do NOT combine run_once with when: inventory_hostname == ... (gotcha #49).
    # The when condition alone ensures exactly one host executes the task.
    - name: "Failover | Stop PostgreSQL on primary ({{ _pg_primary }})"
      community.docker.docker_compose_v2:
        project_src: /opt/postgresql
        state: stopped
      when: inventory_hostname == _pg_primary
      tags: [failover, never]

    - name: "Failover | Wait for repmgrd to detect failure and promote (90s)"
      pause:
        seconds: 90
      run_once: true
      tags: [failover, never]

    - name: "Failover | Check standby repmgr status after primary failure"
      community.docker.docker_container_exec:
        container: postgresql
        command: repmgr -f /etc/repmgr/repmgr.conf cluster show --compact
      register: _t_fo_pg_promote
      ignore_errors: true
      changed_when: false
      when: inventory_hostname != _pg_primary
      tags: [failover, never]

    - name: "Failover | Record result — standby promotion"
      set_fact:
        _failover_results: "{{ _failover_results + [{'name': 'Standby promoted to primary after failure', 'host': 'cluster', 'passed': 'primary' in (_t_fo_pg_promote.stdout | default(''))}] }}"
      when: inventory_hostname != _pg_primary
      tags: [failover, never]

    - name: "Failover | Verify PostgreSQL accepts writes on new primary"
      community.docker.docker_container_exec:
        container: postgresql
        command: >
          psql -U postgres -c "CREATE TABLE IF NOT EXISTS _failover_test (id int); DROP TABLE _failover_test;"
      register: _t_fo_pg_write
      ignore_errors: true
      changed_when: false
      retries: 3
      delay: 5
      until: _t_fo_pg_write.rc | default(1) == 0
      when: inventory_hostname != _pg_primary
      tags: [failover, never]

    - name: "Failover | Record result — writes on new primary"
      set_fact:
        _failover_results: "{{ _failover_results + [{'name': 'New primary accepts writes', 'host': 'cluster', 'passed': _t_fo_pg_write.rc | default(1) == 0}] }}"
      when: inventory_hostname != _pg_primary
      tags: [failover, never]

    - name: "Failover | Restart PostgreSQL on original primary"
      community.docker.docker_compose_v2:
        project_src: /opt/postgresql
        state: present
        recreate: always
      when: inventory_hostname == _pg_primary
      tags: [failover, never]

    - name: "Failover | Wait for original primary to rejoin as standby (60s)"
      pause:
        seconds: 60
      run_once: true
      tags: [failover, never]

    - name: "Failover | Verify both nodes are back in cluster"
      community.docker.docker_container_exec:
        container: postgresql
        command: repmgr -f /etc/repmgr/repmgr.conf cluster show --compact
      register: _t_fo_pg_rejoin
      ignore_errors: true
      changed_when: false
      when: inventory_hostname != _pg_primary
      tags: [failover, never]

    - name: "Failover | Record result — cluster rejoined"
      set_fact:
        _failover_results: "{{ _failover_results + [{'name': 'Original primary rejoined cluster', 'host': 'cluster', 'passed': (_t_fo_pg_rejoin.stdout | default('') | regex_findall('running') | length) >= 2}] }}"
      when: inventory_hostname != _pg_primary
      tags: [failover, never]

    # --- DNS switching: verify DNS records updated after failover/failback ---

    - name: "Failover | Verify DNS switched to surviving node after PG failover"
      command: "dig @{{ hostvars[_surviving_node]['ansible_host'] }} {{ platform_domain }} A +short +time=5"
      register: _t_fo_dns_switch
      changed_when: false
      ignore_errors: true
      run_once: true
      delegate_to: "{{ _surviving_node }}"
      vars:
        ansible_ssh_private_key_file: "{{ _surviving_key }}"
      tags: [failover, never]

    - name: "Failover | Record result — DNS points to surviving node"
      set_fact:
        _failover_results: "{{ _failover_results + [{'name': 'DNS switched to surviving node after PG failover', 'host': 'cluster', 'passed': hostvars[_surviving_node]['ansible_host'] in (_t_fo_dns_switch.stdout | default(''))}] }}"
      run_once: true
      tags: [failover, never]

    - name: "Failover | Verify DNS still points to surviving node after cluster rejoin"
      command: "dig @{{ hostvars[_surviving_node]['ansible_host'] }} {{ platform_domain }} A +short +time=5"
      register: _t_fo_dns_after_rejoin
      changed_when: false
      ignore_errors: true
      run_once: true
      delegate_to: "{{ _surviving_node }}"
      vars:
        ansible_ssh_private_key_file: "{{ _surviving_key }}"
      tags: [failover, never]

    - name: "Failover | Record result — DNS stays on surviving node (active-passive)"
      set_fact:
        _failover_results: "{{ _failover_results + [{'name': 'DNS points to surviving node after rejoin (active-passive, IP: ' + (_t_fo_dns_after_rejoin.stdout | default('') | trim) + ')', 'host': 'cluster', 'passed': hostvars[_surviving_node]['ansible_host'] in (_t_fo_dns_after_rejoin.stdout | default('')) and (_t_fo_dns_after_rejoin.stdout_lines | default([]) | length) == 1}] }}"
      run_once: true
      tags: [failover, never]

    - name: "Failover | Verify pgproxy write via surviving node after PG failover"
      community.docker.docker_container_exec:
        container: postgresql
        env:
          PGPASSWORD: "{{ postgresql_superuser_password }}"
        command: >
          psql -U postgres -h pgproxy -c
          "CREATE TABLE IF NOT EXISTS _pgproxy_fo_test (id int); DROP TABLE _pgproxy_fo_test;"
      register: _t_fo_pgproxy_write
      ignore_errors: true
      changed_when: false
      when: inventory_hostname != _pg_primary
      tags: [failover, never]

    - name: "Failover | Record result — pgproxy write after failover"
      set_fact:
        _failover_results: "{{ _failover_results + [{'name': 'pgproxy write works after PG failover', 'host': 'cluster', 'passed': _t_fo_pgproxy_write.rc | default(1) == 0}] }}"
      when: inventory_hostname != _pg_primary
      tags: [failover, never]

    # --- Service-level failover: verify surviving node serves via direct IP ---
    # Active-passive DNS: domain always points to PG primary. These tests verify
    # services respond on the surviving node via direct IP (not DNS resolution).

    - name: "Failover | Verify NetBird API on surviving node (direct IP)"
      uri:
        url: "https://{{ hostvars[_surviving_node]['ansible_host'] }}/api/instance"
        validate_certs: false
        status_code: [200, 401, 403]
        timeout: 15
        headers:
          Host: "{{ netbird_dashboard_domain | default('vpn.' + platform_domain) }}"
      register: _t_fo_netbird
      ignore_errors: true
      retries: 3
      delay: 5
      until: _t_fo_netbird is success
      delegate_to: "{{ _surviving_node }}"
      vars:
        ansible_ssh_private_key_file: "{{ _surviving_key }}"
      run_once: true
      tags: [failover, never]

    - name: "Failover | Record result — NetBird on surviving node"
      set_fact:
        _failover_results: "{{ _failover_results + [{'name': 'NetBird API responds on surviving node', 'host': 'cluster', 'passed': _t_fo_netbird.status | default(0) in [200, 401, 403]}] }}"
      run_once: true
      tags: [failover, never]

    - name: "Failover | Verify Zitadel on surviving node (direct IP)"
      uri:
        url: "https://{{ hostvars[_surviving_node]['ansible_host'] }}/debug/ready"
        validate_certs: false
        status_code: [200]
        timeout: 15
        headers:
          Host: "{{ zitadel_domain | default('auth.' + platform_domain) }}"
      register: _t_fo_zitadel
      ignore_errors: true
      retries: 3
      delay: 5
      until: _t_fo_zitadel is success
      delegate_to: "{{ _surviving_node }}"
      vars:
        ansible_ssh_private_key_file: "{{ _surviving_key }}"
      run_once: true
      tags: [failover, never]

    - name: "Failover | Record result — Zitadel on surviving node"
      set_fact:
        _failover_results: "{{ _failover_results + [{'name': 'Zitadel healthy on surviving node', 'host': 'cluster', 'passed': _t_fo_zitadel.status | default(0) == 200}] }}"
      run_once: true
      tags: [failover, never]

    # --- Full node outage: stop all services on test node, verify platform ---
    - name: "Failover | FULL NODE OUTAGE — stopping all services on {{ _test_node }}"
      community.docker.docker_compose_v2:
        project_src: "{{ item }}"
        state: stopped
      loop:
        - /opt/traefik
        - /opt/netbird
        - /opt/zitadel
        - /opt/gatus
        - /opt/portainer
        - /opt/powerdns
      when: inventory_hostname == _test_node
      ignore_errors: true
      tags: [failover, never]

    - name: "Failover | Wait for full node failover detection (45s)"
      pause:
        seconds: 45
      run_once: true
      tags: [failover, never]

    - name: "Failover | Verify DNS resolves during full node outage"
      command: "dig @{{ hostvars[_surviving_node]['ansible_host'] }} {{ platform_domain }} A +short +time=5"
      register: _t_fo_full_dns
      changed_when: false
      ignore_errors: true
      run_once: true
      delegate_to: "{{ _surviving_node }}"
      vars:
        ansible_ssh_private_key_file: "{{ _surviving_key }}"
      tags: [failover, never]

    - name: "Failover | Record result — DNS during full outage"
      set_fact:
        _failover_results: "{{ _failover_results + [{'name': 'DNS resolves during full node outage', 'host': 'cluster', 'passed': _t_fo_full_dns.stdout | default('') | length > 0}] }}"
      run_once: true
      tags: [failover, never]

    - name: "Failover | Verify PostgreSQL accessible during full node outage"
      community.docker.docker_container_exec:
        container: postgresql
        command: >
          psql -U postgres -c "SELECT pg_is_in_recovery();"
      register: _t_fo_full_pg
      ignore_errors: true
      changed_when: false
      delegate_to: "{{ _surviving_node }}"
      vars:
        ansible_ssh_private_key_file: "{{ _surviving_key }}"
      run_once: true
      tags: [failover, never]

    - name: "Failover | Record result — PostgreSQL during full outage"
      set_fact:
        _failover_results: "{{ _failover_results + [{'name': 'PostgreSQL accessible during full node outage', 'host': 'cluster', 'passed': _t_fo_full_pg.rc | default(1) == 0}] }}"
      run_once: true
      tags: [failover, never]

    - name: "Failover | FULL NODE RECOVERY — restarting all services on {{ _test_node }}"
      community.docker.docker_compose_v2:
        project_src: "{{ item }}"
        state: present
      loop:
        - /opt/traefik
        - /opt/powerdns
        - /opt/netbird
        - /opt/zitadel
        - /opt/gatus
        - /opt/portainer
      when: inventory_hostname == _test_node
      ignore_errors: true
      tags: [failover, never]

    - name: "Failover | Wait for full node recovery (90s)"
      pause:
        seconds: 90
      run_once: true
      tags: [failover, never]

    - name: "Failover | Verify DNS still points to single IP after recovery (active-passive)"
      command: "dig @{{ hostvars[_surviving_node]['ansible_host'] }} {{ platform_domain }} A +short +time=5"
      register: _t_fo_full_recovery_dns
      changed_when: false
      ignore_errors: true
      run_once: true
      delegate_to: "{{ _surviving_node }}"
      vars:
        ansible_ssh_private_key_file: "{{ _surviving_key }}"
      tags: [failover, never]

    - name: "Failover | Record result — DNS active-passive after recovery"
      set_fact:
        _failover_results: "{{ _failover_results + [{'name': 'DNS single-IP after recovery (active-passive)', 'host': 'cluster', 'passed': (_t_fo_full_recovery_dns.stdout_lines | default([]) | length) == 1}] }}"
      run_once: true
      tags: [failover, never]

    - name: "Failover | Verify Zitadel healthy on recovered node"
      uri:
        url: "https://{{ hostvars[_test_node]['ansible_host'] }}/debug/ready"
        validate_certs: false
        status_code: [200]
        timeout: 15
        headers:
          Host: "{{ zitadel_domain | default('auth.' + platform_domain) }}"
      register: _t_fo_recovery_zitadel
      ignore_errors: true
      retries: 6
      delay: 10
      until: _t_fo_recovery_zitadel is success
      delegate_to: "{{ _test_node }}"
      vars:
        ansible_ssh_private_key_file: "{{ playbook_dir }}/.generated_secrets/ssh/{{ _test_node }}"
      run_once: true
      tags: [failover, never]

    - name: "Failover | Verify NetBird healthy on recovered node"
      uri:
        url: "https://{{ hostvars[_test_node]['ansible_host'] }}/api/instance"
        validate_certs: false
        status_code: [200, 401, 403]
        timeout: 15
        headers:
          Host: "{{ netbird_dashboard_domain | default('vpn.' + platform_domain) }}"
      register: _t_fo_recovery_netbird
      ignore_errors: true
      retries: 12
      delay: 10
      until: _t_fo_recovery_netbird is success
      delegate_to: "{{ _test_node }}"
      vars:
        ansible_ssh_private_key_file: "{{ playbook_dir }}/.generated_secrets/ssh/{{ _test_node }}"
      run_once: true
      tags: [failover, never]

    - name: "Failover | Record result — Zitadel recovery"
      set_fact:
        _failover_results: "{{ _failover_results + [{'name': 'Zitadel healthy on recovered node', 'host': 'cluster', 'passed': _t_fo_recovery_zitadel is success}] }}"
      run_once: true
      tags: [failover, never]

    - name: "Failover | Record result — NetBird recovery"
      set_fact:
        _failover_results: "{{ _failover_results + [{'name': 'NetBird healthy on recovered node', 'host': 'cluster', 'passed': _t_fo_recovery_netbird is success}] }}"
      run_once: true
      tags: [failover, never]

    - name: "Store failover results"
      set_fact:
        _failover_test_results: "{{ _failover_results }}"
      run_once: true
      tags: [failover, never]

# ============================================================================
# Play 4: Test summary
# ============================================================================
- name: "Test summary"
  hosts: dns_servers
  gather_facts: false
  any_errors_fatal: false
  tasks:

    - name: "Aggregate all test results"
      set_fact:
        _all_results: >-
          {{ (hostvars[groups['dns_servers'][0]]['_host_test_results'] | default([])) +
             (hostvars[groups['dns_servers'][1]]['_host_test_results'] | default([])) +
             (hostvars[groups['dns_servers'][0]]['_cluster_test_results'] | default([])) +
             (hostvars[groups['dns_servers'][0]]['_failover_test_results'] | default([])) }}
      run_once: true
      tags: [always]

    - name: "Calculate summary"
      set_fact:
        _total: "{{ _all_results | length }}"
        _passed: "{{ _all_results | selectattr('passed') | list | length }}"
        _failed_list: "{{ _all_results | rejectattr('passed') | list }}"
      run_once: true
      tags: [always]

    - name: "Print test results"
      debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════╗
          ║               HOSTING PLATFORM TEST RESULTS                  ║
          ╠══════════════════════════════════════════════════════════════╣
          {% for r in _all_results %}
          ║ {{ '✓' if r.passed else '✗' }} [{{ '%-7s' | format(r.host) }}] {{ '%-48s' | format(r.name[:48]) }}║
          {% endfor %}
          ╠══════════════════════════════════════════════════════════════╣
          ║  Total: {{ '%-4s' | format(_total) }} Passed: {{ '%-4s' | format(_passed) }} Failed: {{ '%-4s' | format((_total | int) - (_passed | int)) }}                        ║
          ╚══════════════════════════════════════════════════════════════╝
      run_once: true
      tags: [always]

    - name: "Fail playbook if any tests failed"
      fail:
        msg: |
          {{ (_failed_list | length) }} test(s) FAILED:
          {% for r in _failed_list %}
            - [{{ r.host }}] {{ r.name }}
          {% endfor %}
      when: _failed_list | length > 0
      run_once: true
      tags: [always]
