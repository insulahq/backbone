---
# DNS-only playbook — use when you only want to reconfigure DNS.
# Usage: ansible-playbook -i inventory/hosts.yml dns.yml

- name: Common hardening on all DNS servers
  hosts: dns_servers
  become: true
  roles:
    - common

- name: Deploy PowerDNS master (ns1)
  hosts: dns_master
  become: true
  roles:
    - powerdns-master

- name: Deploy PowerDNS slave (ns2)
  hosts: dns_slave
  become: true
  roles:
    - powerdns-slave
