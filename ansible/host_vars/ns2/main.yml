---
# Host-specific variables for ns2 (Helsinki — secondary DNS + NetBird peer)

server_role: "dns-slave-netbird-peer"
server_location: "Hetzner Helsinki (hel1)"
server_region: "fi"

# PowerDNS role on this host
pdns_role: "slave"
pdns_master: false
pdns_slave: true

# ns2 pulls zones from ns1 via AXFR — no local PostgreSQL needed
pdns_db_local: false

# ns2 is a NetBird peer, not the management server
netbird_role: "peer"
