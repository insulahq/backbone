---
# Host-specific variables for ns1 (Falkenstein — primary DNS + NetBird management)

server_role: "dns-master-netbird-management"
server_location: "Hetzner Falkenstein (nbg1)"
server_region: "de"

# PowerDNS role on this host
pdns_role: "master"
pdns_master: true
pdns_slave: false

# PostgreSQL is installed locally on ns1 (PowerDNS backend)
pdns_db_local: true
