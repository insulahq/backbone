---
# Deploy Gatus monitoring dashboard
# Primary node runs first — DB creation and schema migration need write
# access to PostgreSQL (gotcha 86).

- import_playbook: _ssh-keys.yml

- name: Deploy Gatus on primary node first
  hosts: "{{ dns_failover_primary | default('ns1') }}"
  tags: [gatus]
  roles:
    - gatus

- name: Deploy Gatus on secondary node
  hosts: "dns_servers:!{{ dns_failover_primary | default('ns1') }}"
  tags: [gatus]
  roles:
    - gatus
