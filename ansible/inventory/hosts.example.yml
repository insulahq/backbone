---
# Hosting Platform -- Server Inventory
# Copy to hosts.yml and fill in your values.
#
# IMPORTANT: Before deploying, you must configure glue records at your domain
# registrar pointing ns1.<domain> and ns2.<domain> to the public IPs below.
# These servers will be authoritative DNS servers for your domain.

all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    # NOTE: ansible_ssh_private_key_file is set in group_vars/all.yml (per-server keys).
    # Bootstrapping SSH key: ansible-playbook site.yml -e 'ansible_ssh_private_key_file=~/hosting-platform.key'

  children:
    dns_servers:
      hosts:
        ns1:
          ansible_host: <NS1_PUBLIC_IPV4>
          public_ipv6: <NS1_PUBLIC_IPV6>
          hostname: ns1.example.com
          location: location_a
          wireguard_ip: 10.100.0.1        # WireGuard tunnel IP (static, pre-assigned)
        ns2:
          ansible_host: <NS2_PUBLIC_IPV4>
          public_ipv6: <NS2_PUBLIC_IPV6>
          hostname: ns2.example.com
          location: location_b
          wireguard_ip: 10.100.0.2        # WireGuard tunnel IP (static, pre-assigned)

    netbird_peers:
      hosts:
        ns1:
        ns2:

    backup_targets:
      hosts:
        ns1:
        ns2:
