---
# Copy this file to inventory/hosts.yml and fill in real values.
# hosts.yml is gitignored.

all:
  children:
    dns_servers:
      children:
        dns_master:
          hosts:
            ns1:
              ansible_host: "YOUR_NS1_PUBLIC_IP"
              ansible_user: root
              ansible_ssh_private_key_file: ~/YOUR_SSH_KEY_NAME
        dns_slave:
          hosts:
            ns2:
              ansible_host: "YOUR_NS2_PUBLIC_IP"
              ansible_user: root
              ansible_ssh_private_key_file: ~/YOUR_SSH_KEY_NAME

    netbird_management:
      hosts:
        ns1:                                    # NetBird management co-hosted on ns1

    management_api:
      hosts:
        admin1:
          ansible_host: "YOUR_ADMIN1_PUBLIC_IP"
          ansible_user: root
          ansible_ssh_private_key_file: ~/YOUR_SSH_KEY_NAME

    k3s_control:
      hosts:
        admin1:                                 # k3s control plane on admin1 (Phase 1 PoC)

    netbird_peers:
      hosts:
        ns1:                                    # ns1 enrolls as a peer on its own mesh
        ns2:                                    # ns2 enrolls as a NetBird peer
        admin1:                                 # management API server + k3s control plane
