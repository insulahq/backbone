---
# Hosting Platform -- Server Inventory
# Copy to hosts.yml and fill in your values.

all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    # NOTE: ansible_ssh_private_key_file is set in group_vars/all.yml (per-server keys).
    # Bootstrapping SSH key: ansible-playbook site.yml -e 'ansible_ssh_private_key_file=~/hosting-platform.key'

  children:
    dns_servers:
      hosts:
        ns1:
          ansible_host: <NS1_PUBLIC_IP>
          hostname: ns1.example.com
          location: hetzner_falkenstein
          netbird_ip: <NS1_NETBIRD_IP>   # Assigned after NetBird enrollment
          public_ipv6: <NS1_PUBLIC_IPV6> # Hetzner IPv6 address (for AAAA glue records)
        ns2:
          ansible_host: <NS2_PUBLIC_IP>
          hostname: ns2.example.com
          location: hetzner_helsinki
          netbird_ip: <NS2_NETBIRD_IP>   # Assigned after NetBird enrollment
          public_ipv6: <NS2_PUBLIC_IPV6> # Hetzner IPv6 address (for AAAA glue records)

    netbird_peers:
      hosts:
        ns1:
        ns2:

    backup_targets:
      hosts:
        ns1:
        ns2:
