---
# Deploy Zitadel IAM
# Primary node runs first — start-from-init runs DB migrations that need
# write access to PostgreSQL (gotcha 86).

- import_playbook: _ssh-keys.yml

- name: Deploy Zitadel on primary node first
  hosts: "{{ dns_failover_primary | default('ns1') }}"
  tags: [zitadel]
  roles:
    - zitadel

- name: Deploy Zitadel on secondary node
  hosts: "dns_servers:!{{ dns_failover_primary | default('ns1') }}"
  tags: [zitadel]
  roles:
    - zitadel
