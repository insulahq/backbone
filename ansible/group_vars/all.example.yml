---
# Hosting Platform -- Global Variables
# Copy to all.yml and fill in your values.
# This file is gitignored -- never commit the real all.yml.

# ============================================================================
# OS & System
# ============================================================================
timezone: UTC

# ============================================================================
# SSH & Security
# ============================================================================
ssh_port: 22
ssh_break_glass_enabled: true

# Per-server SSH keypairs — auto-generated in .generated_secrets/ssh/ on first run.
# Each server gets its own ED25519 keypair. The public key is deployed to
# authorized_keys by the common role. For bootstrap (first deploy), override
# with your bootstrapping SSH key:
#   ansible-playbook site.yml -e 'ansible_ssh_private_key_file=~/hosting-platform.key'
ansible_ssh_private_key_file: "{{ playbook_dir }}/.generated_secrets/ssh/{{ inventory_hostname }}"

# ============================================================================
# Domain
# ============================================================================
platform_domain: example.com

# ============================================================================
# DNS Failover (active-passive with health checks)
# ============================================================================
# dns_failover_primary: ns1        # Preferred server (default in role)
# dns_health_check_enabled: false  # LUA ifurlup() disabled by default (gotcha 130); static A/AAAA used instead
# dns_health_check_ttl: 30         # DNS TTL in seconds (default in role)
# dns_health_check_timeout: 5      # HTTP check timeout in seconds (default in role)

# ============================================================================
# WireGuard Infrastructure Tunnel
# ============================================================================
# WireGuard provides the zero-dependency private backbone for PostgreSQL
# replication, PowerDNS API, and all internal service communication.
# IPs are assigned per-host in inventory/hosts.yml (wireguard_ip).
# wireguard_port: 51810           # UDP port (default in role)
# wireguard_interface: wg0        # Interface name (default in role)

# ============================================================================
# PostgreSQL HA (shared by PowerDNS + NetBird + Zitadel + Gatus)
# ============================================================================
# Which node is the initial primary (ns1 or ns2)
# postgresql_primary_node is set in roles/postgresql_repmgr/defaults/main.yml
# This should match dns_failover_primary (default: ns1) — ns1 is primary for everything.
# postgresql_primary_node: ns1

# REQUIRED: These must be set before first deploy.
# Generate once with: openssl rand -base64 22
# Must match on both nodes — shared PostgreSQL HA cluster.
postgresql_superuser_password: "<GENERATE: openssl rand -base64 22>"
postgresql_repmgr_password: "<GENERATE: openssl rand -base64 22>"
postgresql_netbird_password: "<GENERATE: openssl rand -base64 22>"
postgresql_netbird_dex_password: "<GENERATE: openssl rand -base64 22>"
postgresql_netbird_events_password: "<GENERATE: openssl rand -base64 22>"

# ============================================================================
# PowerDNS (both nodes, shared PostgreSQL HA backend)
# ============================================================================
# REQUIRED: Set before first deploy. Used by both PowerDNS and Traefik (DNS-01 ACME).
# Generate with: openssl rand -base64 48
# If left undefined, auto-generated by the PowerDNS role on first run.
# Pre-generating keeps the value in group_vars for easy reference.
powerdns_api_key: "<GENERATE: openssl rand -base64 48>"

# ============================================================================
# Zitadel IAM (central identity provider)
# ============================================================================
# Domain for the Zitadel login/console UI
zitadel_domain: "auth.{{ platform_domain }}"

# Organization name shown in the console
zitadel_org_name: "Hosting Platform"

# Initial admin user (password change required on first login)
zitadel_admin_username: "admin"
zitadel_admin_email: "admin@{{ platform_domain }}"

# If left undefined, auto-generated and persisted in .generated_secrets/
# zitadel_db_password: "<GENERATE>"
# zitadel_admin_password: "<GENERATE>"
# CRITICAL: masterkey CANNOT be changed after initialization — back it up!
# zitadel_masterkey: "<GENERATE: 32 chars>"

# SMTP for user invitations and password resets (optional, can be configured later in console)
# zitadel_smtp_host: "smtp.example.com:587"
# zitadel_smtp_user: "noreply@example.com"
# zitadel_smtp_password: "<YOUR_SMTP_PASSWORD>"
# zitadel_smtp_tls: true
# zitadel_smtp_from: "noreply@example.com"
# zitadel_smtp_from_name: "Hosting Platform"

# ============================================================================
# NetBird VPN Mesh
# ============================================================================
# Management URL (vpn.<domain>, served via Traefik)
netbird_management_url: "https://vpn.{{ platform_domain }}"

# Reusable setup key for peer enrollment — created in Step 8 via the dashboard.
# Create via dashboard (Settings > Setup Keys) after Zitadel + NetBird are deployed.
netbird_setup_key: ""

# Internal peer DNS domain — peers resolve as <hostname>.<domain>
# e.g., with "netbird": ns1.netbird, ns2.netbird
# Default: "netbird" (override in group_vars/all.yml if needed)
netbird_peer_dns_domain: "netbird.vpn"

# Secrets -- auto-generated and persisted in .generated_secrets/ if left undefined.
# netbird_relay_auth_secret: "<GENERATE: openssl rand -hex 32>"
# netbird_datastore_encryption_key: "<GENERATE: openssl rand -base64 32>"

# ============================================================================
# Gatus Monitoring (HA status dashboard + alert receiver)
# ============================================================================
# Dashboard domain (A/AAAA records auto-created via PowerDNS API)
gatus_domain: "status.{{ platform_domain }}"

# Notification targets — configure at least one to receive alerts.
# After setting, re-deploy: ansible-playbook -i inventory/hosts.yml deploy-gatus.yml
# gatus_alerting_slack_webhook: "https://hooks.slack.com/services/..."
# gatus_alerting_discord_webhook: "https://discord.com/api/webhooks/..."
# gatus_alerting_ntfy_url: "https://ntfy.sh"
# gatus_alerting_ntfy_topic: "platform-alerts-sma98dalblk2anbc"
# gatus_alerting_telegram_token: "<BOT_TOKEN>"
# gatus_alerting_telegram_id: "<CHAT_ID>"
# gatus_alerting_email_host: "smtp.example.com"
# gatus_alerting_email_port: 587
# gatus_alerting_email_username: "alerts@example.com"
# gatus_alerting_email_password: "<SMTP_PASSWORD>"
# gatus_alerting_email_from: "alerts@example.com"
# gatus_alerting_email_to: "admin@example.com"

# ============================================================================
# Backup (Restic to SFTP or S3-compatible storage)
# ============================================================================
# Set to false to skip backup deployment (e.g., no credentials yet)
backup_enabled: false

# Backend type: "sftp" or "s3"
backup_backend: sftp

# --- SFTP backend (default) ---
backup_sftp_user: <YOUR_SFTP_USER>
backup_sftp_host: <YOUR_SFTP_HOST>
backup_sftp_path: backups
# backup_sftp_port: 23  # Hetzner Storage Box uses port 23 (default: 22)
# restic_ssh_key_src: "~/hosting-platform.key"  # SSH key on control machine

# --- S3 backend (any S3-compatible service) ---
# Uncomment and set backup_backend: s3 to use S3 instead of SFTP
# backup_s3_endpoint: s3.eu-central-1.amazonaws.com  # AWS, MinIO, Wasabi, Backblaze, etc.
# backup_s3_bucket: my-hosting-backups
# backup_s3_path: ""                                  # optional prefix inside bucket
# backup_s3_access_key: <YOUR_ACCESS_KEY>
# backup_s3_secret_key: <YOUR_SECRET_KEY>
# backup_s3_region: eu-central-1                      # optional, some providers require it

# If left undefined, auto-generated and persisted in .generated_secrets/
# WARNING: changing this after repo init makes existing backups inaccessible (gotcha 10)
# restic_password: "<GENERATE: openssl rand -base64 22>"

# Backup paths per server
# /opt covers all service configs + data (Traefik TLS certs, PowerDNS, NetBird,
# Zitadel, Gatus, Portainer). PG data is in a Docker volume — backed up via
# pg_dumpall piped to restic stdin, not file paths.
ns1_backup_paths:
  - /opt                    # All service configs + bind-mount data
  - /etc/restic             # Backup config (repo password)
  - /root/.ssh              # SSH keys
  - /etc/wireguard          # WireGuard private keys + config

ns2_backup_paths:
  - /opt
  - /etc/restic
  - /root/.ssh
  - /etc/wireguard

# ============================================================================
# Alerting (fallback raw webhook — used when Gatus is not deployed)
# ============================================================================
# Leave empty if using Gatus (recommended).
alert_webhook_url: ""
