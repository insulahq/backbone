---
# Phoenix Host — Deploy NetBird HA Stack
# Full deployment sequence for NetBird high-availability on ns1 + ns2:
#   1. Standalone Traefik (creates traefik_public Docker network, handles TLS)
#   2. PostgreSQL HA (repmgr automatic failover)
#   3. PowerDNS (both nodes, Native mode, shared PostgreSQL HA backend)
#   4. NetBird Management (both nodes, uses PostgreSQL multi-host DSN)
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml deploy-netbird-ha.yml

- name: Deploy standalone Traefik reverse proxy
  hosts: dns_servers
  roles:
    - traefik

- name: Deploy PostgreSQL primary/standby with repmgr
  hosts: dns_servers
  serial: 1
  roles:
    - postgresql_repmgr

- name: Deploy PowerDNS (both nodes, shared PostgreSQL HA)
  hosts: dns_servers
  roles:
    - powerdns

- name: Deploy NetBird management server
  hosts: dns_servers
  roles:
    - netbird_management
