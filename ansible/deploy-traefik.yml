---
# Hosting Platform — Deploy Standalone Traefik
# Deploys shared Traefik reverse proxy with traefik_public Docker network
# Run BEFORE deploying netbird_management or any service that needs TLS termination
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml deploy-traefik.yml
#   ansible-playbook -i inventory/hosts.yml deploy-traefik.yml --limit ns2

- import_playbook: _ssh-keys.yml

- name: Deploy standalone Traefik reverse proxy
  hosts: dns_servers
  tags: [traefik]
  roles:
    - traefik
