---
# Deploy the ntfy push notification server
#
# Primary node runs first — it creates the database and role, and ntfy
# migrates its own schema there on first start. The secondary then deploys
# the same stack and is immediately fenced (stopped): ntfy has no clustering,
# so a second live instance would answer subscriptions and deliver nothing.
# See roles/ntfy/defaults/main.yml.

- import_playbook: _ssh-keys.yml

- name: Deploy ntfy on primary node first
  hosts: "{{ dns_failover_primary | default('ns1') }}"
  tags: [ntfy]
  roles:
    - ntfy

- name: Deploy ntfy on secondary node
  hosts: "dns_servers:!{{ dns_failover_primary | default('ns1') }}"
  tags: [ntfy]
  roles:
    - ntfy
